[project]
name = "purrcat"
version = "0.1.0"
description = "PurrCat Agent Framework"
requires-python = ">=3.10"

dependencies = [
    # 基础包
    "numpy>=1.26.0", "pydantic>=2.5.0", "networkx>=3.1",
    
    # 核心与大模型
    "PyYAML>=6.0.1", "nest-asyncio>=1.6.0",
    "openai>=1.75.0", "json-repair>=0.30.0", "pyvis>=0.3.2",

    # MCP 与 插件协议
    "mcp>=0.1.0",

    # Web 搜索与抓取：Bing 结果页 + 目标页面都用 curl_cffi 直抓，不依赖无头浏览器
    "curl-cffi>=0.6.0", "beautifulsoup4>=4.12.3",
    "markdown>=3.5.0", "markdownify>=0.11.6",

    # 系统与沙盒：只装文档读取所需格式，去掉音频转录（speechrecognition）等无关 extras
    "docker>=7.0.0", "pexpect>=4.9.0", "markitdown[pdf,docx,xlsx,xls,pptx]>=0.0.1", "ruff>=0.3.0",

    # RAG 检索：embedding 用 onnxruntime 加载原模型，不再依赖 torch/transformers；
    # 模型权重由 embedding_setup 用 curl_cffi 多源直连下载，不需要 huggingface_hub
    "jieba>=0.42.1", "rank_bm25>=0.2.2",
    "chromadb>=0.5.0",
    "onnxruntime>=1.17.0", "tokenizers>=0.15.0",

    # Web框架与 UI
    "fastapi>=0.109.0", "uvicorn>=0.27.0",
    "aiofiles>=23.2.1",

    # 终端 PTY (Windows 伪终端，让 xterm.js 获得真终端体验：backspace/tab/颜色/交互)
    "pywinpty>=2.0.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "l0: 单元测试，纯逻辑，秒级，不碰网络/模型/Electron",
    "l1: 集成测试，跨模块，fake 边界，临时数据目录",
    "l2: 桌面 E2E，Electron，手动或夜间运行，不进 PR 门禁",
    "l3: 静态红线与契约检查，源码扫描、文档同步",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
