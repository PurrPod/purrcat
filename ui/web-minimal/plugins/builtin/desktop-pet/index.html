<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: transparent; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #26303b; }
  .pet { display: flex; flex-direction: column; height: 100%; width: 300px; }
  .pet-head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 12px; cursor: grab; user-select: none; }
  .pet-head:active { cursor: grabbing; }
  .pet-close { flex: none; width: 24px; height: 24px; margin-left: auto; border: none; background: transparent; color: #8b96a3; font-size: 14px; line-height: 1; border-radius: 6px; cursor: pointer; }
  .pet-close:hover { background: #f2f4f7; color: #26303b; }
  .pet-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg,#9ec5fe,#4c7bff); color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; flex: none; }
  .pet-info { flex: 1; }
  .pet-title { font-weight: 600; font-size: 13px; }
  .pet-sub { font-size: 11px; color: #8b96a3; }
  .pet-actions { padding: 0 12px 10px; display: flex; gap: 8px; }
  .pet-actions button { flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid #d6dbe1; background:#fff; color:#26303b; cursor:pointer; font-size:12px; }
  .pet-actions button:hover { border-color:#4c7bff; color:#4c7bff; }
  .app-list { flex: 1; overflow: auto; padding: 0 10px 10px; }
  .app-list::-webkit-scrollbar { width: 6px; }
  .app-list::-webkit-scrollbar-thumb { background:#d9dee4; border-radius:3px; }
  .app-item { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 8px; border-radius:7px; }
  .app-item:hover { background:#f2f4f7; }
  .app-name { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .app-launch { flex:none; border:none; background:#eef2ff; color:#4c7bff; border-radius:6px; padding:2px 8px; cursor:pointer; font-size:11px; }
  .status { padding: 0 12px 10px; font-size: 11px; color: #8b96a3; min-height: 16px; }
</style>
</head>
<body>
  <div class="pet">
    <div class="pet-head">
      <div class="pet-avatar">猫</div>
      <div class="pet-info">
        <div class="pet-title">桌宠 · 测试插件</div>
        <div class="pet-sub" id="greet">--</div>
      </div>
      <button class="pet-close" id="petClose" title="关闭桌宠">✕</button>
    </div>
    <div class="pet-actions">
      <button id="btnList">枚举本地应用</button>
    </div>
    <div class="app-list" id="list"></div>
    <div class="status" id="status"></div>
  </div>
<script>
(function () {
  var seq = 0;
  function callAction(actionId, payload) {
    return new Promise(function (resolve, reject) {
      var id = ++seq;
      function onMsg(e) {
        var m = e.data;
        if (m && m.type === 'callActionResult' && m.id === id) {
          window.removeEventListener('message', onMsg);
          if (m.ok) resolve(m.data); else reject(new Error(m.error));
        }
      }
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type: 'callAction', id: id, actionId: actionId, payload: payload || {} }, '*');
    });
  }

  // 插件后端子进程 RPC：枚举/启动本地应用
  var rpc = function (handler, payload) { return callAction('plugin.rpc', { plugin_id: 'desktop-pet', handler: handler, payload: payload || {} }); };

  var listEl = document.getElementById('list');
  var statusEl = document.getElementById('status');

  function renderApps(result) {
    listEl.innerHTML = '';
    var apps = (result && result.apps) || [];
    if (!apps.length) {
      statusEl.textContent = '未找到本地应用。';
      listEl.innerHTML = '<div style="padding:8px;color:#8b96a3;font-size:12px">未找到本地应用（开始菜单/桌面快捷方式）</div>';
      return;
    }
    apps.forEach(function (a) {
      var row = document.createElement('div'); row.className = 'app-item';
      var name = document.createElement('span'); name.className = 'app-name'; name.textContent = a.name;
      var btn = document.createElement('button'); btn.className = 'app-launch'; btn.textContent = '打开';
      btn.addEventListener('click', function () {
        statusEl.textContent = '正在打开 ' + a.name + ' ...';
        rpc('launch_app', { path: a.path }).then(function (r) {
          statusEl.textContent = r && r.started ? '已启动 ' + a.name : ('启动失败:' + (r && r.error || ''));
        }).catch(function (e) { statusEl.textContent = '启动失败: ' + e.message; });
      });
      row.appendChild(name); row.appendChild(btn);
      listEl.appendChild(row);
    });
    statusEl.textContent = '共 ' + result.count + ' 个应用（显示前 ' + apps.length + ' 个）';
  }

  document.getElementById('btnList').addEventListener('click', function () {
    statusEl.textContent = '正在枚举本地应用...';
    rpc('list_apps', { limit: 50 }).then(renderApps)
      .catch(function (e) { statusEl.textContent = '枚举失败: ' + e.message; });
  });

  // 配置注入：问候语
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (m && m.type === 'configApply') {
      document.getElementById('greet').textContent = (m.config && m.config.greeting) || '喵，主人～';
    }
  });

  // ---------- 拖拽 / 关闭（卡片手势由本插件自行设计） ----------
  // 宿主仅提供通用原语：slot.move 移动本插件所在卡片、slot.close 隐藏卡片（图标栏可再次唤出）
  var head = document.querySelector('.pet-head');
  var dragging = false, sx = 0, sy = 0;
  head.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest('.pet-close')) return; // 别拖到关闭键
    dragging = true; sx = e.clientX; sy = e.clientY;
    try { head.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  head.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    sx = e.clientX; sy = e.clientY;
    callAction('slot.move', { dx: dx, dy: dy }).catch(function () {});
  });
  function endDrag() { dragging = false; }
  head.addEventListener('pointerup', endDrag);
  head.addEventListener('pointercancel', endDrag);
  document.getElementById('petClose').addEventListener('click', function () {
    callAction('slot.close').catch(function () {});
  });

  // 启动时自动枚举一次，验证后端链路是否就绪
  rpc('ping').then(function () { rpc('list_apps', { limit: 50 }).then(renderApps); })
    .catch(function (e) { statusEl.textContent = '后端未就绪: ' + e.message; });
})();
</script>
</body>
</html>
