<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>进化工厂</title>
<style>
  /* 插件运行在面板 iframe 内，宿主 CSS 变量不跨文档继承：自带 token 并 fallback */
  :root {
    --ink: var(--wm-label, #16191d);
    --ink-2: var(--wm-label-2nd, #4c5560);
    --dim: var(--wm-label-dim, #8b96a3);
    --field: var(--wm-bg-input, #f2f4f7);
    --field-soft: #f7f8fa;
    --hover: var(--wm-bg-hover, #e9edf1);
    --line: rgba(15, 17, 21, 0.08);
    --accent: var(--wm-accent, #16191d);
    --ok: #3f7a4d;
    --err: #bf616a;
    --warn: #b7791f;
    --mono: var(--wm-mono, ui-monospace, "Cascadia Code", Consolas, monospace);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--wm-font, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    font-size: 13px; color: var(--ink); background: #fff;
    display: flex; flex-direction: column; overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c6cdd5; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #adb6c0; }
  /* 图标语言：与白条/浏览器插件统一（线性描边、1.5 线宽） */
  svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  button { font: inherit; color: inherit; }

  /* ---------- 顶部标签栏 ---------- */
  .top { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px 0; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; padding: 6px 12px; font-size: 12px; color: var(--ink-2);
    background: transparent; border: none; border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  .tab:hover { background: var(--hover); }
  .tab.on { background: var(--accent); color: #fff; font-weight: 600; }
  .topright { margin-left: auto; flex: none; display: flex; align-items: center; gap: 4px; padding-bottom: 8px; }
  .hbtn {
    width: 26px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px; background: transparent; color: var(--ink-2); cursor: pointer;
  }
  .hbtn:hover { background: var(--hover); color: var(--ink); }
  .hbtn:disabled { opacity: .4; cursor: default; }
  .hbtn svg { width: 15px; height: 15px; }
  .hbtn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 舞台（各标签自行填充） ---------- */
  .stage { flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .pane { flex: 1; min-height: 0; display: flex; overflow: hidden; }

  /* 左列表 + 右详情 */
  .side { width: 200px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); overflow: hidden; }
  .side-head {
    flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--dim); text-transform: uppercase;
  }
  .side-head .spacer { margin-left: auto; }
  .side-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* 左侧列表收起按钮：样式对齐白条底部的 rail-toggle（☰） */
  .side-toggle {
    flex: none; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px; background: transparent; color: var(--ink-2); cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .side-toggle:hover { background: var(--hover); color: var(--ink); }
  .side-toggle svg { width: 15px; height: 15px; }
  /* 收起态：左列表缩成一条只保留开关的窄条 */
  .side.ev-collapsed { width: 46px !important; }
  .side.ev-collapsed > .side-head { padding: 8px 0 6px; justify-content: center; }
  .side.ev-collapsed > .side-head > *:not(.side-toggle) { display: none; }
  .side.ev-collapsed > .side-body { display: none; }

  /* 左侧列表内的抽屉（可折叠分组） */
  .drawer { border-radius: 8px; }
  .drawer > summary {
    display: flex; align-items: center; gap: 6px; list-style: none; cursor: pointer;
    padding: 7px 10px; border-radius: 8px; font-size: 11px; font-weight: 600;
    letter-spacing: .06em; color: var(--dim); text-transform: uppercase; user-select: none;
  }
  .drawer > summary::-webkit-details-marker { display: none; }
  .drawer > summary:hover { background: var(--hover); }
  .drawer > summary .chev { display: inline-flex; flex: none; transition: transform .15s ease; }
  .drawer[open] > summary .chev { transform: rotate(90deg); }
  .drawer > summary .spacer { margin-left: auto; }
  .drawer-body { padding: 2px 0 8px; }

  /* 弹窗内的「特殊引用说明」条目：键 + 说明 */
  .ref { padding: 6px 10px; border-radius: 8px; }
  .ref:hover { background: var(--field-soft); }
  .ref-k { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--ink); }
  .ref-d { font-size: 11px; line-height: 1.65; color: var(--dim); margin-top: 2px; word-break: break-all; }

  .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; position: relative; }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--field); }
  .item-name { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
  .item-name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-sub { margin-top: 3px; font-size: 10.5px; color: var(--dim); word-break: break-all; line-height: 1.5; }
  .item-goal { margin-top: 3px; font-size: 11px; color: var(--warn); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-x {
    position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; display: none;
    align-items: center; justify-content: center; border: none; border-radius: 6px;
    background: transparent; color: var(--dim); cursor: pointer;
  }
  .item:hover .item-x { display: flex; }
  .item-x:hover { background: rgba(191, 97, 106, .12); color: var(--err); }
  .item-x svg { width: 14px; height: 14px; }

  /* ---------- 子标签 ---------- */
  .subtabs { flex: none; display: flex; align-items: center; gap: 2px; padding: 8px 12px 0; }
  .subtab {
    padding: 5px 11px; font-size: 11.5px; color: var(--ink-2);
    background: transparent; border: 1px solid transparent; border-radius: 999px; cursor: pointer;
  }
  .subtab:hover { background: var(--hover); }
  .subtab.on { background: var(--accent); color: #fff; font-weight: 600; }
  .subtabs .spacer { margin-left: auto; }

  .toolbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px 6px; }
  .toolbar .spacer { margin-left: auto; }
  .toolbar .note { font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 按钮 ---------- */
  .btn {
    height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--ink-2); background: #fff;
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.primary:hover { background: var(--accent); filter: brightness(1.15); }
  .btn.danger { background: var(--err); border-color: transparent; color: #fff; }
  .btn.danger:hover { background: var(--err); filter: brightness(1.08); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--hover); }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 11.5px; }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn.sm svg { width: 13px; height: 13px; }
  .ibtn {
    width: 26px; height: 26px; flex: none; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink-2); cursor: pointer;
  }
  .ibtn:hover { background: var(--hover); color: var(--ink); }
  .ibtn.danger:hover { background: rgba(191, 97, 106, .12); color: var(--err); border-color: transparent; }
  .ibtn svg { width: 14px; height: 14px; }
  .field > input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

  /* ---------- 表单 ---------- */
  .scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .pad { padding: 10px 14px 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; padding: 7px 0; }
  .field > label { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
  .field .desc { font-size: 11px; color: var(--dim); line-height: 1.6; }
  .input, .textarea, .select {
    width: 100%; font: inherit; font-size: 12.5px; color: var(--ink);
    background: var(--field); border: 1px solid transparent; border-radius: 8px;
    padding: 7px 10px; outline: none;
  }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--accent); background: #fff; }
  .textarea { resize: vertical; min-height: 72px; line-height: 1.7; }
  .mono { font-family: var(--mono); font-size: 12px; line-height: 1.7; }
  .editor-area {
    flex: 1; min-height: 0; width: 100%; resize: none; border: none; outline: none;
    background: #fff; padding: 12px 14px; font-family: var(--mono); font-size: 12px;
    line-height: 1.75; color: var(--ink); white-space: pre; overflow: auto; tab-size: 2;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .grow { flex: 1; min-width: 0; }
  .inline-field { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }

  /* ---------- 卡片 / 提示 ---------- */
  .card { background: var(--field-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-title { font-size: 13px; font-weight: 700; word-break: break-all; }
  .hint { padding: 14px; font-size: 12px; color: var(--dim); line-height: 1.8; }
  .hint.err { color: var(--err); word-break: break-all; white-space: pre-wrap; }
  .center {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 28px; text-align: center; color: var(--dim);
  }
  .center .big { font-size: 14px; font-weight: 700; color: var(--ink-2); }
  .center .sub { font-size: 12px; line-height: 1.8; max-width: 460px; }
  .center svg { width: 34px; height: 34px; opacity: .5; }
  .chip { flex: none; padding: 1px 7px; border-radius: 999px; font-size: 10px; background: rgba(63, 122, 77, .12); color: var(--ok); }
  .chip.warn { background: rgba(183, 121, 31, .14); color: var(--warn); }
  .chip.err { background: rgba(191, 97, 106, .14); color: var(--err); }
  .chip.mute { background: rgba(15, 17, 21, .07); color: var(--ink-2); }
  .pre {
    max-height: 260px; overflow: auto; padding: 9px 11px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.65; color: var(--ink-2);
    background: var(--field-soft); border: 1px solid var(--line); border-radius: 8px;
    white-space: pre-wrap; word-break: break-all;
  }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.tbl th {
    text-align: left; font-size: 11px; font-weight: 600; color: var(--dim);
    padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  table.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
  table.tbl tr:last-child td { border-bottom: none; }
  table.tbl code { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }

  /* diff 视图 */
  .diff { font-family: var(--mono); font-size: 11.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
  .diff .ln { padding: 0 8px; border-radius: 3px; }
  .diff .ln.add { background: rgba(63, 122, 77, .14); color: #2f6a3d; }
  .diff .ln.del { background: rgba(191, 97, 106, .14); color: #a8484f; }
  .diff .ln.hd { color: var(--dim); }

  /* markdown 渲染 */
  .md { font-size: 12.5px; line-height: 1.8; color: var(--ink); word-break: break-word; }
  .md > :first-child { margin-top: 0; }
  .md h1 { font-size: 18px; margin: 16px 0 8px; }
  .md h2 { font-size: 15.5px; margin: 16px 0 8px; }
  .md h3 { font-size: 13.5px; margin: 14px 0 6px; }
  .md h4, .md h5, .md h6 { font-size: 12.5px; margin: 12px 0 6px; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md a { color: #2f6fdb; }
  .md code { font-family: var(--mono); font-size: 11.5px; background: rgba(15, 17, 21, .06); padding: 1px 4px; border-radius: 4px; }
  .md pre { background: var(--field-soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; margin: 10px 0; }
  .md pre code { background: transparent; padding: 0; font-size: 11.5px; line-height: 1.65; white-space: pre; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--ink-2); margin: 10px 0; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  .md table { border-collapse: collapse; margin: 10px 0; font-size: 12px; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; }
  .md th { background: var(--field-soft); }
  .md img { max-width: 100%; }

  /* 报告视图：右侧以 iframe 承载瑞士风 HTML 报告（样式隔离），左侧仍保留迭代存档列表 */
  .report-frame { flex: 1; min-height: 0; width: 100%; border: none; background: #eceae6; }

  /* ---------- 弹层 ---------- */
  .mask {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    padding: 22px; background: rgba(15, 17, 21, .34);
  }
  .dlg {
    display: flex; flex-direction: column; overflow: hidden; width: 100%;
    max-width: var(--dlg-w, 460px); max-height: 88%;
    background: #fff; border-radius: 12px; box-shadow: 0 22px 55px rgba(15, 17, 21, .26);
  }
  .dlg-head {
    flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600;
  }
  .dlg-head .spacer { margin-left: auto; }
  .dlg-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; font-size: 12.5px; line-height: 1.75; }
  .dlg-body.flush { padding: 0; display: flex; flex-direction: column; }
  .dlg-foot { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 11px 14px; border-top: 1px solid var(--line); }

  .toast {
    position: fixed; left: 50%; bottom: 18px; max-width: 82%; z-index: 90;
    padding: 7px 14px; border-radius: 999px; font-size: 12px;
    background: rgba(22, 25, 29, .92); color: #fff; white-space: pre-wrap; text-align: center;
    opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(8px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: rgba(191, 97, 106, .96); }

  /* ---------- 类型总览 ---------- */
  #list { flex: 1; min-height: 0; display: flex; }
  .rail {
    width: 190px; flex: none; display: flex; flex-direction: column;
    padding: 8px; background: var(--field-soft); border-right: 1px solid var(--line); overflow: hidden;
  }
  .types { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  .type {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 9px;
    text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer;
  }
  .type:hover { background: var(--hover); }
  .type.on { background: var(--field); border-color: var(--line); }
  .type-ico {
    width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center;
    color: var(--ink-2); background: #fff; border: 1px solid var(--line); border-radius: 7px;
  }
  .type.on .type-ico { color: var(--ink); }
  .type-ico svg { width: 14px; height: 14px; }
  .type-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-count { flex: none; font-size: 10.5px; color: var(--dim); }

  .list-top { padding: 14px 16px 10px; align-items: flex-end; }
  .list-title h1 { font-size: 15px; font-weight: 700; }
  .list-title p { margin-top: 2px; font-size: 11.5px; color: var(--dim); }

  .filter { position: relative; }
  .filter-btn {
    height: 30px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--ink-2); background: #fff;
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  .filter-btn:hover { background: var(--hover); color: var(--ink); }
  .filter-btn .lab { color: var(--dim); }
  .filter-btn svg { width: 13px; height: 13px; color: var(--dim); transition: transform .15s ease; }
  .filter.open .filter-btn svg { transform: rotate(180deg); }
  .menu {
    position: absolute; right: 0; top: 34px; z-index: 30; width: 168px; padding: 4px;
    display: none; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 28px rgba(15, 17, 21, .16);
  }
  .filter.open .menu { display: block; }
  .opt {
    width: 100%; height: 30px; padding: 0 8px; display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--ink-2); text-align: left;
    background: transparent; border: none; border-radius: 7px; cursor: pointer;
  }
  .opt:hover { background: var(--hover); color: var(--ink); }
  .opt .tick { width: 13px; height: 13px; color: var(--ok); opacity: 0; }
  .opt.on { color: var(--ink); font-weight: 600; }
  .opt.on .tick { opacity: 1; }
  .opt .num { margin-left: auto; font-size: 10.5px; color: var(--dim); font-weight: 400; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; padding: 6px 16px 22px; }
  .pcard {
    min-width: 0; padding: 12px; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer; transition: background .12s ease, border-color .12s ease;
  }
  .pcard:hover { background: var(--field-soft); border-color: rgba(15, 17, 21, .17); }
  .pcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pcard-top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .pcard-ico {
    width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center;
    color: var(--ink-2); background: var(--field); border-radius: 8px;
  }
  .pcard-ico svg { width: 16px; height: 16px; }
  .pcard-top .chip { margin-left: auto; }
  .pname { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pdesc {
    margin-top: 3px; font-size: 11.5px; line-height: 1.65; color: var(--dim);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pcard-foot {
    display: flex; align-items: center; gap: 6px; margin-top: 10px; padding-top: 8px;
    border-top: 1px solid var(--line); font-size: 10.5px; color: var(--dim);
  }
  .pcard-foot .mono { font-size: 10.5px; line-height: 1.5; color: var(--dim); }
  .pcard-foot .go { margin-left: auto; display: inline-flex; align-items: center; gap: 1px; font-weight: 600; color: var(--ink-2); }
  .pcard-foot svg { width: 12px; height: 12px; }
  .pcard-foot .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--warn); }
  .pcard-foot .dot.mute { background: #b4bcc6; }

  /* ---------- 详情页（复用模块右侧主区） ---------- */
  #detail { flex: 1; min-height: 0; display: none; flex-direction: column; }
  #detail .top { padding: 8px 10px 0; gap: 6px; }
  /* 详情页只保留内容区，模块顶层的沙盒 / 图谱侧栏一律隐藏 */
  #detail .stage > .pane > .side { display: none !important; }
  .back {
    flex: none; height: 26px; margin-bottom: 8px; padding: 0 8px 0 5px;
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 12px; color: var(--ink-2); background: transparent;
    border: none; border-radius: 7px; cursor: pointer;
  }
  .back:hover { background: var(--hover); color: var(--ink); }
  .back svg { width: 14px; height: 14px; }
  .detail-title {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px;
    margin-bottom: 8px; font-size: 12.5px; font-weight: 600; overflow: hidden;
  }
  .detail-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title-actions { flex: none; display: inline-flex; align-items: center; gap: 4px; }
  .detail-id { font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: var(--dim); }

  @media (max-width: 560px) {
    .rail { width: 52px; padding: 8px 6px; }
    .type-name, .type-count { display: none; }
    .type { justify-content: center; padding: 6px; }
    .list-top { padding-left: 10px; padding-right: 10px; }
    .grid { padding-left: 10px; padding-right: 10px; grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div id="list">
    <aside class="rail">
      <nav class="types" id="types"></nav>
    </aside>
    <main class="main">
      <div class="top list-top">
        <div class="list-title">
          <h1 id="wsTitle">技能</h1>
          <p id="wsDesc"></p>
        </div>
        <div class="topright">
          <div class="filter" id="filter">
            <button type="button" class="filter-btn" id="filterBtn">
              <span class="lab">来源</span>
              <span id="filterLabel">全部</span>
              <span id="filterChev"></span>
            </button>
            <div class="menu" id="filterMenu"></div>
          </div>
        </div>
      </div>
      <div class="scroll" id="wsBody"></div>
    </main>
  </div>
  <div id="detail">
    <div class="top">
      <button type="button" class="back" id="detailBack"></button>
      <div class="detail-title">
        <span class="detail-name" id="detailName"></span>
        <span class="title-actions" id="titleActions"></span>
        <span id="detailMeta"></span>
      </div>
      <div class="tabs" id="tabs" style="display:none"></div>
      <div class="topright" id="actions"></div>
    </div>
    <div class="stage" id="stage"></div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="modals"></div>

<script src="/minimal/shared/marked/12.0.2/marked.min.js"></script>
<script>
/* ============================================================================
 * 进化工厂（builtin-evolve）插件核心：样式 token + 通用工具 + 标签路由
 *
 * 各标签实现位于 js/*.js，通过 EV.register(id, { mount(root) }) 注册：
 *   id ∈ 'skill' | 'mcp' | 'graph' | 'agentloop' | 'sensor'
 *   mount(root)：首次激活时调用一次；root 已清空，模块自行渲染并保留 DOM。
 *
 * 可用工具（window.EV）：
 *   EV.el(tag, cls, text)                创建元素
 *   EV.icon(name, size)                  返回 SVG 字符串（见 ICONS）
 *   EV.api.get/put/post/del(url, body)   同源 REST，失败抛 Error(detail)
 *   EV.toast(msg, isErr)                 轻提示
 *   EV.modal({title, node|html, width, actions:[{label,kind,onClick,close}]}) → {close}
 *   EV.confirm({title, message, okLabel, danger}) → Promise<boolean>
 *   EV.prompt({title, label, value, placeholder, okLabel}) → Promise<string|null>
 *   EV.setActions([{icon|label, title, primary, danger, disabled, onClick}])  右上角动作按钮
 *   EV.attachSideToggle(sideEl, headEl, label, onToggle)  在左列表头部追加「收起」开关
 *   EV.drawer(title, count, open, onToggle, fill)  左列表内的可折叠抽屉
 *   EV.md(text)                          markdown → HTML
 *   EV.escape(text) / EV.debounce(fn,ms) / EV.fmtTime(s)
 * ========================================================================== */
(function () {
  'use strict';

  var ICONS = {
    refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
    save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/>',
    play: '<path d="m6 3 14 9-14 9z"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    check: '<path d="m5 13 4 4L19 7"/>',
    undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
    merge: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M6 9v6"/><path d="M18 12a6 6 0 0 1-6 6H9"/><path d="m15 9-3 3"/>',
    server: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01"/><path d="M7 16.5h.01"/>',
    zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    graph: '<circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 6h9"/><path d="M6.5 8.2 10.6 16"/><path d="M17.5 8.2 13.4 16"/>',
    loop: '<path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
    flask: '<path d="M8 3h8"/><path d="M9 3v5.5a5.5 5.5 0 0 1-.9 3L6 15a5 5 0 0 0 4 8h4a5 5 0 0 0 4-8l-2.1-3.5a5.5 5.5 0 0 1-.9-3V3"/><path d="M7.5 14h9"/>',
    zoomIn: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/>',
    zoomOut: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/>',
    expand: '<path d="M14 4h6v6"/><path d="M10 20H4v-6"/><path d="M20 4l-7 7"/><path d="M4 20l7-7"/>',
    fit: '<path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/>',
    layout: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="M6 13l3-3 2.5 2.5L14 9l4 4"/>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 9 5-5 5 5"/><path d="M12 4v12"/>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 11 5 5 5-5"/><path d="M12 16V4"/>',
    chevron: '<path d="m9 6 6 6-6 6"/>',
    menu: '<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/>',
    back: '<path d="m15 18-6-6 6-6"/>',
    chevronDown: '<path d="m6 9 6 6 6-6"/>',
    dot: '<circle cx="12" cy="12" r="4"/>'
  };

  var tabsEl = document.getElementById('tabs');
  var actionsEl = document.getElementById('actions');
  var stageEl = document.getElementById('stage');
  var toastEl = document.getElementById('toast');
  var modalsEl = document.getElementById('modals');

  var registry = {};   // id -> {label, icon, mount}
  var order = [];
  var mounted = {};    // id -> element
  var active = null;

  // ---------- 基础工具 ----------
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function icon(name, size) {
    var body = ICONS[name] || ICONS.dot;
    var s = size || 15;
    return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" ' +
      'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function debounce(fn, ms) {
    var t = null;
    return function () { var a = arguments, self = this; clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms || 200); };
  }
  function fmtTime(s) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d.getTime())) return String(s);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  var toastTimer = null;
  function toast(msg, isErr) {
    toastEl.textContent = String(msg == null ? '' : msg);
    toastEl.className = 'toast on' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, isErr ? 3600 : 2200);
  }

  // ---------- 同源 REST ----------
  async function request(method, url, body) {
    var init = { method: method };
    if (body !== undefined && body !== null) {
      init.headers = { 'Content-Type': 'application/json' };
      init.body = JSON.stringify(body);
    }
    var res;
    try { res = await fetch(url, init); }
    catch (e) { throw new Error('网络异常：' + (e && e.message ? e.message : '请求失败')); }
    var data = null;
    var text = await res.text();
    if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
    if (!res.ok) {
      var detail = (data && (data.detail || data.message)) || text || ('HTTP ' + res.status);
      if (typeof detail !== 'string') detail = JSON.stringify(detail);
      throw new Error(detail);
    }
    return data;
  }
  var api = {
    get: function (u) { return request('GET', u); },
    put: function (u, b) { return request('PUT', u, b); },
    post: function (u, b) { return request('POST', u, b); },
    del: function (u) { return request('DELETE', u); }
  };
  function qs(obj) {
    var parts = [];
    Object.keys(obj || {}).forEach(function (k) {
      var v = obj[k];
      if (v === undefined || v === null || v === '') return;
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
    });
    return parts.length ? '?' + parts.join('&') : '';
  }

  // ---------- 弹层 ----------
  function modal(opts) {
    opts = opts || {};
    var mask = el('div', 'mask');
    var dlg = el('div', 'dlg');
    if (opts.width) dlg.style.setProperty('--dlg-w', opts.width);

    var head = el('div', 'dlg-head');
    head.appendChild(el('span', null, opts.title || ''));
    if (opts.headExtra) head.appendChild(opts.headExtra);
    var closeBtn = el('button', 'hbtn');
    closeBtn.innerHTML = icon('x', 15);
    closeBtn.title = '关闭';
    closeBtn.onclick = function () { close(); };
    head.appendChild(el('span', 'spacer'));
    head.appendChild(closeBtn);
    dlg.appendChild(head);

    var body = el('div', 'dlg-body' + (opts.flush ? ' flush' : ''));
    if (opts.node) body.appendChild(opts.node);
    else if (opts.html != null) body.innerHTML = opts.html;
    dlg.appendChild(body);

    var foot = null;
    if (opts.actions && opts.actions.length) {
      foot = el('div', 'dlg-foot');
      opts.actions.forEach(function (a) {
        var b = el('button', 'btn' + (a.kind ? ' ' + a.kind : ''));
        if (a.icon) b.innerHTML = icon(a.icon, 15);
        var span = el('span', null, a.label || '');
        b.appendChild(span);
        if (a.title) b.title = a.title;
        if (a.disabled) b.disabled = true;
        b.onclick = function () { if (a.onClick) a.onClick(handle); else if (a.close !== false) close(); };
        foot.appendChild(b);
      });
      dlg.appendChild(foot);
    }
    mask.appendChild(dlg);
    mask.addEventListener('mousedown', function (e) { if (e.target === mask && opts.maskClose !== false) close(); });
    modalsEl.appendChild(mask);

    var closed = false;
    function close() {
      if (closed) return;
      closed = true;
      mask.remove();
      if (opts.onClose) opts.onClose();
    }
    var handle = { el: dlg, body: body, foot: foot, close: close };
    if (opts.onOpen) opts.onOpen(handle);
    return handle;
  }

  function confirm(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var answered = false;
      modal({
        title: opts.title || '确认操作',
        width: opts.width || '420px',
        html: '<div style="line-height:1.8;white-space:pre-wrap;word-break:break-word">' + escapeHtml(opts.message || '') + '</div>',
        actions: [
          { label: opts.cancelLabel || '取消', onClick: function (h) { answered = true; resolve(false); h.close(); } },
          {
            label: opts.okLabel || '确定', kind: opts.danger ? 'danger' : 'primary',
            onClick: function (h) { answered = true; resolve(true); h.close(); }
          }
        ],
        onClose: function () { if (!answered) resolve(false); }
      });
    });
  }

  function prompt(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var wrap = el('div');
      if (opts.label) {
        var f = el('div', 'field');
        f.appendChild(el('label', null, opts.label));
        wrap.appendChild(f);
      }
      var input = el('input', 'input');
      input.type = 'text';
      input.value = opts.value || '';
      input.placeholder = opts.placeholder || '';
      if (opts.mono) input.classList.add('mono');
      wrap.appendChild(input);
      if (opts.desc) wrap.appendChild(el('div', 'hint', opts.desc));

      var answered = false;
      var h = modal({
        title: opts.title || '输入',
        width: opts.width || '420px',
        node: wrap,
        actions: [
          { label: '取消', onClick: function (m) { answered = true; resolve(null); m.close(); } },
          {
            label: opts.okLabel || '确定', kind: 'primary',
            onClick: function (m) {
              var v = input.value.trim();
              if (!v && !opts.allowEmpty) { toast('不能为空', true); return; }
              answered = true; resolve(v); m.close();
            }
          }
        ],
        onOpen: function () { setTimeout(function () { input.focus(); input.select(); }, 30); },
        onClose: function () { if (!answered) resolve(null); }
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); h.foot.querySelector('.btn.primary').click(); }
      });
    });
  }

  // ---------- markdown ----------
  function md(text) {
    if (!text) return '';
    if (window.marked && typeof window.marked.parse === 'function') {
      try {
        return window.marked.parse(String(text), { gfm: true, breaks: true });
      } catch (e) { /* fallthrough */ }
    }
    return '<p>' + escapeHtml(text).replace(/\n/g, '<br>') + '</p>';
  }

  // ---------- 右上角动作 ----------
  var activeActions = [];
  function setActions(list) {
    activeActions = list || [];
    actionsEl.innerHTML = '';
    activeActions.forEach(function (a) {
      var b = el('button', a.label ? 'btn sm' : 'hbtn');
      if (a.icon && a.label) b.innerHTML = icon(a.icon, 14);
      else if (a.icon) { b.innerHTML = icon(a.icon, 15); b.title = a.title || ''; }
      else b.title = a.title || '';
      if (a.label) {
        b.appendChild(el('span', null, a.label));
        if (a.title) b.title = a.title;
      }
      if (a.primary) b.classList.add('primary');
      if (a.danger) b.classList.add('danger');
      if (a.disabled) b.disabled = true;
      b.onclick = function () { if (a.onClick) a.onClick(); };
      actionsEl.appendChild(b);
    });
  }

  // ---------- 左侧列表收起开关 ----------
  // 把一个 ☰ 开关追加到头部；点击在 sideEl 上切换 ev-collapsed，
  // 收起后仅保留头部窄条与开关本身，主区域自动铺满。
  function attachSideToggle(sideEl, headEl, label, onToggle) {
    var what = label || '左侧列表';
    var btn = el('button', 'side-toggle');
    btn.type = 'button';
    btn.innerHTML = icon('menu', 15);
    btn.title = (sideEl.classList.contains('ev-collapsed') ? '展开' : '收起') + what;
    btn.onclick = function (e) {
      e.stopPropagation();
      var collapsed = sideEl.classList.toggle('ev-collapsed');
      btn.title = (collapsed ? '展开' : '收起') + what;
      if (onToggle) onToggle(collapsed);
    };
    headEl.appendChild(btn);
    return btn;
  }

  // 生成一个可折叠抽屉（<details>），fill(bodyEl) 负责填充内容
  function drawer(title, count, open, onToggle, fill) {
    var d = el('details', 'drawer');
    d.open = !!open;
    var s = el('summary');
    var chev = el('span', 'chev');
    chev.innerHTML = icon('chevron', 12);
    s.appendChild(chev);
    s.appendChild(el('span', null, title));
    s.appendChild(el('span', 'spacer'));
    if (count) s.appendChild(el('span', 'chip mute', String(count)));
    d.appendChild(s);
    var body = el('div', 'drawer-body');
    fill(body);
    d.appendChild(body);
    d.addEventListener('toggle', function () { if (onToggle) onToggle(d.open); });
    return d;
  }

  // ---------- 标签路由 ----------
  function register(id, mod) {
    if (registry[id]) return;
    registry[id] = mod;
    order.push(id);
  }
  function activate(id) {
    if (!registry[id]) return;
    active = id;
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.classList.toggle('on', b.dataset.tab === id);
    });
    stageEl.innerHTML = '';
    var mod = registry[id];
    if (!mounted[id]) {
      var root = el('div', 'pane');
      mounted[id] = root;
      stageEl.appendChild(root);
      try { mod.mount(root); } catch (e) { root.innerHTML = ''; root.appendChild(el('div', 'hint err', '插件标签渲染失败：' + e.message)); }
    } else {
      stageEl.appendChild(mounted[id]);
      if (mod.onShow) { try { mod.onShow(); } catch (e) { /* noop */ } }
    }
    setActions(mod.actions ? mod.actions() : []);
  }
  function buildTabs() {
    tabsEl.innerHTML = '';
    order.forEach(function (id) {
      var mod = registry[id];
      var b = el('button', 'tab', mod.label || id);
      b.dataset.tab = id;
      b.onclick = function () { activate(id); };
      tabsEl.appendChild(b);
    });
  }

  // ---------- 沙盒内（进化工厂加工中产物）----------
  // 列出某工厂类型的沙盒产物（type: 'agentloop' | 'graph'）
  async function sandboxList(type) {
    try {
      var list = await api.get('/api/evolve/list?type=' + encodeURIComponent(type));
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  // 只读预览一个沙盒产物的文件。mainHint：agentloop 用 '<name>.yaml'，graph 用 'graph.json'
  async function previewSandboxFile(type, wp, mainHint, kindLabel) {
    var base = { workplace_id: wp.workplace_id, name: wp.name, type: type };
    var files = [];
    try {
      var tree = await api.get('/api/evolve/file' + qs(base));
      files = (tree && tree.attachments) || [];
    } catch (e) { /* 文件树读取失败时下面给出提示 */ }

    var wrap = el('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.gap = '8px';

    var head = el('div', 'row');
    head.appendChild(el('span', 'chip mute', '沙盒 ' + wp.workplace_id));
    head.appendChild(el('span', 'note', (kindLabel || type) + ' · 加工中'));
    wrap.appendChild(head);

    if (!files.length) {
      wrap.appendChild(el('div', 'hint', '未能列出沙盒文件（可能已被清理）。'));
      modal({ title: '沙盒产物 · ' + wp.name, width: '640px', node: wrap });
      return;
    }

    var chips = el('div', 'row');
    chips.style.flexWrap = 'wrap';
    chips.style.gap = '6px';
    var pre = el('pre', 'pre mono');
    pre.style.margin = '0';

    function paint(name) {
      Array.prototype.forEach.call(chips.children, function (b) {
        b.classList.toggle('primary', b.dataset.f === name);
      });
      pre.textContent = '加载中…';
      api.get('/api/evolve/file' + qs(Object.assign({}, base, { filename: name })))
        .then(function (d) { pre.textContent = (d && d.content) || '（空文件）'; })
        .catch(function (e) { pre.textContent = '读取失败：' + e.message; });
    }

    var main = (mainHint && files.indexOf(mainHint) >= 0) ? mainHint : files[0];
    files.forEach(function (f) {
      var b = el('button', 'btn sm');
      b.dataset.f = f;
      b.textContent = f;
      b.onclick = function () { paint(f); };
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
    wrap.appendChild(pre);
    paint(main);

    modal({ title: '沙盒产物 · ' + wp.name, width: '640px', node: wrap });
  }

  window.EV = {
    el: el, icon: icon, escape: escapeHtml, debounce: debounce, fmtTime: fmtTime,
    toast: toast, api: api, qs: qs, modal: modal, confirm: confirm, prompt: prompt,
    md: md, setActions: setActions, register: register, activate: activate,
    module: function (id) { return registry[id]; },
    attachSideToggle: attachSideToggle, drawer: drawer,
    sandboxList: sandboxList, previewSandboxFile: previewSandboxFile,
    on: function () {}
  };
  // 供标签模块在 mount 前声明标签元信息
  window.EV.defineTab = function (id, label, mod) { mod.label = label; register(id, mod); };

  // ---------- 宿主事件（configApply 等）可忽略；面板由宿主管理显示 ----------
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'event' && m.event === 'conversation.local') {
      // 会话变化不影响进化工厂
    }
  });

  // ---------- 模块加载完成后构建标签 ----------
  window.EVOLVE_BOOT = function () {
    buildTabs();
    var first = ['skill', 'mcp', 'graph', 'agentloop', 'sensor'].filter(function (id) { return registry[id]; });
    if (first.length === 0) {
      stageEl.innerHTML = '<div class="center"><div class="big">没有可用的标签</div></div>';
      return;
    }
    activate(first[0]);
    if (!document.querySelector('.tab.on')) activate(order[0]);
  };
})();
</script>
<script src="js/skill.js"></script>
<script src="js/mcp.js"></script>
<script src="js/graph.js"></script>
<script src="js/agentloop.js"></script>
<script src="js/sensor.js"></script>
<script>
/* ============================================================================
 * 类型总览 → 卡片列表 → 详情
 *
 * 列表层只负责「插件类型 / 来源筛选 / 沙盒卡片」；详情层直接复用各模块原有
 * 的右侧主区（隐藏模块自带的左列表），因此工具栏、子标签与内容分配保持原样。
 * ========================================================================== */
(function () {
  'use strict';

  var TYPES = [
    { id: 'skill', label: '技能', icon: 'flask', desc: '可复用的技能包与评测流程' },
    { id: 'mcp', label: 'MCP', icon: 'server', desc: '工具服务器与语义测试' },
    { id: 'graph', label: 'Graph', icon: 'graph', desc: '任务编排图与节点调试' },
    { id: 'agentloop', label: 'Agent Loop', icon: 'loop', desc: '阶段式 Agent 流程编排' },
    { id: 'sensor', label: '传感器', icon: 'zap', desc: '运行时事件监听与基准测试' }
  ];

  var state = {
    type: 'skill',
    filter: 'all',
    sandbox: {},
    formal: {},
    formalLoading: {},
    detail: null
  };

  var typesEl = document.getElementById('types');
  var wsTitleEl = document.getElementById('wsTitle');
  var wsDescEl = document.getElementById('wsDesc');
  var wsBodyEl = document.getElementById('wsBody');
  var filterEl = document.getElementById('filter');
  var filterBtnEl = document.getElementById('filterBtn');
  var filterMenuEl = document.getElementById('filterMenu');
  var filterLabelEl = document.getElementById('filterLabel');
  var listEl = document.getElementById('list');
  var detailEl = document.getElementById('detail');
  var stageEl = document.getElementById('stage');
  var detailNameEl = document.getElementById('detailName');
  var detailMetaEl = document.getElementById('detailMeta');
  var titleActionsEl = document.getElementById('titleActions');
  var detailRoots = {};

  function metaOf(id) {
    for (var i = 0; i < TYPES.length; i += 1) if (TYPES[i].id === id) return TYPES[i];
    return TYPES[0];
  }
  function sandboxList(id) { return state.sandbox[id] || []; }
  function formalList(id) { return state.formal[id] || []; }
  function formalLoaded(id) { return Array.isArray(state.formal[id]); }

  async function loadSandboxes(id) {
    try {
      var list = await EV.api.get('/api/evolve/list?type=' + encodeURIComponent(id));
      state.sandbox[id] = Array.isArray(list) ? list : [];
    } catch (e) {
      state.sandbox[id] = [];
    }
  }

  async function loadFormal(id) {
    if (formalLoaded(id) || state.formalLoading[id]) return;
    state.formalLoading[id] = true;
    if (state.type === id) renderList();
    var out = [];
    try {
      if (id === 'skill') {
        var skills = await EV.api.get('/api/tools/skills');
        out = (Array.isArray(skills) ? skills : []).map(function (s) {
          return { name: s.name || s.dir_name || '', desc: s.description || '' };
        });
      } else if (id === 'mcp') {
        var mcps = await EV.api.get('/api/tools/mcp/list');
        out = (Array.isArray(mcps) ? mcps : []).map(function (m) {
          return typeof m === 'string' ? { name: m, desc: '已配置的 MCP 服务器' } : { name: m.name || '', desc: m.description || '' };
        });
      } else if (id === 'graph') {
        var graphs = await EV.api.get('/api/graphs');
        out = (Array.isArray(graphs) ? graphs : []).map(function (g) {
          return { name: g.name || '', desc: g.desc || '任务编排图' };
        });
      } else if (id === 'agentloop') {
        var para = await EV.api.get('/api/paradigms');
        out = ((para && para.files) || []).map(function (f) {
          return { name: f.name || String(f), desc: f.is_default ? '默认 Agent Loop 范式' : 'Agent Loop 范式' };
        });
      } else if (id === 'sensor') {
        var sensors = await EV.api.get('/api/tools/market/sensors/installed');
        out = (Array.isArray(sensors) ? sensors : []).map(function (s) {
          return { name: s.name || '', desc: s.enabled ? '已启用' : '已安装 · 未启用', enabled: !!s.enabled };
        });
      }
    } catch (e) { /* 正式库读取失败按空处理 */ }
    state.formal[id] = out.filter(function (x) { return x.name; });
    state.formalLoading[id] = false;
    if (state.type === id) renderList();
  }

  /* ---------------- 列表层 ---------------- */
  function renderRail() {
    typesEl.innerHTML = '';
    TYPES.forEach(function (t) {
      var b = EV.el('button', 'type' + (state.type === t.id ? ' on' : ''));
      b.type = 'button';
      var ico = EV.el('span', 'type-ico');
      ico.innerHTML = EV.icon(t.icon, 14);
      b.appendChild(ico);
      b.appendChild(EV.el('span', 'type-name', t.label));
      b.appendChild(EV.el('span', 'type-count', String(sandboxList(t.id).length)));
      b.onclick = function () {
        if (state.type === t.id) return;
        state.type = t.id;
        state.filter = 'all';
        renderList();
        loadFormal(t.id);
      };
      typesEl.appendChild(b);
    });
  }

  function filterText(f) {
    return f === 'sandbox' ? '沙盒内' : f === 'formal' ? '正式库' : '全部';
  }

  function renderFilter() {
    var s = sandboxList(state.type).length;
    var f = formalLoaded(state.type) ? formalList(state.type).length : null;
    filterLabelEl.textContent = filterText(state.filter);
    var opts = [
      { id: 'all', label: '全部', num: f === null ? '…' : s + f },
      { id: 'sandbox', label: '沙盒内', num: s },
      { id: 'formal', label: '正式库', num: f === null ? '…' : f }
    ];
    filterMenuEl.innerHTML = '';
    opts.forEach(function (o) {
      var b = EV.el('button', 'opt' + (state.filter === o.id ? ' on' : ''));
      b.type = 'button';
      var tick = EV.el('span', 'tick');
      tick.innerHTML = EV.icon('check', 13);
      b.appendChild(tick);
      b.appendChild(EV.el('span', null, o.label));
      b.appendChild(EV.el('span', 'num', String(o.num)));
      b.onclick = function () {
        state.filter = o.id;
        filterEl.classList.remove('open');
        if (o.id !== 'sandbox') loadFormal(state.type);
        renderList();
      };
      filterMenuEl.appendChild(b);
    });
  }

  function currentItems() {
    var t = state.type;
    var sandbox = sandboxList(t).map(function (w) {
      return { kind: 'sandbox', type: t, name: w.name, workplace_id: w.workplace_id, status: w.status };
    });
    var formal = formalList(t).map(function (w) {
      return { kind: 'formal', type: t, name: w.name, desc: w.desc, enabled: w.enabled };
    });
    if (state.filter === 'sandbox') return sandbox;
    if (state.filter === 'formal') return formal;
    return sandbox.concat(formal);
  }

  function buildCard(item) {
    var t = metaOf(state.type);
    var card = EV.el('div', 'pcard');
    card.tabIndex = 0;
    var top = EV.el('div', 'pcard-top');
    var ico = EV.el('span', 'pcard-ico');
    ico.innerHTML = EV.icon(t.icon, 16);
    top.appendChild(ico);
    top.appendChild(EV.el('span', 'chip' + (item.kind === 'sandbox' ? ' warn' : ' mute'), item.kind === 'sandbox' ? '加工中' : '正式库'));
    card.appendChild(top);
    card.appendChild(EV.el('div', 'pname', item.name));
    card.appendChild(EV.el('div', 'pdesc', item.kind === 'sandbox'
      ? '沙盒工作区，完成评测后可合并回正式库。'
      : (item.desc || (t.label + ' 正式库条目'))));
    var foot = EV.el('div', 'pcard-foot');
    foot.appendChild(EV.el('span', 'dot' + (item.kind === 'formal' ? ' mute' : '')));
    foot.appendChild(item.kind === 'sandbox'
      ? EV.el('span', 'mono', item.workplace_id || '')
      : EV.el('span', null, item.enabled === false ? '已安装 · 未启用' : '已安装'));
    var go = EV.el('span', 'go');
    go.appendChild(document.createTextNode(item.kind === 'sandbox' ? '进入' : '查看'));
    go.insertAdjacentHTML('beforeend', EV.icon('chevron', 12));
    foot.appendChild(go);
    card.appendChild(foot);
    card.onclick = function () { openDetail(item); };
    card.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(item); }
    };
    return card;
  }

  function renderGrid() {
    var t = metaOf(state.type);
    var items = currentItems();
    wsBodyEl.innerHTML = '';
    if (state.filter !== 'sandbox' && !formalLoaded(state.type) && items.length === 0) {
      var loading = EV.el('div', 'center');
      var li = EV.el('span');
      li.innerHTML = EV.icon(t.icon, 34);
      loading.appendChild(li);
      loading.appendChild(EV.el('div', 'sub', '正在读取' + t.label + '…'));
      loading.style.minHeight = '300px';
      wsBodyEl.appendChild(loading);
      return;
    }
    if (!items.length) {
      var empty = EV.el('div', 'center');
      var ei = EV.el('span');
      ei.innerHTML = EV.icon(t.icon, 34);
      empty.appendChild(ei);
      empty.appendChild(EV.el('div', 'big', state.filter === 'formal' ? '正式库里还没有' + t.label
        : state.filter === 'sandbox' ? '没有加工中的' + t.label + '沙盒' : '这里还没有内容'));
      empty.appendChild(EV.el('div', 'sub', state.filter === 'formal'
        ? '已安装的条目会出现在这里，也可以让 Agent 先在沙盒中构建。'
        : '让 Agent 在进化工厂中启动一次构建，沙盒会出现在这里。'));
      empty.style.minHeight = '320px';
      wsBodyEl.appendChild(empty);
      return;
    }
    var grid = EV.el('div', 'grid');
    items.forEach(function (item) { grid.appendChild(buildCard(item)); });
    wsBodyEl.appendChild(grid);
  }

  function renderList() {
    var t = metaOf(state.type);
    wsTitleEl.textContent = t.label;
    wsDescEl.textContent = t.desc;
    renderRail();
    renderFilter();
    renderGrid();
  }

  /* ---------------- 详情层 ---------------- */
  function renderFormalDetail(item) {
    var wrap = EV.el('div', 'scroll');
    var pad = EV.el('div', 'pad');
    var card = EV.el('div', 'card');
    var head = EV.el('div', 'card-head');
    head.appendChild(EV.el('div', 'card-title', '简介'));
    head.appendChild(EV.el('span', 'chip mute', '正式库'));
    card.appendChild(head);
    var desc = EV.el('div', 'hint', item.desc || '该条目已安装，可直接被 Agent 调用。');
    desc.style.padding = '0';
    card.appendChild(desc);
    pad.appendChild(card);

    var src = EV.el('div', 'card');
    var srcHead = EV.el('div', 'card-head');
    srcHead.appendChild(EV.el('div', 'card-title', '来源'));
    src.appendChild(srcHead);
    var row = EV.el('div', 'row');
    row.appendChild(EV.el('span', 'chip mute', '已安装'));
    row.appendChild(EV.el('span', 'mono', item.name));
    src.appendChild(row);
    pad.appendChild(src);

    wrap.appendChild(pad);
    stageEl.appendChild(wrap);
    EV.setActions([]);
  }

  function revealSandbox(item) {
    EV.api.post('/api/evolve/reveal', {
      type: item.type, workplace_id: item.workplace_id
    }).then(function () {
      EV.toast('已在文件管理器中打开沙盒目录');
    }).catch(function (e) {
      EV.toast('打开目录失败：' + e.message, true);
    });
  }

  function approveSandbox(item) {
    EV.api.post('/api/evolve/handle', {
      type: item.type, workplace_id: item.workplace_id, name: item.name,
      is_approved: true, reject_reason: ''
    }).then(function (data) {
      var msg = data.message || '已并入正式库';
      var blocked = msg.indexOf('❌') >= 0;
      EV.toast(msg, blocked);
      if (!blocked) backToList();
    }).catch(function (e) {
      EV.toast('操作失败：' + e.message, true);
    });
  }

  function revealButton(item) {
    var b = EV.el('button', 'ibtn');
    b.innerHTML = EV.icon('folder', 14);
    b.title = '查看文件';
    b.onclick = function () { revealSandbox(item); };
    return b;
  }

  function bindSandboxActions(item) {
    var compact = item.type === 'skill' || item.type === 'sensor' || item.type === 'mcp' || item.type === 'graph';
    if (item.kind !== 'sandbox' || !compact) {
      EV.setActions([]);
      return;
    }
    var acts = [{ icon: 'check', label: '批准合并', primary: true, onClick: function () { approveSandbox(item); } }];
    EV.setActions(acts);
  }

  async function openDetail(item) {
    state.detail = item;
    listEl.style.display = 'none';
    detailEl.style.display = 'flex';
    detailNameEl.textContent = item.name;
    detailMetaEl.innerHTML = '';
    titleActionsEl.innerHTML = '';
    if (item.kind === 'sandbox') {
      // 沙盒条目只靠标题区分，不再重复「加工中」与沙盒编号
      if (item.type === 'skill' || item.type === 'mcp' || item.type === 'sensor') {
        titleActionsEl.appendChild(revealButton(item));
      }
    } else {
      detailMetaEl.appendChild(EV.el('span', 'chip mute', '正式库'));
    }
    stageEl.innerHTML = '';

    if (item.kind === 'formal') {
      // 正式库条目：模块支持按名字打开时直接进入编辑器（如 PARADIGM 编排、Graph 画布），
      // 否则退回只读简介卡。
      var formalMod = EV.module(item.type);
      if (!formalMod || !formalMod.openFormal) {
        renderFormalDetail(item);
        return;
      }
    }
    var mod = EV.module(item.type);
    if (!mod) {
      stageEl.appendChild(EV.el('div', 'center', '模块未加载：' + item.type));
      return;
    }
    var root = detailRoots[item.type];
    if (!root) {
      root = EV.el('div', 'pane');
      detailRoots[item.type] = root;
      stageEl.appendChild(root);
      try { mod.mount(root); } catch (e) {
        root.innerHTML = '';
        root.appendChild(EV.el('div', 'hint err', '渲染失败：' + e.message));
      }
    } else {
      stageEl.appendChild(root);
      if (mod.onShow) { try { mod.onShow(); } catch (e) { /* 忽略刷新失败 */ } }
    }
    if (item.kind === 'formal') {
      if (mod.openFormal) {
        try { mod.openFormal(item); } catch (e) { /* 忽略打开失败 */ }
      }
    } else if (mod.openDetail) {
      try { mod.openDetail(item); } catch (e) { /* 忽略打开失败 */ }
    }
    bindSandboxActions(item);
  }

  function backToList() {
    state.detail = null;
    detailEl.style.display = 'none';
    listEl.style.display = 'flex';
    stageEl.innerHTML = '';
    detailMetaEl.innerHTML = '';
    titleActionsEl.innerHTML = '';
    EV.setActions([]);
    var type = state.type;
    loadSandboxes(type).then(function () {
      if (state.type === type) renderList();
    });
  }

  /* ---------------- 交互 ---------------- */
  filterBtnEl.onclick = function (e) {
    e.stopPropagation();
    var open = filterEl.classList.toggle('open');
    if (open && !formalLoaded(state.type)) loadFormal(state.type);
  };
  document.addEventListener('click', function () { filterEl.classList.remove('open'); });
  filterMenuEl.addEventListener('click', function (e) { e.stopPropagation(); });
  document.getElementById('detailBack').onclick = backToList;
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.detail) backToList();
  });

  /* ---------------- 启动 ---------------- */
  document.getElementById('filterChev').innerHTML = EV.icon('chevronDown', 13);
  document.getElementById('detailBack').innerHTML = EV.icon('back', 14) + '返回';
  renderList();
  Promise.all(TYPES.map(function (t) { return loadSandboxes(t.id); })).then(function () {
    renderList();
    loadFormal(state.type);
  });
})();
</script>
</body>
</html>
