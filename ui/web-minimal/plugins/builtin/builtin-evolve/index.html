<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>进化工厂</title>
<style>
  /* 插件运行在面板 iframe 内，宿主 CSS 变量不跨文档继承：自带 token 并 fallback */
  :root {
    --ink: var(--wm-label, #16191d);
    --ink-2: var(--wm-label-2nd, #4c5560);
    --dim: var(--wm-label-dim, #8b96a3);
    --field: var(--wm-bg-input, #f2f4f7);
    --field-soft: #f7f8fa;
    --hover: var(--wm-bg-hover, #e9edf1);
    --line: rgba(15, 17, 21, 0.08);
    --accent: var(--wm-accent, #16191d);
    --ok: #3f7a4d;
    --err: #bf616a;
    --warn: #b7791f;
    --mono: var(--wm-mono, ui-monospace, "Cascadia Code", Consolas, monospace);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--wm-font, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    font-size: 13px; color: var(--ink); background: #fff;
    display: flex; flex-direction: column; overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c6cdd5; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #adb6c0; }
  /* 图标语言：与白条/浏览器插件统一（线性描边、1.5 线宽） */
  svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  button { font: inherit; color: inherit; }

  /* ---------- 顶部标签栏 ---------- */
  .top { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px 0; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; padding: 6px 12px; font-size: 12px; color: var(--ink-2);
    background: transparent; border: none; border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  .tab:hover { background: var(--hover); }
  .tab.on { background: var(--accent); color: #fff; font-weight: 600; }
  .topright { margin-left: auto; flex: none; display: flex; align-items: center; gap: 4px; padding-bottom: 8px; }
  .hbtn {
    width: 26px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px; background: transparent; color: var(--ink-2); cursor: pointer;
  }
  .hbtn:hover { background: var(--hover); color: var(--ink); }
  .hbtn:disabled { opacity: .4; cursor: default; }
  .hbtn svg { width: 15px; height: 15px; }
  .hbtn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 舞台（各标签自行填充） ---------- */
  .stage { flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .pane { flex: 1; min-height: 0; display: flex; overflow: hidden; }

  /* 左列表 + 右详情 */
  .side { width: 200px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); overflow: hidden; }
  .side-head {
    flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--dim); text-transform: uppercase;
  }
  .side-head .spacer { margin-left: auto; }
  .side-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* 左侧列表收起按钮：样式对齐白条底部的 rail-toggle（☰） */
  .side-toggle {
    flex: none; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px; background: transparent; color: var(--ink-2); cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .side-toggle:hover { background: var(--hover); color: var(--ink); }
  .side-toggle svg { width: 15px; height: 15px; }
  /* 收起态：左列表缩成一条只保留开关的窄条 */
  .side.ev-collapsed { width: 46px !important; }
  .side.ev-collapsed > .side-head { padding: 8px 0 6px; justify-content: center; }
  .side.ev-collapsed > .side-head > *:not(.side-toggle) { display: none; }
  .side.ev-collapsed > .side-body { display: none; }

  /* 左侧列表内的抽屉（可折叠分组） */
  .drawer { border-radius: 8px; }
  .drawer > summary {
    display: flex; align-items: center; gap: 6px; list-style: none; cursor: pointer;
    padding: 7px 10px; border-radius: 8px; font-size: 11px; font-weight: 600;
    letter-spacing: .06em; color: var(--dim); text-transform: uppercase; user-select: none;
  }
  .drawer > summary::-webkit-details-marker { display: none; }
  .drawer > summary:hover { background: var(--hover); }
  .drawer > summary .chev { display: inline-flex; flex: none; transition: transform .15s ease; }
  .drawer[open] > summary .chev { transform: rotate(90deg); }
  .drawer > summary .spacer { margin-left: auto; }
  .drawer-body { padding: 2px 0 8px; }

  /* 抽屉内的「特殊引用说明」条目：键 + 说明 */
  .ref { padding: 6px 10px; border-radius: 8px; }
  .ref:hover { background: var(--field-soft); }
  .ref-k { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--ink); }
  .ref-d { font-size: 11px; line-height: 1.65; color: var(--dim); margin-top: 2px; word-break: break-all; }

  .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; position: relative; }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--field); }
  .item-name { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
  .item-name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-sub { margin-top: 3px; font-size: 10.5px; color: var(--dim); word-break: break-all; line-height: 1.5; }
  .item-goal { margin-top: 3px; font-size: 11px; color: var(--warn); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-x {
    position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; display: none;
    align-items: center; justify-content: center; border: none; border-radius: 6px;
    background: transparent; color: var(--dim); cursor: pointer;
  }
  .item:hover .item-x { display: flex; }
  .item-x:hover { background: rgba(191, 97, 106, .12); color: var(--err); }
  .item-x svg { width: 14px; height: 14px; }

  /* ---------- 子标签 ---------- */
  .subtabs { flex: none; display: flex; align-items: center; gap: 2px; padding: 8px 12px 0; }
  .subtab {
    padding: 5px 11px; font-size: 11.5px; color: var(--ink-2);
    background: transparent; border: 1px solid transparent; border-radius: 999px; cursor: pointer;
  }
  .subtab:hover { background: var(--hover); }
  .subtab.on { background: var(--accent); color: #fff; font-weight: 600; }
  .subtabs .spacer { margin-left: auto; }

  .toolbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px 6px; }
  .toolbar .spacer { margin-left: auto; }
  .toolbar .note { font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 按钮 ---------- */
  .btn {
    height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--ink-2); background: #fff;
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.primary:hover { background: var(--accent); filter: brightness(1.15); }
  .btn.danger { background: var(--err); border-color: transparent; color: #fff; }
  .btn.danger:hover { background: var(--err); filter: brightness(1.08); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--hover); }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 11.5px; }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn.sm svg { width: 13px; height: 13px; }
  .ibtn {
    width: 26px; height: 26px; flex: none; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink-2); cursor: pointer;
  }
  .ibtn:hover { background: var(--hover); color: var(--ink); }
  .ibtn.danger:hover { background: rgba(191, 97, 106, .12); color: var(--err); border-color: transparent; }
  .ibtn svg { width: 14px; height: 14px; }
  .field > input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

  /* ---------- 表单 ---------- */
  .scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .pad { padding: 10px 14px 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; padding: 7px 0; }
  .field > label { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
  .field .desc { font-size: 11px; color: var(--dim); line-height: 1.6; }
  .input, .textarea, .select {
    width: 100%; font: inherit; font-size: 12.5px; color: var(--ink);
    background: var(--field); border: 1px solid transparent; border-radius: 8px;
    padding: 7px 10px; outline: none;
  }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--accent); background: #fff; }
  .textarea { resize: vertical; min-height: 72px; line-height: 1.7; }
  .mono { font-family: var(--mono); font-size: 12px; line-height: 1.7; }
  .editor-area {
    flex: 1; min-height: 0; width: 100%; resize: none; border: none; outline: none;
    background: #fff; padding: 12px 14px; font-family: var(--mono); font-size: 12px;
    line-height: 1.75; color: var(--ink); white-space: pre; overflow: auto; tab-size: 2;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .grow { flex: 1; min-width: 0; }
  .inline-field { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }

  /* ---------- 卡片 / 提示 ---------- */
  .card { background: var(--field-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-title { font-size: 13px; font-weight: 700; word-break: break-all; }
  .hint { padding: 14px; font-size: 12px; color: var(--dim); line-height: 1.8; }
  .hint.err { color: var(--err); word-break: break-all; white-space: pre-wrap; }
  .center {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 28px; text-align: center; color: var(--dim);
  }
  .center .big { font-size: 14px; font-weight: 700; color: var(--ink-2); }
  .center .sub { font-size: 12px; line-height: 1.8; max-width: 460px; }
  .center svg { width: 34px; height: 34px; opacity: .5; }
  .chip { flex: none; padding: 1px 7px; border-radius: 999px; font-size: 10px; background: rgba(63, 122, 77, .12); color: var(--ok); }
  .chip.warn { background: rgba(183, 121, 31, .14); color: var(--warn); }
  .chip.err { background: rgba(191, 97, 106, .14); color: var(--err); }
  .chip.mute { background: rgba(15, 17, 21, .07); color: var(--ink-2); }
  .pre {
    max-height: 260px; overflow: auto; padding: 9px 11px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.65; color: var(--ink-2);
    background: var(--field-soft); border: 1px solid var(--line); border-radius: 8px;
    white-space: pre-wrap; word-break: break-all;
  }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.tbl th {
    text-align: left; font-size: 11px; font-weight: 600; color: var(--dim);
    padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  table.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
  table.tbl tr:last-child td { border-bottom: none; }
  table.tbl code { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }

  /* diff 视图 */
  .diff { font-family: var(--mono); font-size: 11.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
  .diff .ln { padding: 0 8px; border-radius: 3px; }
  .diff .ln.add { background: rgba(63, 122, 77, .14); color: #2f6a3d; }
  .diff .ln.del { background: rgba(191, 97, 106, .14); color: #a8484f; }
  .diff .ln.hd { color: var(--dim); }

  /* markdown 渲染 */
  .md { font-size: 12.5px; line-height: 1.8; color: var(--ink); word-break: break-word; }
  .md > :first-child { margin-top: 0; }
  .md h1 { font-size: 18px; margin: 16px 0 8px; }
  .md h2 { font-size: 15.5px; margin: 16px 0 8px; }
  .md h3 { font-size: 13.5px; margin: 14px 0 6px; }
  .md h4, .md h5, .md h6 { font-size: 12.5px; margin: 12px 0 6px; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md a { color: #2f6fdb; }
  .md code { font-family: var(--mono); font-size: 11.5px; background: rgba(15, 17, 21, .06); padding: 1px 4px; border-radius: 4px; }
  .md pre { background: var(--field-soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; margin: 10px 0; }
  .md pre code { background: transparent; padding: 0; font-size: 11.5px; line-height: 1.65; white-space: pre; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--ink-2); margin: 10px 0; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  .md table { border-collapse: collapse; margin: 10px 0; font-size: 12px; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; }
  .md th { background: var(--field-soft); }
  .md img { max-width: 100%; }

  /* ---------- 弹层 ---------- */
  .mask {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    padding: 22px; background: rgba(15, 17, 21, .34);
  }
  .dlg {
    display: flex; flex-direction: column; overflow: hidden; width: 100%;
    max-width: var(--dlg-w, 460px); max-height: 88%;
    background: #fff; border-radius: 12px; box-shadow: 0 22px 55px rgba(15, 17, 21, .26);
  }
  .dlg-head {
    flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600;
  }
  .dlg-head .spacer { margin-left: auto; }
  .dlg-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; font-size: 12.5px; line-height: 1.75; }
  .dlg-body.flush { padding: 0; display: flex; flex-direction: column; }
  .dlg-foot { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 11px 14px; border-top: 1px solid var(--line); }

  .toast {
    position: fixed; left: 50%; bottom: 18px; max-width: 82%; z-index: 90;
    padding: 7px 14px; border-radius: 999px; font-size: 12px;
    background: rgba(22, 25, 29, .92); color: #fff; white-space: pre-wrap; text-align: center;
    opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(8px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: rgba(191, 97, 106, .96); }
</style>
</head>
<body>
  <div class="top">
    <div class="tabs" id="tabs"></div>
    <div class="topright" id="actions"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="toast" id="toast"></div>
  <div id="modals"></div>

<script src="/minimal/assets/vendor/marked.min.js"></script>
<script>
/* ============================================================================
 * 进化工厂（builtin-evolve）插件核心：样式 token + 通用工具 + 标签路由
 *

 *   id ∈ 'skill' | 'mcp' | 'graph' | 'agentloop' | 'sensor'
 *   mount(root)：首次激活时调用一次；root 已清空，模块自行渲染并保留 DOM。
 *
 * 可用工具（window.EV）：

 *   EV.toast(msg, isErr)                 轻提示
 *   EV.modal({title, node|html, width, actions:[{label,kind,onClick,close}]}) → {close}
 *   EV.confirm({title, message, okLabel, danger}) → Promise<boolean>
 *   EV.prompt({title, label, value, placeholder, okLabel}) → Promise<string|null>
 *   EV.setActions([{icon|label, title, primary, danger, disabled, onClick}])  右上角动作按钮
 *   EV.attachSideToggle(sideEl, headEl, label, onToggle)  在左列表头部追加「收起」开关
 *   EV.drawer(title, count, open, onToggle, fill)  左列表内的可折叠抽屉
 *   EV.md(text)                          markdown → HTML

 * ========================================================================== */

    chevron: '<path d="m9 6 6 6-6 6"/>',
    menu: '<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>',
    dot: '<circle cx="12" cy="12" r="4"/>'
  };

  var tabsEl = document.getElementById('tabs');
  var actionsEl = document.getElementById('actions');
  var stageEl = document.getElementById('stage');
  var toastEl = document.getElementById('toast');
  var modalsEl = document.getElementById('modals');

  var registry = {};   // id -> {label, icon, mount}
  var order = [];
  var mounted = {};    // id -> element
  var active = null;

  // ---------- 基础工具 ----------
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function icon(name, size) {
    var body = ICONS[name] || ICONS.dot;
    var s = size || 15;
    return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" ' +
      'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function debounce(fn, ms) {
    var t = null;
    return function () { var a = arguments, self = this; clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms || 200); };
  }
  function fmtTime(s) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d.getTime())) return String(s);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  var toastTimer = null;
  function toast(msg, isErr) {
    toastEl.textContent = String(msg == null ? '' : msg);
    toastEl.className = 'toast on' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, isErr ? 3600 : 2200);
  }

  // ---------- 同源 REST ----------
  async function request(method, url, body) {
    var init = { method: method };
    if (body !== undefined && body !== null) {
      init.headers = { 'Content-Type': 'application/json' };
      init.body = JSON.stringify(body);
    }
    var res;
    try { res = await fetch(url, init); }
    catch (e) { throw new Error('网络异常：' + (e && e.message ? e.message : '请求失败')); }
    var data = null;
    var text = await res.text();
    if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
    if (!res.ok) {
      var detail = (data && (data.detail || data.message)) || text || ('HTTP ' + res.status);
      if (typeof detail !== 'string') detail = JSON.stringify(detail);
      throw new Error(detail);
    }
    return data;
  }
  var api = {
    get: function (u) { return request('GET', u); },
    put: function (u, b) { return request('PUT', u, b); },
    post: function (u, b) { return request('POST', u, b); },
    del: function (u) { return request('DELETE', u); }
  };
  function qs(obj) {
    var parts = [];
    Object.keys(obj || {}).forEach(function (k) {
      var v = obj[k];
      if (v === undefined || v === null || v === '') return;
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
    });
    return parts.length ? '?' + parts.join('&') : '';
  }

  // ---------- 弹层 ----------
  function modal(opts) {
    opts = opts || {};
    var mask = el('div', 'mask');
    var dlg = el('div', 'dlg');
    if (opts.width) dlg.style.setProperty('--dlg-w', opts.width);

    var head = el('div', 'dlg-head');
    head.appendChild(el('span', null, opts.title || ''));
    if (opts.headExtra) head.appendChild(opts.headExtra);
    var closeBtn = el('button', 'hbtn');
    closeBtn.innerHTML = icon('x', 15);
    closeBtn.title = '关闭';
    closeBtn.onclick = function () { close(); };
    head.appendChild(el('span', 'spacer'));
    head.appendChild(closeBtn);
    dlg.appendChild(head);

    var body = el('div', 'dlg-body' + (opts.flush ? ' flush' : ''));
    if (opts.node) body.appendChild(opts.node);
    else if (opts.html != null) body.innerHTML = opts.html;
    dlg.appendChild(body);

    var foot = null;
    if (opts.actions && opts.actions.length) {
      foot = el('div', 'dlg-foot');
      opts.actions.forEach(function (a) {
        var b = el('button', 'btn' + (a.kind ? ' ' + a.kind : ''));
        if (a.icon) b.innerHTML = icon(a.icon, 15);
        var span = el('span', null, a.label || '');
        b.appendChild(span);
        if (a.title) b.title = a.title;
        if (a.disabled) b.disabled = true;
        b.onclick = function () { if (a.onClick) a.onClick(handle); else if (a.close !== false) close(); };
        foot.appendChild(b);
      });
      dlg.appendChild(foot);
    }
    mask.appendChild(dlg);
    mask.addEventListener('mousedown', function (e) { if (e.target === mask && opts.maskClose !== false) close(); });
    modalsEl.appendChild(mask);

    var closed = false;
    function close() {
      if (closed) return;
      closed = true;
      mask.remove();
      if (opts.onClose) opts.onClose();
    }
    var handle = { el: dlg, body: body, foot: foot, close: close };
    if (opts.onOpen) opts.onOpen(handle);
    return handle;
  }

  function confirm(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var answered = false;
      modal({
        title: opts.title || '确认操作',
        width: opts.width || '420px',
        html: '<div style="line-height:1.8;white-space:pre-wrap;word-break:break-word">' + escapeHtml(opts.message || '') + '</div>',
        actions: [
          { label: opts.cancelLabel || '取消', onClick: function (h) { answered = true; resolve(false); h.close(); } },
          {
            label: opts.okLabel || '确定', kind: opts.danger ? 'danger' : 'primary',
            onClick: function (h) { answered = true; resolve(true); h.close(); }
          }
        ],
        onClose: function () { if (!answered) resolve(false); }
      });
    });
  }

  function prompt(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var wrap = el('div');
      if (opts.label) {
        var f = el('div', 'field');
        f.appendChild(el('label', null, opts.label));
        wrap.appendChild(f);
      }
      var input = el('input', 'input');
      input.type = 'text';
      input.value = opts.value || '';
      input.placeholder = opts.placeholder || '';
      if (opts.mono) input.classList.add('mono');
      wrap.appendChild(input);
      if (opts.desc) wrap.appendChild(el('div', 'hint', opts.desc));

      var answered = false;
      var h = modal({
        title: opts.title || '输入',
        width: opts.width || '420px',
        node: wrap,
        actions: [
          { label: '取消', onClick: function (m) { answered = true; resolve(null); m.close(); } },
          {
            label: opts.okLabel || '确定', kind: 'primary',
            onClick: function (m) {
              var v = input.value.trim();
              if (!v && !opts.allowEmpty) { toast('不能为空', true); return; }
              answered = true; resolve(v); m.close();
            }
          }
        ],
        onOpen: function () { setTimeout(function () { input.focus(); input.select(); }, 30); },
        onClose: function () { if (!answered) resolve(null); }
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); h.foot.querySelector('.btn.primary').click(); }
      });
    });
  }

  // ---------- markdown ----------
  function md(text) {
    if (!text) return '';
    if (window.marked && typeof window.marked.parse === 'function') {
      try {
        return window.marked.parse(String(text), { gfm: true, breaks: true });
      } catch (e) { /* fallthrough */ }
    }
    return '<p>' + escapeHtml(text).replace(/\n/g, '<br>') + '</p>';
  }

  // ---------- 右上角动作 ----------
  var activeActions = [];
  function setActions(list) {
    activeActions = list || [];
    actionsEl.innerHTML = '';
    activeActions.forEach(function (a) {
      var b = el('button', a.label ? 'btn sm' : 'hbtn');
      if (a.icon && a.label) b.innerHTML = icon(a.icon, 14);
      else if (a.icon) { b.innerHTML = icon(a.icon, 15); b.title = a.title || ''; }
      else b.title = a.title || '';
      if (a.label) {
        b.appendChild(el('span', null, a.label));
        if (a.title) b.title = a.title;
      }
      if (a.primary) b.classList.add('primary');
      if (a.danger) b.classList.add('danger');
      if (a.disabled) b.disabled = true;
      b.onclick = function () { if (a.onClick) a.onClick(); };
      actionsEl.appendChild(b);
    });
  }

  // ---------- 左侧列表收起开关 ----------
  // 把一个 ☰ 开关追加到头部；点击在 sideEl 上切换 ev-collapsed，
  // 收起后仅保留头部窄条与开关本身，主区域自动铺满。
  function attachSideToggle(sideEl, headEl, label, onToggle) {
    var what = label || '左侧列表';
    var btn = el('button', 'side-toggle');
    btn.type = 'button';
    btn.innerHTML = icon('menu', 15);
    btn.title = (sideEl.classList.contains('ev-collapsed') ? '展开' : '收起') + what;
    btn.onclick = function (e) {
      e.stopPropagation();
      var collapsed = sideEl.classList.toggle('ev-collapsed');
      btn.title = (collapsed ? '展开' : '收起') + what;
      if (onToggle) onToggle(collapsed);
    };
    headEl.appendChild(btn);
    return btn;
  }

  // 生成一个可折叠抽屉（<details>），fill(bodyEl) 负责填充内容
  function drawer(title, count, open, onToggle, fill) {
    var d = el('details', 'drawer');
    d.open = !!open;
    var s = el('summary');
    var chev = el('span', 'chev');
    chev.innerHTML = icon('chevron', 12);
    s.appendChild(chev);
    s.appendChild(el('span', null, title));
    s.appendChild(el('span', 'spacer'));
    if (count) s.appendChild(el('span', 'chip mute', String(count)));
    d.appendChild(s);
    var body = el('div', 'drawer-body');
    fill(body);
    d.appendChild(body);
    d.addEventListener('toggle', function () { if (onToggle) onToggle(d.open); });
    return d;
  }

  // ---------- 标签路由 ----------
  function register(id, mod) {
    if (registry[id]) return;
    registry[id] = mod;
    order.push(id);
  }
  function activate(id) {
    if (!registry[id]) return;
    active = id;
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.classList.toggle('on', b.dataset.tab === id);
    });
    stageEl.innerHTML = '';
    var mod = registry[id];
    if (!mounted[id]) {
      var root = el('div', 'pane');
      mounted[id] = root;
      stageEl.appendChild(root);
      try { mod.mount(root); } catch (e) { root.innerHTML = ''; root.appendChild(el('div', 'hint err', '插件标签渲染失败：' + e.message)); }
    } else {
      stageEl.appendChild(mounted[id]);
      if (mod.onShow) { try { mod.onShow(); } catch (e) { /* noop */ } }
    }
    setActions(mod.actions ? mod.actions() : []);
  }
  function buildTabs() {
    tabsEl.innerHTML = '';
    order.forEach(function (id) {
      var mod = registry[id];
      var b = el('button', 'tab', mod.label || id);
      b.dataset.tab = id;
      b.onclick = function () { activate(id); };
      tabsEl.appendChild(b);
    });
  }

  window.EV = {
    el: el, icon: icon, escape: escapeHtml, debounce: debounce, fmtTime: fmtTime,
    toast: toast, api: api, qs: qs, modal: modal, confirm: confirm, prompt: prompt,
    md: md, setActions: setActions, register: register, activate: activate,
    attachSideToggle: attachSideToggle, drawer: drawer,
    on: function () {}
  };
  // 供标签模块在 mount 前声明标签元信息
  window.EV.defineTab = function (id, label, mod) { mod.label = label; register(id, mod); };

  // ---------- 宿主事件（configApply 等）可忽略；面板由宿主管理显示 ----------
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'event' && m.event === 'conversation.local') {
      // 会话变化不影响进化工厂
    }
  });

  // ---------- 模块加载完成后构建标签 ----------
  window.EVOLVE_BOOT = function () {
    buildTabs();
    var first = ['skill', 'mcp', 'graph', 'agentloop', 'sensor'].filter(function (id) { return registry[id]; });
    if (first.length === 0) {
      stageEl.innerHTML = '<div class="center"><div class="big">没有可用的标签</div></div>';
      return;
    }
    activate(first[0]);
    if (!document.querySelector('.tab.on')) activate(order[0]);
  };
})();
</script>
<script src="js/skill.js"></script>
<script src="js/mcp.js"></script>
<script src="js/graph.js"></script>
<script src="js/agentloop.js"></script>
<script src="js/sensor.js"></script>
<script>window.EVOLVE_BOOT();</script>
</body>
