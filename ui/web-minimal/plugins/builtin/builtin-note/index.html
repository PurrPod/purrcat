  var SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>';
  var MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';

  // 起床时间标太阳、睡觉时间标月亮，贴边时改变对齐方向避免被裁掉。
  function renderMarks(win) {
    markAt(el.wakeMark, win.wake, '起床 ' + CORE.fmtHHMM(win.wake), SUN_SVG);
    markAt(el.sleepMark, win.sleep, '睡觉 ' + CORE.fmtHHMM(win.sleep), MOON_SVG);
  }

  function markAt(node, minutes, title, svg) {
    var p = clamp(minutes / 1440 * 100, 0, 100);
    node.innerHTML = svg;
    node.title = title;
    node.style.left = p + '%';
    node.classList.toggle('is-left', p < 4);
    node.classList.toggle('is-right', p > 96);
  }

  function placeZone(node, left, width, right) {
    node.style.left = clamp(left, 0, 100) + '%';
    node.style.width = clamp(width, 0, 100) + '%';
    node.style.display = width > 0.01 ? 'block' : 'none';
    node.classList.toggle('right', !!right);
  }

  function renderHours() {
    var ticks = '';
    var axis = '';
    for (var h = 0; h <= 24; h += 3) {
      var p = h / 24 * 100;
      ticks += '<div class="tl-hour" style="left:' + p + '%"></div>';
      axis += '<span style="left:' + p + '%">' + (h === 24 ? '24' : pad2(h)) + '</span>';
    }
    el.hours.innerHTML = ticks;
    document.getElementById('tlAxis').innerHTML = axis;
  }

  function renderEntries() {
    var html = '';
    CORE.timelineEntries(S.source).forEach(function (entry, i) {
      var start = Number(entry.start);
      var end = Number(entry.end);
      if (!isFinite(start) || !isFinite(end)) return;
      var color = ENTRY_COLORS[i % ENTRY_COLORS.length];
      html += '<div class="tl-entry" style="--c:' + color + ';left:' + (start / 1440 * 100) + '%;width:' +
        Math.max(0.35, (end - start) / 1440 * 100) + '%" title="' +
        esc(CORE.fmtHHMM(start) + ' – ' + CORE.fmtHHMM(end) + ' · ' + entry.title) + '">' +
        '</div>';
    });
    el.entries.innerHTML = html;
  }

  function tick() {
    var mins = nowMinutes();
    var p = CORE.dayProgress(mins, S.config.wake, S.config.sleep);
    el.remain.textContent = '剩余 ' + Math.round(100 - p.percent) + '%';
    el.now.style.left = (mins / 1440 * 100) + '%';
    el.now.title = CORE.fmtHHMM(mins);
    el.rest.style.left = (mins / 1440 * 100) + '%';
    var today = todayKey();
    if (S.date === S.lastToday && today !== S.lastToday) {
      switchDate(today);
    }
    S.lastToday = today;
    var parts = dateParts(S.date);
    el.date.textContent = parts.date;
    el.weekday.textContent = parts.weekday;
    el.kicker.textContent = S.date === today ? 'Today' : 'Archive';
    el.clock.textContent = CORE.fmtHHMM(mins);
    if (S.lastDate !== S.date) {
      S.lastDate = S.date;
      renderEntries();
    }
  }

  // 时间线拖拽
  var dragState = null;
  function ratioFromEvent(e) {
    var rect = el.tl.getBoundingClientRect();
    return clamp((e.clientX - rect.left) / Math.max(1, rect.width), 0, 1);
  }
  function ratioToDayMinutes(ratio) {
    return Math.round(clamp(ratio, 0, 1) * 1440);
  }
  function paintDrag() {
    if (!dragState) {
      el.drag.style.display = 'none';
      return;
    }
    var a = Math.min(dragState.start, dragState.end);
    var b = Math.max(dragState.start, dragState.end);
    el.drag.style.display = 'block';
    el.drag.style.left = (a * 100) + '%';
    el.drag.style.width = Math.max(0, (b - a) * 100) + '%';
  }

  el.tl.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    dragState = { start: ratioFromEvent(e), end: ratioFromEvent(e), downX: e.clientX, moved: false };
    try { el.tl.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  el.tl.addEventListener('pointermove', function (e) {
    if (!dragState) return;
    dragState.end = ratioFromEvent(e);
    if (!dragState.moved && Math.abs(e.clientX - dragState.downX) > 3) dragState.moved = true;
    if (dragState.moved) paintDrag();
  });
  el.tl.addEventListener('pointerup', function (e) {
    if (!dragState) return;
    dragState.end = ratioFromEvent(e);
    var a = Math.min(dragState.start, dragState.end);
    var b = Math.max(dragState.start, dragState.end);
    var moved = dragState.moved;
    dragState = null;
    paintDrag();
    if (!moved) return;
    var startMin = Math.round(ratioToDayMinutes(a) / 5) * 5;
    var endMin = Math.round(ratioToDayMinutes(b) / 5) * 5;
    if (endMin - startMin < 5) return;
    openItemModal(startMin, endMin);
  });
  el.tl.addEventListener('pointercancel', function () {
    dragState = null;
    paintDrag();
  });

  function openItemModal(startMin, endMin) {
    openModal({
      title: '记录事项',
      body: '<div class="range-chip">' + esc(fmtDayMinutes(startMin) + ' – ' + fmtDayMinutes(endMin)) + '</div>' +
        '<div class="field"><label>事项名称</label><input id="itemTitle" placeholder="例如：写周报"></div>',
      okText: '记录',
      onOk: function (wrap) {
        var input = wrap.querySelector('#itemTitle');
        var title = input.value.trim();
        if (!title) { input.focus(); return false; }
        if (S.active) { S.active = null; syncSource(); }
        S.source = CORE.appendBlock(S.source, CORE.buildPurrBlock({
          title: title,
          start: startMin,
          end: endMin
        }));
        S.lines = S.source.split('\n');
        renderDoc();
        renderTimeline();
        saveNow();
        el.sheetWrap.scrollTop = el.sheetWrap.scrollHeight;
        toast('已记录「' + title + '」');
        return true;
      }
    });
    var input = el.modal.querySelector('#itemTitle');
    if (input) {
      input.focus();
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var ok = el.modal.querySelector('[data-ok]');
          if (ok) ok.click();
        }
      });
    }
  }

  // ---------- 通用弹窗 ----------
  function openModal(opts) {
    el.modal.innerHTML = '<div class="modal">' +
      '<h3>' + esc(opts.title || '') + '</h3>' +
      (opts.sub ? '<div class="modal-sub">' + opts.sub + '</div>' : '') +
      (opts.body || '') +
      '<div class="modal-foot">' +
        '<button class="btn" data-close>取消</button>' +
        (opts.onOk ? '<button class="btn' + (opts.extraText ? '' : ' primary') + '" data-ok>' + esc(opts.okText || '确定') + '</button>' : '') +
        (opts.extraText ? '<button class="btn primary" data-extra>' + esc(opts.extraText) + '</button>' : '') +
      '</div>' +
    '</div>';
    el.modal.classList.add('show');
    el.modal.querySelector('[data-close]').addEventListener('click', closeModal);
    el.modal.onmousedown = function (e) {
      if (e.target === el.modal) closeModal();
    };
    var ok = el.modal.querySelector('[data-ok]');
    if (ok && opts.onOk) {
      ok.addEventListener('click', function () {
        if (opts.onOk(el.modal) === false) return;
        closeModal();
      });
    }
    var extra = el.modal.querySelector('[data-extra]');
    if (extra && opts.onExtra) {
      extra.addEventListener('click', function () {
        if (opts.onExtra(el.modal) === false) return;
        closeModal();
      });
    }
  }

  function closeModal() {
    el.modal.classList.remove('show');
    el.modal.innerHTML = '';
  }

  // ---------- 日期归档 ----------
  function switchDate(value) {
    if (!value || value === S.date) return;
    commitActive();
    saveNow().then(function () {
      saveRuns();
      S.date = value;
      S.loaded = false;
      S.source = '';
      S.savedSource = '';
      S.lines = [''];
      S.active = null;
      loadRuns(value);
      renderDoc();
      loadDoc();
      tick();
    });
  }

  function openDateModal() {
    openModal({
      title: '切换日期',
      body: '<div class="field"><label>查看日期</label><input type="date" id="noteDate" value="' + esc(S.date) + '"></div>' +
        '<div class="archive-list" id="archiveList"><span class="archive-empty">加载中…</span></div>',
      okText: '查看',
      onOk: function (wrap) {
        var value = wrap.querySelector('#noteDate').value;
        if (!value) return false;
        switchDate(value);
        return true;
      }
    });
    fetch('/api/note/dates?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { return res.ok ? res.json() : []; })
      .then(function (dates) {
        var box = el.modal.querySelector('#archiveList');
        if (!box) return;
        if (!Array.isArray(dates) || !dates.length) {
          box.innerHTML = '<span class="archive-empty">还没有历史归档</span>';
          return;
        }
        box.innerHTML = dates.map(function (date) {
          return '<button type="button" class="archive-item' + (date === S.date ? ' is-current' : '') +
            '" data-date="' + esc(date) + '">' + esc(date) + '</button>';
        }).join('');
        Array.prototype.forEach.call(box.querySelectorAll('[data-date]'), function (btn) {
          btn.addEventListener('click', function () {
            var value = btn.getAttribute('data-date');
            closeModal();
            switchDate(value);
          });
        });
      })
      .catch(function () {
        var box = el.modal.querySelector('#archiveList');
        if (box) box.innerHTML = '<span class="archive-empty">归档列表加载失败</span>';
      });
  }

  // ---------- 引用数据 ----------
  function refreshRefs() {
    if (S.active) return;
    renderDoc();
  }

  // ---------- 启动 ----------
  var timers = [];
  function boot() {
    if (window.marked && typeof window.marked.use === 'function') {
      window.marked.use({
        renderer: {
          html: function (html) { return esc(html); }
        }
      });
    }
    S.lastDate = S.date;
    setDrawerOpen(localStorage.getItem('purrnote.drawerOpen') !== '0', false);
    el.drawerHandle.addEventListener('click', function () {
      setDrawerOpen(el.drawer.classList.contains('is-closed'), true);
    });
    loadRuns(S.date);
    renderTimeline();
    renderDoc();
    loadDoc();
    connectTimerStream();

    el.date.addEventListener('click', openDateModal);
    document.getElementById('btnSettings').addEventListener('click', function () {
      callAction('settings.open', { tab: 'plugins' }).catch(function (err) {
        toast('打开设置失败：' + err.message);
      });
    });
    document.getElementById('btnReload').addEventListener('click', function () {
      commitActive();
      loadDoc();
      refreshRefs();
      toast('已重新载入');
    });

    window.addEventListener('beforeunload', function () {
      saveRuns();
      stopAllTaskTimers();
      if (!S.loaded || S.loadingDoc) return;
      syncSource();
      if (S.source === S.savedSource) return;
      try {
        navigator.sendBeacon('/api/note',
          new Blob([JSON.stringify({ date: S.date, content: S.source })], { type: 'application/json' }));
      } catch (_) {}
    });

    window.addEventListener('message', function (e) {
      var m = e.data;
      if (!m || typeof m !== 'object') return;
      if (m.type === 'configApply') { applyConfig(m.config || {}); return; }
      if (m.type === 'event' && m.event === 'config.updated') {
        callAction('config.get', { plugin_id: PLUGIN }).then(applyConfig).catch(function () {});
        return;
      }
      if (m.type === 'event' && m.event === 'host.unmount') {
        timers.forEach(function (t) { clearInterval(t); });
        if (S.timerStream) {
          S.timerStream.close();
          S.timerStream = null;
        }
        saveRuns();
        stopAllTaskTimers();
        saveNow();
      }
    });

    callAction('config.get', { plugin_id: PLUGIN }).then(applyConfig).catch(function () {
      applyConfig({});
    });
    refreshRefs();
    timers.push(setInterval(tick, 30000));
    timers.push(setInterval(updateRunLines, 1000));
    timers.push(setInterval(function () {
      if (S.active) return;
      refreshRefs();
    }, 60000));
  }

  boot();
})();
</script>
</body>
</html>
