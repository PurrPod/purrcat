<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>浏览器</title>
<style>
  :root {
    --rack: #ffffff;
    --field: #f2f4f7;
    --field-2: #eef1f4;
    --line: rgba(15,17,21,0.08);
    --ink: #16191d;
    --ink-2: #6b7684;
    --accent: #16191d;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--rack); color: var(--ink); font-size: 13px; }
  .toolbar {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; background: var(--rack);
  }
  /* 图标统一：线性描边、统一线宽 1.5、随按钮颜色变化（与白条内置图标同一套语言） */
  .tb-btn svg, .go svg, .mask-ico svg, .addr-ico svg {
    display: block; fill: none; stroke: currentColor;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .tb-btn svg, .go svg { width: 16px; height: 16px; }
  .addr-ico svg { width: 15px; height: 15px; }
  .mask-ico svg { width: 19px; height: 19px; }
  /* 所有工具按钮同尺寸同圆角（全部图标化，不再有文字按钮） */
  .tb-btn {
    flex: none; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px; background: transparent;
    color: var(--ink-2); cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .tb-btn:hover { background: var(--field); color: var(--ink); }
  .tb-btn:disabled { opacity: .35; cursor: default; }
  .addr {
    flex: 1; display: flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 12px;
    background: var(--field); border-radius: 15px;
    color: var(--ink-2); border: 1px solid transparent; min-width: 0;
  }
  .addr-ico { flex: none; display: flex; align-items: center; }
  .addr input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font: inherit; color: var(--ink);
  }
  .addr:focus-within { border-color: var(--accent); background: #fff; }
  /* 前往：与其它按钮同尺寸同圆角，仅用填充底色标识主操作 */
  .go {
    flex: none; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px; background: var(--accent);
    color: #fff; cursor: pointer; transition: filter .12s ease;
  }
  .go:hover { filter: brightness(1.15); }
  .frame-wrap { position: absolute; top: 42px; left: 0; right: 0; bottom: 0; background: var(--field-2); }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .mask {
    display: none; position: absolute; inset: 0; z-index: 3;
    align-items: center; justify-content: center; text-align: center;
    background: var(--field-2); padding: 24px;
  }
  .mask.on { display: flex; }
  .mask .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .mask .desc { color: var(--ink-2); margin-bottom: 14px; max-width: 460px; line-height: 1.7; word-break: break-all; }
  .mask .row { display: flex; gap: 10px; justify-content: center; }
  /* 遮罩里的操作同样是图标按钮，用 title 提示代替文字 */
  .mask-ico {
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 10px; cursor: pointer;
    background: var(--field); color: var(--ink-2);
    transition: background .12s ease, color .12s ease, filter .12s ease;
  }
  .mask-ico:hover { background: #e3e8ee; color: var(--ink); }
  .mask-ico.primary { background: var(--accent); color: #fff; }
  .mask-ico.primary:hover { background: var(--accent); color: #fff; filter: brightness(1.15); }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="tb-btn" id="back" title="后退" disabled>
      <svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    </button>
    <button class="tb-btn" id="fwd" title="前进" disabled>
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    <button class="tb-btn" id="reload" title="刷新">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="tb-btn" id="home" title="主页">
      <svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <div class="addr">
      <span class="addr-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="输入网址或搜索，回车跳转" />
    </div>
    <button class="go" id="go" title="前往">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    <button class="tb-btn" id="ext" title="在外部浏览器打开">
      <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    </button>
  </div>
  <div class="frame-wrap">
    <iframe id="view" title="浏览器页面"></iframe>
    <div class="mask" id="mask">
      <div>
        <div class="title">该页面无法内嵌显示</div>
        <div class="desc" id="maskDesc"></div>
        <div class="row">
          <button class="mask-ico" id="maskRetry" title="重试">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <button class="mask-ico primary" id="maskExt" title="在外部浏览器打开">
            <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';
  var DEFAULT_HOME = 'https://www.bing.com';
  var HOME = DEFAULT_HOME;   // 由插件配置 homepage 覆盖，默认必应
  var opened = false;        // 首页只在首次拿到配置（或兜底超时）后打开一次
  var view = document.getElementById('view');
  var urlInput = document.getElementById('url');
  var back = document.getElementById('back');
  var fwd = document.getElementById('fwd');
  var mask = document.getElementById('mask');
  var maskDesc = document.getElementById('maskDesc');
  var stack = [];
  var pos = -1;
  var loadTimer = null;

  function openExternal(u) {
    if (window.purrcat && window.purrcat.openExternal) { window.purrcat.openExternal(u).catch(function () {}); }
    else window.open(u, '_blank', 'noopener');
  }

  function showMask(u) {
    maskDesc.textContent = u || urlInput.value || HOME;
    mask.classList.add('on');
  }

  // 内嵌被拒（X-Frame-Options / CSP）时 iframe 不会触发 load：超时兜底提示
  function armTimer() {
    clearTimeout(loadTimer);
    loadTimer = setTimeout(function () {
      if (view.src) showMask(view.src);
    }, 4500);
  }
  view.addEventListener('load', function () { clearTimeout(loadTimer); });
  view.addEventListener('error', function () { clearTimeout(loadTimer); showMask(view.src); });

  function refreshNav() {
    back.disabled = pos <= 0;
    fwd.disabled = pos >= stack.length - 1;
  }
  function setUrlText(u) { urlInput.value = u; }
  function nav(u) {
    mask.classList.remove('on');
    view.src = u;
    urlInput.value = u;
    // 直接改 src 不必然进历史（同 URL 不触发 load），显式维护并跳指针
    stack = stack.slice(0, pos + 1);
    stack.push(u);
    pos = stack.length - 1;
    refreshNav();
    armTimer();
  }
  function go() {
    var raw = urlInput.value.trim();
    if (!raw) return;
    var u;
    if (/^(https?:|mailto:|file:)/i.test(raw)) u = raw;
    else if (/^[^ ]+\.[^ ]{2,}$/.test(raw)) u = 'https://' + raw;
    else u = 'https://www.bing.com/search?q=' + encodeURIComponent(raw);
    nav(u);
  }
  function stepGo(i) {
    mask.classList.remove('on');
    view.src = stack[i];
    urlInput.value = stack[i];
    refreshNav();
    armTimer();
  }

  back.addEventListener('click', function () { if (pos > 0) { pos--; stepGo(pos); } });
  fwd.addEventListener('click', function () { if (pos < stack.length - 1) { pos++; stepGo(pos); } });
  document.getElementById('reload').addEventListener('click', function () { mask.classList.remove('on'); view.src = view.src; armTimer(); });
  document.getElementById('home').addEventListener('click', function () { nav(HOME); });
  document.getElementById('go').addEventListener('click', go);
  document.getElementById('ext').addEventListener('click', function () { openExternal(view.src || urlInput.value || HOME); });
  document.getElementById('maskExt').addEventListener('click', function () { openExternal(view.src || urlInput.value || HOME); });
  document.getElementById('maskRetry').addEventListener('click', function () { mask.classList.remove('on'); armTimer(); });
  urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });

  // 首页地址来自插件配置（宿主在 iframe load 时下发 configApply），默认必应
  function applyConfig(cfg) {
    var h = cfg && typeof cfg.homepage === 'string' ? cfg.homepage.trim() : '';
    HOME = h || DEFAULT_HOME;
    if (!opened) { opened = true; nav(HOME); }
  }
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (m && typeof m === 'object' && m.type === 'configApply') applyConfig(m.config);
  });
  // 兜底：宿主未下发配置（独立打开等）时仍按默认主页打开
  setTimeout(function () { if (!opened) { opened = true; nav(HOME); } }, 300);
})();
</script>
</body>
</html>
