<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>浏览器</title>
<style>
  :root {
    --rack: #ffffff;
    --field: #f2f4f7;
    --field-2: #eef1f4;
    --line: rgba(15,17,21,0.08);
    --ink: #16191d;
    --ink-2: #6b7684;
    --accent: #16191d;
    --pick: #EBCB8B;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--rack); color: var(--ink); font-size: 13px; }
  body { display: flex; flex-direction: column; }

  /* 多标签页标签栏：与工具栏同底色，滚动不换行 */
  .tabs {
    position: relative; z-index: 2; flex: none;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px 0; background: var(--rack);
  }
  .tab-list { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; }
  .tab-list::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: flex; align-items: center; gap: 6px;
    max-width: 180px; height: 28px; padding: 0 6px 0 10px;
    border-radius: 8px; background: var(--field); color: var(--ink-2);
    cursor: pointer; font-size: 12px;
  }
  .tab.active { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .tab-title { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-close {
    flex: none; width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: inherit;
    border-radius: 5px; cursor: pointer; opacity: .5;
  }
  .tab-close:hover { background: var(--field-2); opacity: 1; }
  .tab-close svg { width: 10px; height: 10px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .tab-add {
    flex: none; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 8px; background: transparent;
    color: var(--ink-2); cursor: pointer; transition: background .12s ease, color .12s ease;
  }
  .tab-add:hover { background: var(--field); color: var(--ink); }

  .toolbar {
    position: relative; z-index: 2; flex: none;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; background: var(--rack);
  }
  /* 图标统一：线性描边、统一线宽 1.5、随按钮颜色变化（与白条内置图标同一套语言） */
  .tb-btn svg, .go svg, .addr-ico svg, .tab-add svg {
    display: block; fill: none; stroke: currentColor;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .tb-btn svg, .go svg { width: 16px; height: 16px; }
  .addr-ico svg { width: 15px; height: 15px; }
  .tab-add svg { width: 16px; height: 16px; }
  /* 所有工具按钮同尺寸同圆角（全部图标化，不再有文字按钮） */
  .tb-btn {
    flex: none; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px; background: transparent;
    color: var(--ink-2); cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .tb-btn:hover { background: var(--field); color: var(--ink); }
  .tb-btn:disabled { opacity: .35; cursor: default; }
  .tb-btn.on { background: var(--pick); color: var(--ink); }
  .addr {
    flex: 1; display: flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 12px;
    background: var(--field); border-radius: 15px;
    color: var(--ink-2); border: 1px solid transparent; min-width: 0;
  }
  .addr-ico { flex: none; display: flex; align-items: center; }
  .addr input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font: inherit; color: var(--ink);
  }
  .addr:focus-within { border-color: var(--accent); background: #fff; }
  /* 前往：与其它按钮同尺寸同圆角，仅用填充底色标识主操作 */
  .go {
    flex: none; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px; background: var(--accent);
    color: #fff; cursor: pointer; transition: filter .12s ease;
  }
  .go:hover { filter: brightness(1.15); }

  /* 网页显示区：真实浏览器画面由 Electron 原生 WebContentsView 覆盖在此区域之上 */
  .view-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--field-2); }
  .hint {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: var(--ink-2); line-height: 1.8; font-size: 13px;
  }
  /* 选取模式：原生视图被移出屏幕，改为渲染实时截图 + 标注层（与完整模式同一套流程） */
  .stage { position: absolute; left: 0; top: 0; display: none; overflow: hidden; }
  .stage.on { display: block; }
  .logical { position: absolute; left: 0; top: 0; transform-origin: top left; }
  .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
  .hit { position: absolute; inset: 0; cursor: crosshair; }
  .rect { position: absolute; display: none; pointer-events: none; }
  .rect.hover { border: 2px solid var(--pick); background: rgba(235,203,139,0.15); }
  .rect.sel { border: 2px solid var(--pick); background: rgba(235,203,139,0.20); }
  .cbox {
    position: absolute; display: none; width: 280px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(15,17,21,0.18); padding: 10px;
  }
  .cbox .t { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--ink-2); margin-bottom: 6px; }
  .cbox textarea {
    width: 100%; height: 68px; resize: none; font: inherit; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px; outline: none;
  }
  .cbox textarea:focus { border-color: var(--accent); }
  .cbox .row { display: flex; gap: 8px; margin-top: 8px; }
  .cbox button {
    flex: 1; height: 30px; border: none; border-radius: 7px; cursor: pointer;
    font: inherit; font-weight: 600; background: var(--field); color: var(--ink);
  }
  .cbox button.primary { background: var(--accent); color: #fff; }
  .cbox button.primary:hover { filter: brightness(1.15); }
  .toast {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    max-width: 80%; padding: 8px 14px; border-radius: 8px; display: none;
    background: rgba(22,25,29,0.86); color: #fff; font-size: 12px; z-index: 9;
  }
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab-list" id="tabList"></div>
    <button class="tab-add" id="tabAdd" title="新建标签页">
      <svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </button>
  </div>
  <div class="toolbar">
    <button class="tb-btn" id="back" title="后退" disabled>
      <svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    </button>
    <button class="tb-btn" id="fwd" title="前进" disabled>
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    <button class="tb-btn" id="reload" title="刷新">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="tb-btn" id="home" title="主页">
      <svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <div class="addr">
      <span class="addr-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="输入网址或搜索，回车跳转" />
    </div>
    <button class="go" id="go" title="前往">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    <button class="tb-btn" id="pick" title="元素选取（点击网页元素并评论）">
      <svg viewBox="0 0 24 24"><path d="M12.586 12.586 19 19"/><path d="M3.688 3.037a.497.497 0 0 0-.651.651l6.5 15.999a.501.501 0 0 0 .947-.062l1.569-6.083a2 2 0 0 1 1.448-1.479l6.124-1.579a.5.5 0 0 0 .063-.947z"/></svg>
    </button>
    <button class="tb-btn" id="ext" title="在外部浏览器打开">
      <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    </button>
  </div>
  <div class="view-wrap" id="wrap">
    <div class="stage" id="stage">
      <div class="logical" id="logical">
        <img class="shot" id="shot" alt="" />
        <div class="hit" id="hit"></div>
        <div class="rect hover" id="hoverRect"></div>
        <div class="rect sel" id="selRect"></div>
        <div class="cbox" id="cbox">
          <div class="t">元素评论</div>
          <textarea id="cmt" placeholder="描述你希望 Agent 对这个元素做什么…"></textarea>
          <div class="row">
            <button id="cmtCancel">取消</button>
            <button id="cmtSend" class="primary">发送给 Agent</button>
          </div>
        </div>
      </div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast"></div>
  </div>

<script>
(function () {
  'use strict';
  var DEFAULT_HOME = 'https://www.bing.com';
  var HOME = DEFAULT_HOME;

  var wrap = document.getElementById('wrap');
  var stage = document.getElementById('stage');
  var logical = document.getElementById('logical');
  var shot = document.getElementById('shot');
  var hit = document.getElementById('hit');
  var hoverRectEl = document.getElementById('hoverRect');
  var selRectEl = document.getElementById('selRect');
  var cbox = document.getElementById('cbox');
  var cmt = document.getElementById('cmt');
  var hint = document.getElementById('hint');
  var toastEl = document.getElementById('toast');
  var urlInput = document.getElementById('url');
  var backBtn = document.getElementById('back');
  var fwdBtn = document.getElementById('fwd');
  var pickBtn = document.getElementById('pick');
  var tabList = document.getElementById('tabList');

  // ---- 与宿主通信：插件 iframe 拿不到 window.purrcat（preload 只在主 frame 生效），
  //      所有 Electron 原生浏览器能力统一经宿主 callAction 总线转发 ----
  var seq = 0;
  function callAction(actionId, payload) {
    return new Promise(function (resolve, reject) {
      var id = ++seq;
      function onMsg(e) {
        var m = e.data;
        if (m && m.type === 'callActionResult' && m.id === id) {
          window.removeEventListener('message', onMsg);
          if (m.ok) resolve(m.data); else reject(new Error(m.error || '调用失败'));
        }
      }
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type: 'callAction', id: id, actionId: actionId, payload: payload || {} }, '*');
    });
  }
  function silent(actionId, payload) { return callAction(actionId, payload).catch(function () {}); }

  // ---- 多标签页状态 ----
  // tabs: [{ id, url, title }]，id 即主进程 WebContentsView 的 tabId；activeId 为主进程当前显示的标签。
  // 与原（完整模式）React UI 的标签模型保持一致：前端持有列表并负责同步 bounds/切换/关闭。
  var tabs = [];
  var activeId = null;
  var starting = false;         // 建 Tab 期间的重入守卫：宿主下发配置与网页链接请求可能同时到达
  var pendingUrl = null;        // 待打开地址：Tab 尚未就绪时先记下，建好 Tab 后直接落在该地址
  var mode = 'browse';          // browse=浏览（原生视图可见） / pick=元素选取（原生视图移出屏幕 + 截图标注）
  var covered = false;          // 宿主出现设置中心/模态弹窗/下拉菜单：原生视图必须让位
  var curUrl = '';
  var started = false;
  var vp = { w: 0, h: 0 };      // pick 模式逻辑视口（= 进入选取时的原生视图 CSS 视口）
  var scale = 1;
  var pickedEl = null;
  var selRectData = null;
  var hoverAt = 0;
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.style.display = 'none'; }, 2600);
  }
  function showHint(text) { hint.textContent = text; hint.style.display = 'flex'; }
  function hideHint() { hint.style.display = 'none'; }

  function findTab(id) {
    for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === id) return tabs[i]; }
    return null;
  }

  // ---- 标签栏渲染 ----
  function renderTabs() {
    tabList.innerHTML = '';
    tabs.forEach(function (t) {
      var el = document.createElement('div');
      el.className = 'tab' + (t.id === activeId ? ' active' : '');
      var title = document.createElement('span');
      title.className = 'tab-title';
      title.textContent = t.title || t.url || '新标签页';
      title.title = t.url || '';
      el.appendChild(title);
      var x = document.createElement('button');
      x.className = 'tab-close';
      x.title = '关闭标签页';
      x.innerHTML = '<svg viewBox="0 0 12 12"><path d="M2 2 10 10"/><path d="M10 2 2 10"/></svg>';
      x.addEventListener('click', function (ev) { ev.stopPropagation(); closeTab(t.id); });
      el.appendChild(x);
      el.addEventListener('click', function () { switchTab(t.id); });
      tabList.appendChild(el);
    });
  }
  // 激活态相关 UI（地址栏 / 前进后退可用态 / 标签栏）同步
  function syncActiveUi() {
    var t = findTab(activeId);
    curUrl = t ? (t.url || '') : '';
    urlInput.value = curUrl;
    backBtn.disabled = false;
    fwdBtn.disabled = false;
    renderTabs();
  }
  function addTab(id, url) {
    tabs.push({ id: id, url: url || '', title: '' });
    activeId = id;
    hideHint();
    syncActiveUi();
    syncBounds(true);
    silent('browser.focus', {});
  }

  // ---- 原生视图 bounds 同步（插件 iframe 局部坐标，宿主负责加上 iframe 偏移）----
  var lastHidden = null;
  function ensureHidden() {
    if (lastHidden === true) return;
    lastHidden = true;
    silent('browser.hide');
  }
  // pick 模式绝不插手动原生视图：pick-start 已按原尺寸把它移到屏外，此时若再 hide
  // 会把视图压成 1×1 → Chromium 重新布局 → 截图与 DOM 错位，元素拾取会偏。
  // 汇报不做 debounce：改宽度时 ResizeObserver 逐帧触发，尾部 debounce 会被每一帧重置，
  // 直到停止缩放才落地 → 原生视图（真实网页画面）整个缩放期间停在旧尺寸、溢出容器。
  // 逐帧直发才能与容器同帧跟随；重复上报（RO 与 window.resize 同时触发）由主进程按值去重。
  function syncBounds() {
    if (mode === 'pick') return;
    if (covered || !activeId) { ensureHidden(); return; }
    var r = wrap.getBoundingClientRect();
    if (!r || r.width < 40 || r.height < 40) { ensureHidden(); return; }
    lastHidden = false;
    silent('browser.bounds', { x: r.left, y: r.top, w: r.width, h: r.height });
  }

  // ---- pick 模式布局：把截图按逻辑视口等比缩放居中 ----
  function layoutStage() {
    if (mode !== 'pick' || !vp.w || !vp.h) { stage.classList.remove('on'); return; }
    var r = wrap.getBoundingClientRect();
    var s = Math.min(r.width / vp.w, r.height / vp.h);
    if (!(s > 0)) s = 1;
    scale = Math.min(Math.max(s, 0.1), 2);
    var sw = vp.w * scale, sh = vp.h * scale;
    stage.classList.add('on');
    stage.style.left = Math.max(0, (r.width - sw) / 2) + 'px';
    stage.style.top = Math.max(0, (r.height - sh) / 2) + 'px';
    stage.style.width = sw + 'px';
    stage.style.height = sh + 'px';
    logical.style.width = vp.w + 'px';
    logical.style.height = vp.h + 'px';
    logical.style.transform = 'scale(' + scale + ')';
  }
  // 屏幕坐标 → 逻辑视口坐标（CDP getNodeForLocation / getBoundingClientRect 用的正是这一坐标系）
  function toLogical(clientX, clientY) {
    var r = logical.getBoundingClientRect();
    return { x: (clientX - r.left) / scale, y: (clientY - r.top) / scale };
  }

  function setMode(m) {
    if (m === mode) return;
    if (m === 'pick') {
      if (!activeId) { toast('内置浏览器尚未就绪'); return; }
      mode = 'pick';
      pickBtn.classList.add('on');
      enterPick();
    } else {
      mode = 'browse';
      pickBtn.classList.remove('on');
      exitPick();
    }
  }
  function enterPick() {
    callAction('browser.pickStart', { tabId: activeId }).then(function (res) {
      if (mode !== 'pick') { silent('browser.pickEnd', { tabId: activeId }); return; }
      if (!res || !res.imageDataUrl) { toast('无法截取网页画面'); setMode('browse'); return; }
      shot.src = res.imageDataUrl;
      vp = {
        w: res.viewportCssWidth || res.width || 1280,
        h: res.viewportCssHeight || res.height || 800
      };
      layoutStage();
    }).catch(function (e) { toast('进入选取模式失败：' + (e && e.message || '')); setMode('browse'); });
  }
  function exitPick() {
    stage.classList.remove('on');
    shot.removeAttribute('src');
    hoverRectEl.style.display = 'none';
    selRectEl.style.display = 'none';
    cbox.style.display = 'none';
    pickedEl = null;
    selRectData = null;
    silent('browser.pickEnd', { tabId: activeId }).then(function () { syncBounds(true); });
  }

  // ---- 标签页操作（切换 / 关闭 / 新建）----
  function switchTab(id) {
    if (!id) return;
    if (id === activeId) { syncActiveUi(); return; }
    setMode('browse');   // 选取模式绑定单个标签的截图，切换标签先退出
    activeId = id;
    syncActiveUi();
    silent('browser.switchTab', { tabId: id }).then(function () { syncBounds(true); });
  }
  function closeTab(id) {
    var idx = -1;
    for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === id) { idx = i; break; } }
    if (idx < 0) return;
    setMode('browse');
    var isActive = (id === activeId);
    tabs.splice(idx, 1);
    var next = null;
    if (isActive) {
      // 与原 UI 一致：关闭当前标签后激活剩余列表的最后一个；无剩余则清空
      next = tabs.length ? tabs[tabs.length - 1].id : null;
      activeId = next;
    }
    silent('browser.closeTab', { tabId: id, nextTabId: next || undefined });
    if (activeId) {
      syncActiveUi();
      syncBounds(true);
    } else {
      curUrl = '';
      urlInput.value = '';
      renderTabs();
      ensureHidden();
      showHint('没有打开的标签页。输入网址或点击右上角 + 新建标签页。');
    }
  }
  function newTab(u) {
    var url = u || HOME;
    return callAction('browser.newTab', { url: url }).then(function (res) {
      if (res && res.tabId) {
        addTab(res.tabId, url);
      } else {
        toast('无法打开该地址（可能被应用自身地址拦截）');
      }
    }).catch(function (e) { toast('新建标签页失败：' + (e && e.message || '')); });
  }

  // ---- 导航 ----
  function normalizeUrl(raw) {
    if (/^(https?:|mailto:|file:)/i.test(raw)) return raw;
    if (/^[^ ]+\.[^ ]{2,}$/.test(raw)) return 'https://' + raw;
    return 'https://www.bing.com/search?q=' + encodeURIComponent(raw);
  }
  function navigate(u) {
    if (!u) return;
    // 无标签页：直接新建一个标签落在该地址
    if (!activeId) { newTab(u); return; }
    var t = findTab(activeId);
    if (t) t.url = u;
    curUrl = u;
    urlInput.value = u;
    hideHint();
    renderTabs();
    silent('browser.navigate', { tabId: activeId, url: u }).then(function () { syncBounds(true); });
  }
  // 打开指定网页：宿主网页链接路由（browser.openUrl）与地址栏共用
  // 与原 UI 一致：已存在同地址标签则切换过去，否则新开标签
  function openUrl(u) {
    if (!u) return;
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].url === u) { switchTab(tabs[i].id); return; }
    }
    if (!tabs.length) {
      // 面板刚挂载、首个标签仍在创建中：把地址挂起，交由 ensureTab 直接开在它上面，避免先开后跳的闪烁
      pendingUrl = u;
      ensureTab();
      return;
    }
    newTab(u);
  }
  function go() {
    var raw = urlInput.value.trim();
    if (!raw) return;
    navigate(normalizeUrl(raw));
  }

  // ---- 建立首个原生浏览器标签 ----
  function ensureTab() {
    if (tabs.length || starting) return;
    starting = true;
    callAction('browser.available').then(function (r) {
      if (!r || !r.available) { showHint('内置浏览器仅在桌面客户端（Electron）中可用。'); return; }
      // 关键：待打开地址在「等待 available」期间才可能就绪，故此处才定型首个标签的地址，
      // 避免宿主下发配置与网页链接路由并发时误开主页（旧实现的 bug）。
      var first = pendingUrl || HOME;
      pendingUrl = null;
      return callAction('browser.newTab', { url: first }).then(function (res) {
        if (res && res.tabId) {
          addTab(res.tabId, first);
        } else {
          showHint('无法打开内置浏览器：目标地址被应用自身地址拦截（不能在内置浏览器中打开 PurrCat 自己的页面）。');
        }
        // 竞态兜底：newTab 往返期间又来了 openUrl → 现在补开一个标签
        if (pendingUrl) { var pu = pendingUrl; pendingUrl = null; newTab(pu); }
      });
    }).catch(function (e) { showHint('打开内置浏览器失败：' + (e && e.message || '')); })
      .then(function () { starting = false; });
  }

  // ---- 元素评论：提交给 Agent（与完整模式同一条链路，交给宿主 chat.sendBatch 入会话）----
  function submitComment() {
    var text = cmt.value.trim();
    if (!text || !selRectData) return;
    var ctx;
    if (pickedEl && pickedEl.outerHTML) {
      var parts = [];
      parts.push('Element: <' + pickedEl.tagName + '>');
      if (pickedEl.innerText) parts.push('Text: "' + String(pickedEl.innerText).trim().slice(0, 200) + '"');
      if (pickedEl.cssSelector) parts.push('CSS Selector: ' + pickedEl.cssSelector);
      parts.push('HTML: ' + String(pickedEl.outerHTML).slice(0, 500));
      ctx = parts.join('\n');
    } else if (pickedEl) {
      ctx = 'DOM Tag: <' + (pickedEl.tag || pickedEl.tagName) + '>';
    } else {
      ctx = 'User clicked specific coordinate';
    }
    var pixelData = { mode: 'pick', rect: selRectData, domContext: ctx, viewport: { width: vp.w, height: vp.h } };
    var events = [
      {
        type: 'browser-comment',
        content: 'User marked an area in browser.\nURL: ' + curUrl +
          '\nMode: ' + pixelData.mode +
          '\nElement/Pixels: ' + JSON.stringify(pixelData.rect) +
          '\nContext: ' + pixelData.domContext +
          '\nViewport: ' + JSON.stringify(pixelData.viewport) +
          '\nComment: ' + text
      },
      { type: 'user', content: text }
    ];
    callAction('chat.sendBatch', { events: events })
      .then(function () { toast('已发送给 Agent'); })
      .catch(function (e) { toast('发送失败：' + (e && e.message || '')); });
    cmt.value = '';
    setMode('browse');
  }

  // ---- 标注层交互 ----
  hit.addEventListener('mousemove', function (e) {
    var now = Date.now();
    if (now - hoverAt < 120) return;
    hoverAt = now;
    var p = toLogical(e.clientX, e.clientY);
    callAction('browser.locate', { tabId: activeId, x: p.x, y: p.y }).then(function (el) {
      if (mode !== 'pick' || cbox.style.display === 'block') return;
      if (el && el.rect) {
        hoverRectEl.style.display = 'block';
        hoverRectEl.style.left = el.rect.x + 'px';
        hoverRectEl.style.top = el.rect.y + 'px';
        hoverRectEl.style.width = Math.max(el.rect.w, 4) + 'px';
        hoverRectEl.style.height = Math.max(el.rect.h, 4) + 'px';
      } else {
        hoverRectEl.style.display = 'none';
      }
    }).catch(function () {});
  });
  hit.addEventListener('mouseleave', function () { hoverRectEl.style.display = 'none'; });
  hit.addEventListener('mousedown', function (e) {
    if (cbox.style.display === 'block') {
      // 已展开评论框：点别处先收起，避免误拾取
      cbox.style.display = 'none';
      selRectEl.style.display = 'none';
      return;
    }
    var clickX = e.clientX, clickY = e.clientY;
    var p = toLogical(clickX, clickY);
    callAction('browser.pickElement', { tabId: activeId, x: p.x, y: p.y }).then(function (el) {
      if (mode !== 'pick') return;
      pickedEl = el || null;
      selRectData = (el && el.rect) ? el.rect : { x: p.x - 5, y: p.y - 5, w: 10, h: 10 };
      selRectEl.style.display = 'block';
      selRectEl.style.left = selRectData.x + 'px';
      selRectEl.style.top = selRectData.y + 'px';
      selRectEl.style.width = Math.max(selRectData.w, 8) + 'px';
      selRectEl.style.height = Math.max(selRectData.h, 8) + 'px';
      hoverRectEl.style.display = 'none';
      cbox.style.display = 'block';
      cbox.style.left = Math.min(selRectData.x + selRectData.w + 10, vp.w - 300) + 'px';
      cbox.style.top = Math.max(10, selRectData.y - 20) + 'px';
      cmt.value = '';
      cmt.focus();
    }).catch(function () { toast('元素拾取失败'); });
  });
  document.getElementById('cmtSend').addEventListener('click', submitComment);
  document.getElementById('cmtCancel').addEventListener('click', function () { setMode('browse'); });
  cmt.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitComment(); }
  });

  // ---- 工具栏 ----
  backBtn.addEventListener('click', function () { if (activeId) silent('browser.goBack', { tabId: activeId }); });
  fwdBtn.addEventListener('click', function () { if (activeId) silent('browser.goForward', { tabId: activeId }); });
  document.getElementById('reload').addEventListener('click', function () { if (activeId) silent('browser.reload', { tabId: activeId }); });
  document.getElementById('home').addEventListener('click', function () { navigate(HOME); });
  document.getElementById('go').addEventListener('click', go);
  pickBtn.addEventListener('click', function () { setMode(mode === 'pick' ? 'browse' : 'pick'); });
  document.getElementById('ext').addEventListener('click', function () {
    silent('browser.openExternal', { url: curUrl || urlInput.value || HOME });
  });
  urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  document.getElementById('tabAdd').addEventListener('click', function () { newTab(HOME); });

  // ---- 尺寸变化：浏览时同步原生视图 bounds；选取时重排截图 ----
  function onResize() {
    if (mode === 'pick') layoutStage(); else syncBounds();
  }
  try { new ResizeObserver(onResize).observe(wrap); } catch (_) { /* noop */ }
  window.addEventListener('resize', onResize);

  // ---- 宿主事件 ----
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'configApply') { applyConfig(m.config); return; }
    if (m.type !== 'event') return;
    if (m.event === 'browser.tabEvent') { onTabEvent(m.data || {}); return; }
    // 网页链接路由：聊天历史里的网页链接被宿主统一转到这里打开
    if (m.event === 'browser.openUrl') { openUrl((m.data || {}).url); return; }
    if (m.event === 'host.nativeCover') {
      covered = !!(m.data && m.data.covered);
      syncBounds();
      return;
    }
    // 布局切换/平铺窗口滚动、改宽、重排后同步原生视图位置
    if (m.event === 'host.layoutChanged') { syncBounds(); return; }
    if (m.event === 'host.unmount') { cleanup(); return; }
  });
  function onTabEvent(data) {
    if (!data) return;
    var t = findTab(data.tabId);
    if (data.type === 'navigate') {
      if (t) t.url = data.url || t.url;
      if (data.tabId === activeId) { curUrl = data.url || curUrl; urlInput.value = curUrl; }
      renderTabs();
    } else if (data.type === 'title') {
      if (t) t.title = data.title || t.title;
      renderTabs();
    } else if (data.type === 'blocked') {
      toast(data.reason || '该地址已被拦截');
    }
  }

  // 插件被卸载（抽屉切换 / 面板重建 / 关闭面板）：隐藏原生视图并关掉自己的全部标签
  function cleanup() {
    if (cleanup.done) return;
    cleanup.done = true;
    pendingUrl = null;
    ensureHidden();
    tabs.slice().forEach(function (t) { silent('browser.closeTab', { tabId: t.id }); });
    tabs = [];
    activeId = null;
  }
  window.addEventListener('pagehide', cleanup);

  // 首页地址来自插件配置（宿主在 iframe load 时下发 configApply），默认必应
  function applyConfig(cfg) {
    var h = cfg && typeof cfg.homepage === 'string' ? cfg.homepage.trim() : '';
    HOME = h || DEFAULT_HOME;
    if (!started) { started = true; ensureTab(); }
  }
  // 兜底：宿主未下发配置（独立打开等）时仍按默认主页建立 Tab
  setTimeout(function () { if (!started) { started = true; ensureTab(); } }, 300);
})();
</script>
</body>
</html>
