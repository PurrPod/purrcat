<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--wm-font, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    background: transparent;
    color: var(--wm-label, #16191d);
    display: flex;
  }
  .center {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 12px 20px 16px;
    background: transparent;
  }
  /* 空态：居中欢迎 + 大输入 */
  .welcome { display: none; margin-bottom: 16px; text-align: center; }
  body.centered { background: transparent; }
  body.centered .center { justify-content: center; align-items: center; max-width: 760px; margin: 0 auto; }
  body.centered .welcome { display: block; }
  body.centered .welcome .wt { font-size: 18px; font-weight: 600; }
  body.centered .bar, body.centered .refPanel { width: 100%; }
  /* 引用菜单展开时贴底排列，避免居中布局把输入框/引用挤出窗口 */
  .center:has(.refPanel.open) { justify-content: flex-end; }

  /* 引用面板（＋ 展开）：左竖分类 + 右侧条目，鼠标悬浮分类即出列表 */
  .refPanel {
    display: none;
    margin-bottom: 8px;
    background: var(--wm-bl-0, #ffffff);
    border-radius: 12px;
    box-shadow: var(--wm-shadow, 0 4px 16px rgba(15,17,21,.08));
    padding: 10px;
    overflow: hidden;
  }
  .refPanel.open { display: block; }
  .ref-pick { display: flex; gap: 8px; height: min(46vh, 380px); }
  .cats {
    flex: none; width: 128px;
    display: flex; flex-direction: column; gap: 2px;
    border-right: 1px solid var(--wm-border-soft, rgba(15,17,21,.05));
    padding-right: 6px;
    overflow: hidden;
  }
  .cat {
    display: block; width: 100%; text-align: left;
    font-family: inherit; font-size: 13px; color: var(--wm-label, #16191d);
    background: transparent; border: none; border-radius: 8px; padding: 8px 10px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cat:hover { background: var(--wm-bg-hover, #e9edf1); }
  .cat.active { background: var(--wm-bg-hover, #e9edf1); color: var(--wm-accent, #16191d); font-weight: 600; }
  .right {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .right-head { flex: none; padding: 4px 6px 6px; font-size: 12px; color: var(--wm-label-2nd, #4c5560); font-weight: 600; }
  .items { flex: 1; min-height: 0; overflow-y: auto; }
  .item {
    display: block; width: 100%; text-align: left; font-size: 12.5px; color: var(--wm-label, #16191d);
    background: transparent; border: none; padding: 7px 8px; border-radius: 8px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item:hover { background: var(--wm-bg-hover, #e9edf1); }
  .item.sel { color: var(--wm-accent, #16191d); font-weight: 600; }
  .lb-empty { font-size: 12px; color: var(--wm-label-dim, #8b96a3); padding: 8px; }

  /* 已选引用 */
  .quotes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; max-height: 56px; overflow-y: auto; }
  .quote {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--wm-label, #16191d);
    background: var(--wm-bg-input, #f2f4f7); border-radius: 999px; padding: 5px 10px; max-width: 260px;
  }
  .quote span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quote .x { border: none; background: transparent; color: var(--wm-label-dim, #8b96a3); cursor: pointer; font-size: 12px; line-height: 1; }

  /* 输入条：上下两半——上半写字，下半放＋与纸飞机。白底、无边框、仅轻阴影 */
  .bar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--wm-bl-0, #ffffff);
    border: none;
    border-radius: 16px;
    box-shadow: var(--wm-shadow, 0 4px 16px rgba(15,17,21,.08));
    padding: 10px 10px 8px;
    min-height: 104px;
  }
  .bar textarea {
    flex: 1;
    min-height: 0;
    resize: none;
    font-family: inherit; font-size: 14px; line-height: 1.5;
    color: var(--wm-label, #16191d);
    background: transparent;
    border: none; padding: 2px 4px; outline: none;
    overflow-y: auto;
    text-align: left;
  }
  textarea::placeholder { color: var(--wm-label-dim, #8b96a3); }
  .bar-foot {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .foot-left { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .plusBtn {
    flex: none; width: 36px; height: 36px;
    font-size: 19px; line-height: 1; color: var(--wm-label-2nd, #4c5560);
    background: transparent; border: none; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .plusBtn:hover { background: var(--wm-bg-hover, #e9edf1); }
  .plusBtn.active { color: var(--wm-accent, #16191d); }
  /* Mode（Agent Loop）选择：贴＋右侧的小按钮，展开为向上弹出的列表 */
  .modeWrap { position: relative; min-width: 0; }
  .modeBtn {
    display: flex; align-items: center; gap: 3px;
    height: 30px; max-width: 200px; padding: 0 8px;
    font: inherit; font-size: 12px; color: var(--wm-label-2nd, #4c5560);
    background: transparent; border: none; border-radius: 8px; cursor: pointer;
  }
  .modeBtn:hover { background: var(--wm-bg-hover, #e9edf1); }
  .modeBtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modeBtn svg { flex: none; width: 12px; height: 12px; }
  .modeMenu {
    display: none; position: absolute; left: 0; bottom: calc(100% + 6px);
    min-width: 176px; max-height: 240px; overflow-y: auto;
    background: var(--wm-bl-0, #fff); border-radius: 10px;
    box-shadow: var(--wm-shadow, 0 8px 28px rgba(15,17,21,.18)); padding: 6px; z-index: 12;
  }
  .modeMenu.open { display: block; }
  .modeMenu button {
    display: block; width: 100%; text-align: left;
    font: inherit; font-size: 12.5px; color: var(--wm-label, #16191d);
    background: transparent; border: none; border-radius: 8px; padding: 7px 9px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .modeMenu button:hover { background: var(--wm-bg-hover, #e9edf1); }
  .modeMenu button.sel { font-weight: 600; color: var(--wm-accent, #16191d); }
  .foot-right { display: flex; align-items: center; gap: 6px; }
  /* 上下文占用圆环：黑色=已占用，浅色=未占用；hover 弹出数据气泡（对齐完整模式 /api/agent/token） */
  .ctx-wrap { position: relative; display: flex; align-items: center; }
  .ctx-btn { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; color: var(--wm-label, #16191d); }
  .ctx-btn svg { width: 20px; height: 20px; }
  .ctx-btn .track { stroke: rgba(15,17,21,.18); }
  .ctx-btn .arc { stroke: var(--wm-accent, #16191d); transition: stroke-dasharray .3s ease; }
  /* 气泡放在圆环左侧、与圆环同一行：输入槽 overflow:hidden 且高度仅容纳输入条，
     向上弹出会越出 iframe 被裁掉，向左展开则完全落在容器内，无需改动容器尺寸 */
  .ctx-tip {
    display: none; position: absolute; right: calc(100% + 10px); bottom: 0;
    padding: 5px 9px; border-radius: 8px;
    background: var(--wm-bl-0, #fff); box-shadow: var(--wm-shadow, 0 8px 28px rgba(15,17,21,.18));
    font-size: 12px; line-height: 1.4; color: var(--wm-label-2nd, #4c5560); white-space: nowrap; z-index: 12;
  }
  .ctx-tip b { color: var(--wm-label, #16191d); font-weight: 600; }
  .ctx-wrap:hover .ctx-tip { display: block; }
  .sendBtn {
    flex: none; width: 36px; height: 36px; border: none; border-radius: 12px; cursor: pointer;
    background: var(--wm-accent, #16191d); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .sendBtn:hover { background: var(--wm-accent-hi, #679efe); }
  .sendBtn:disabled { background: var(--wm-bl-200, #dfe4ea); color: #fff; cursor: default; }
  .sendBtn svg { width: 17px; height: 17px; }
</style>
</head>
<body>
  <div class="center">
    <div class="welcome">
      <div class="wt">有什么可以帮你的？</div>
    </div>
    <div class="refPanel" id="refPanel">
      <div class="ref-pick">
        <div class="cats" id="cats"></div>
        <div class="right">
          <div class="right-head" id="rName"></div>
          <div class="items" id="rItems"></div>
        </div>
      </div>
    </div>
    <div class="quotes" id="quotes"></div>
    <div class="bar">
      <textarea id="input" rows="1" placeholder="输入消息，Shift+Enter 换行"></textarea>
      <div class="bar-foot">
        <div class="foot-left">
          <button class="plusBtn" id="plus" title="添加引用">＋</button>
          <span class="modeWrap" id="modeWrap">
            <button class="modeBtn" id="mode" title="切换 Agent Loop">
              <span id="modeLabel">默认</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="modeMenu" id="modeMenu"></div>
          </span>
        </div>
        <div class="foot-right">
          <span class="ctx-wrap" id="ctxWrap">
            <span class="ctx-btn" aria-label="上下文占用">
              <svg viewBox="0 0 24 24">
                <circle class="track" cx="12" cy="12" r="9" fill="none" stroke-width="3"></circle>
                <circle class="arc" id="ctxArc" cx="12" cy="12" r="9" fill="none" stroke-width="3" transform="rotate(-90 12 12)" stroke-dasharray="0 56.55"></circle>
              </svg>
            </span>
            <div class="ctx-tip" id="ctxTip"></div>
          </span>
          <button class="sendBtn" id="send" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  var seq = 0;
  function callAction(actionId, payload) {
    return new Promise(function (resolve, reject) {
      var id = ++seq;
      function onMsg(e) {
        var m = e.data;
        if (m && m.type === 'callActionResult' && m.id === id) {
          window.removeEventListener('message', onMsg);
          if (m.ok) resolve(m.data); else reject(new Error(m.error));
        }
      }
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type: 'callAction', id: id, actionId: actionId, payload: payload || {} }, '*');
    });
  }
  function pickPath(r) {
    if (!r) return null;
    if (Array.isArray(r)) return r[0];
    if (Array.isArray(r.filePaths)) return r.filePaths[0];
    if (Array.isArray(r.paths)) return r.paths[0];
    if (typeof r === 'string') return r;
    if (typeof r.path === 'string') return r.path;
    return null;
  }

  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var plusBtn = document.getElementById('plus');
  var refPanel = document.getElementById('refPanel');
  var catsEl = document.getElementById('cats');
  var rName = document.getElementById('rName');
  var rItems = document.getElementById('rItems');
  var quotesEl = document.getElementById('quotes');

  // 输入容器画与历史面板一致的白色：二者透明度一致时无缝衔接，无分界线（输入框 .bar 悬浮其上）
  var DEF_OP = 0.82;
  function applyPanel(cfg) {
    var o = cfg && typeof cfg.opacity === 'number' ? cfg.opacity : DEF_OP;
    o = Math.max(0, Math.min(1, o));
    document.body.style.backgroundColor = 'rgba(255,255,255,' + o.toFixed(2) + ')';
  }
  callAction('config.get', { plugin_id: 'builtin-input' }).then(applyPanel).catch(function () {});

  // ---------- 引用 ----------
  var quotes = [];
  function addQuote(type, content, label) {
    quotes.push({ type: type, content: content, label: label || content });
    renderQuotes(); markSel();
  }
  function hasQuote(label) {
    return quotes.some(function (q) { return q.label === label; });
  }
  function removeQuote(label) {
    quotes = quotes.filter(function (q) { return q.label !== label; });
    renderQuotes(); markSel();
  }
  function renderQuotes() {
    quotesEl.innerHTML = '';
    quotes.forEach(function (q) {
      var d = document.createElement('div');
      d.className = 'quote';
      var s = document.createElement('span');
      s.textContent = q.label;
      var x = document.createElement('button');
      x.className = 'x';
      x.textContent = '✕';
      x.title = '移除引用';
      x.addEventListener('click', function () { removeQuote(q.label); });
      d.appendChild(s); d.appendChild(x);
      quotesEl.appendChild(d);
    });
  }

  // ---------- 左分类 ----------
  var CATS = [
    { t: 'file', label: '＋ 文件', dialog: true },
    { t: 'folder', label: '＋ 文件夹', dialog: true },
    { t: 'skill', label: 'Skill' },
    { t: 'mcp', label: 'MCP' },
    { t: 'graph', label: 'Graph' }
  ];
  var activeCat = null;
  var cache = {};   // skill/mcp/graph 的 fetched items
  function setActive(t) {
    activeCat = t;
    catsEl.querySelectorAll('.cat').forEach(function (c) { c.classList.toggle('active', c.dataset.t === t); });
  }
  function buildCats() {
    catsEl.innerHTML = '';
    CATS.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'cat';
      b.dataset.t = c.t;
      b.textContent = c.label;
      b.addEventListener('mouseenter', function () {
        setActive(c.t);
        if (c.dialog) showRight(c.label, []);
        else openCat(c.t);
      });
      b.addEventListener('click', function () { handleCatClick(c); });
      catsEl.appendChild(b);
    });
  }

  // 右侧提示/条目
  function showRight(title, items) {
    rName.textContent = title;
    rItems.innerHTML = '';
    if (!items || !items.length) {
      var e = document.createElement('div');
      e.className = 'lb-empty';
      e.textContent = '暂无可用项';
      rItems.appendChild(e);
      return;
    }
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.className = 'item' + (hasQuote(it.label) ? ' sel' : '');
      b.textContent = it.text;
      b.title = it.hint || it.label;
      b.addEventListener('click', function () {
        if (hasQuote(it.label)) removeQuote(it.label);
        else addQuote(it.type, it.content, it.label);
      });
      rItems.appendChild(b);
    });
  }
  // 已选状态回显
  function markSel() {
    var bs = rItems.querySelectorAll('.item');
    bs.forEach(function (b) { b.classList.toggle('sel', hasQuote(b.textContent)); });
  }

  function fetchList(t) {
    if (cache[t]) return Promise.resolve(cache[t]);
    var p;
    if (t === 'skill') p = fetch('/api/tools/skills').then(function (r) { return r.json(); }).then(function (s) {
      return (s || []).map(function (x) {
        var n = x.name || x.dir_name || 'unknown';
        return { label: n, text: n, hint: x.description || '', type: 'skill-quote', content: 'user want you fetch skill：' + n };
      });
    });
    else if (t === 'mcp') p = fetch('/api/tools/mcp').then(function (r) { return r.json(); }).then(function (servers) {
      var names = (servers && typeof servers === 'object') ? Object.keys(servers) : [];
      return names.map(function (n) {
        return { label: n, text: n, type: 'mcp-quote', content: 'user want you fetch mcp：' + n };
      });
    });
    else p = fetch('/api/webmin/ref/graphs').then(function (r) { return r.json(); }).then(function (names) {
      return (names || []).map(function (g) {
        return { label: g, text: g, type: 'graph-quote', content: 'user quote the graph：' + g };
      });
    });
    return p.catch(function () { return []; }).then(function (items) { cache[t] = items; return items; });
  }

  function openCat(t) {
    setActive(t);
    fetchList(t).then(function (items) {
      if (activeCat !== t) return;
      var names = { skill: '选择 Skill', mcp: '选择 MCP', graph: '选择 Graph' };
      showRight(names[t] || t, items);
      markSel();
    });
  }

  function handleCatClick(c) {
    if (c.t === 'file') {
      callAction('dialog.files').then(function (r) {
        var p = pickPath(r);
        if (p) addQuote('file-quote', 'user quote the file：' + p, p.split(/[\\/]/).pop());
      }).catch(function (e) { alert(String(e.message || e)); });
    } else if (c.t === 'folder') {
      callAction('dialog.folder').then(function (r) {
        var p = pickPath(r);
        if (p) addQuote('file-quote', 'user quote the file：' + p, p);
      }).catch(function (e) { alert(String(e.message || e)); });
    } else {
      openCat(c.t);
    }
  }

  // ---------- 面板开合 ----------
  function setMenuOpenT(open) {
    callAction('input.dropdown', { open: open }).catch(function () {});
  }
  function toggleRef(show) {
    var open = show !== undefined ? !!show : !refPanel.classList.contains('open');
    refPanel.classList.toggle('open', open);
    plusBtn.classList.toggle('active', open);
    setMenuOpenT(open);
    if (open) {
      // 默认悬浮在第一个分类上（文件）
      var first = catsEl.querySelector('.cat');
      if (first) first.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true }));
    }
  }
  plusBtn.addEventListener('click', function () { toggleRef(); });

  // ---------- Mode（切换 Agent Loop / paradigm，对齐原 UI 的热切换）----------
  var modeWrap = document.getElementById('modeWrap');
  var modeBtn = document.getElementById('mode');
  var modeMenu = document.getElementById('modeMenu');
  var modeLabel = document.getElementById('modeLabel');
  var modes = [{ name: '', label: '默认' }];
  var currentMode = '';
  var curSessionId = '';

  function modeLabelOf(name) { return name || '默认'; }
  function setModeLabel() {
    modeLabel.textContent = modeLabelOf(currentMode);
    modeBtn.title = '切换 Agent Loop，当前：' + modeLabelOf(currentMode);
  }
  function loadModes() {
    return fetch('/api/paradigms').then(function (r) { return r.json(); }).then(function (d) {
      var files = (d && d.files) || [];
      modes = [{ name: '', label: '默认' }];
      files.forEach(function (f) {
        // PARADIGM 即默认文件，已由「默认」项代表，不重复列出
        if (f && f.name && f.name !== 'PARADIGM') modes.push({ name: f.name, label: f.name });
      });
    }).catch(function () {});
  }
  function renderModeMenu() {
    modeMenu.innerHTML = '';
    modes.forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = m.label;
      if (m.name === currentMode) b.className = 'sel';
      b.addEventListener('click', function () { setMode(m.name); });
      modeMenu.appendChild(b);
    });
  }
  // 当前 Mode 取自会话 meta.json（'' = 默认 PARADIGM）
  function loadMode() {
    curSessionId = '';
    currentMode = '';
    setModeLabel();
    callAction('state.get').then(function (s) {
      curSessionId = (s && s.activeSessionId) || '';
      if (!curSessionId) return;
      return fetch('/api/webmin/session-paradigm/' + encodeURIComponent(curSessionId))
        .then(function (r) { return r.json(); })
        .then(function (d) { currentMode = (d && d.paradigm) || ''; setModeLabel(); })
        .catch(function () {});
    }).catch(function () {});
  }
  function setMode(name) {
    closeModeMenu();
    if (!curSessionId) { alert('请先发送一条消息以创建会话'); return; }
    if (name === currentMode) return;
    fetch('/api/sessions/' + encodeURIComponent(curSessionId) + '/paradigm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paradigm: name })
    }).then(function (r) {
      if (!r.ok) throw new Error('切换失败');
      currentMode = name;
      setModeLabel();
    }).catch(function (e) { alert('Mode 切换失败: ' + String(e.message || e)); });
  }
  function closeModeMenu() { modeMenu.classList.remove('open'); }
  function openModeMenu() {
    loadModes().then(function () { renderModeMenu(); modeMenu.classList.add('open'); });
  }
  modeBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (modeMenu.classList.contains('open')) closeModeMenu();
    else openModeMenu();
  });
  document.addEventListener('click', function (e) {
    if (!modeWrap.contains(e.target)) closeModeMenu();
  });

  // ---------- 上下文占用圆环（对齐完整模式的 /api/agent/token 进度）----------
  // 黑色弧 = 已占用，浅色轨道 = 未占用；hover 显示已占用/剩余/最大窗口/百分比
  var ctxArc = document.getElementById('ctxArc');
  var ctxTip = document.getElementById('ctxTip');
  var CTX_C = 2 * Math.PI * 9;   // 圆环周长（r=9）

  function fmtNum(n) { return Number(n || 0).toLocaleString('en-US'); }
  function renderCtx(used, max) {
    used = Number(used) || 0;
    max = Number(max) || 0;
    var ratio = max > 0 ? Math.min(1, used / max) : 0;
    // 有占用时给一个最小可见弧长（否则占比很小时黑弧短到看不见）
    var arcLen = ratio > 0 ? Math.max(ratio * CTX_C, 2.4) : 0;
    ctxArc.setAttribute('stroke-dasharray', arcLen.toFixed(2) + ' ' + CTX_C.toFixed(2));
    var pct = max > 0 ? (used / max) * 100 : 0;
    // 精简单行，避免气泡过高（输入槽高度有限）
    ctxTip.innerHTML =
      '已占用 <b>' + fmtNum(used) + ' / ' + fmtNum(max) + '</b>' +
      '（<b>' + pct.toFixed(1) + '%</b>）';
  }
  function refreshCtx() {
    // Token 用量是 Agent 的全局状态，不依赖当前会话，始终显示
    fetch('/api/agent/token')
      .then(function (r) { return r.json(); })
      .then(function (d) { renderCtx(d && d.window_token, d && d.max_token); })
      .catch(function () {});
  }
  refreshCtx();
  setInterval(refreshCtx, 5000);   // 与完整模式一致：5s 刷新一次

  // ---------- 发送 ----------
  function send() {
    var text = input.value.trim();
    if (!text && !quotes.length) return;
    var events = [];
    quotes.forEach(function (q) { events.push({ type: q.type, content: q.content }); });
    if (text) events.push({ type: 'user', content: text });
    sendBtn.disabled = true;
    callAction('chat.sendBatch', { events: events })
      .then(function () { input.value = ''; quotes = []; renderQuotes(); toggleRef(false); })
      .catch(function (e) { alert('发送失败: ' + e.message); })
      .finally(function () { sendBtn.disabled = false; });
  }
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  function setCentered(empty) { document.body.classList.toggle('centered', !!empty); }
  function resyncEmpty() {
    callAction('state.get').then(function (s) { setCentered(s && s.empty); }).catch(function () {});
  }
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'configApply') { applyPanel(m.config); return; }
    if (m.type === 'event' && m.event === 'layout.empty') { setCentered(m.data && m.data.empty); return; }
    if (m.type === 'layout.empty') setCentered(m.empty);
    if (m.type === 'event' && m.event === 'session.switched') { resyncEmpty(); loadMode(); return; }
    if (m.type === 'event' && m.event === 'conversation.updated') resyncEmpty();
  });

  buildCats();
  markSel();
  resyncEmpty();
  loadMode();
})();
</script>
</body>
</html>
