<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: transparent; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: #26303b; font-size: 13px; overflow: hidden; }
  .wrap { padding: 18px 20px 20px; height: 100%; overflow: auto; }
  .wrap::-webkit-scrollbar { width: 8px; }
  .wrap::-webkit-scrollbar-thumb { background: #d3d9e0; border-radius: 4px; }
  .title { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  .plugin { border: 1px solid #e3e7ec; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; background: #fbfcfd; }
  .p-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .p-name { font-weight: 600; }
  .p-tag { font-size: 11px; color: #7a8794; }
  .p-sep { height: 1px; background: #eef1f4; margin: 10px 0; }
  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; color: #5c6773; margin-bottom: 5px; }
  .field input[type=text],
  .field input[type=number],
  .field select {
    width: 100%; padding: 6px 8px; border: 1px solid #d6dbe1; border-radius: 7px;
    font-size: 13px; background: #fff; color: #26303b; outline: none;
  }
  .field input:focus, .field select:focus { border-color: #4c7bff; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; }
  .switch { position: relative; width: 38px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #d3d9e0; border-radius: 22px; transition: .2s; cursor: pointer; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #4c7bff; }
  .switch input:checked + .slider:before { transform: translateX(16px); }
  .walls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .wall-thumb { position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 1px solid #dfe4e9; background: #f2f4f7; }
  .wall-thumb img, .wall-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wall-del { position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; line-height: 15px; text-align: center; background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 50%; font-size: 11px; cursor: pointer; }
  .btn { padding: 5px 10px; border-radius: 7px; border: 1px solid #d6dbe1; background: #fff; color: #26303b; cursor: pointer; font-size: 12px; }
  .btn:hover { border-color: #4c7bff; color: #4c7bff; }
  .btn.primary { background: #4c7bff; color: #fff; border-color: #4c7bff; }
  .btn.danger { color: #d0453b; border-color: #f0c9c6; }
  .btn.sm { padding: 3px 8px; }
  .row-actions { display: flex; gap: 8px; }
  .empty { color: #8b96a3; text-align: center; padding: 40px 0; }
  .mode-row { display: flex; gap: 8px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="list"></div>
  <div class="mode-row">
    <button class="btn" id="btnNormal">回到完整模式</button>
  </div>
</div>
<script>
(function () {
  var seq = 0;
  function callAction(actionId, payload) {
    return new Promise(function (resolve, reject) {
      var id = ++seq;
      function onMsg(e) {
        var m = e.data;
        if (m && m.type === 'callActionResult' && m.id === id) {
          window.removeEventListener('message', onMsg);
          if (m.ok) resolve(m.data); else reject(new Error(m.error));
        }
      }
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type: 'callAction', id: id, actionId: actionId, payload: payload || {} }, '*');
    });
  }

  var listEl = document.getElementById('list');

  function qs(parent, sel, value) { parent.querySelectorAll(sel).forEach(function (n) { n.value = value === undefined ? "" : value; }); }

  // 读取当前值（含默认值合并——后端已附 configSchema，宿主 config.get 返回有效配置）
  function fieldValue(cfg, key, type) {
    var v = cfg[key];
    if (v === undefined || v === null) {
      if (type === 'switch') return false;
      if (type === 'number') return 0;
      if (type === 'select') return '';
      return '';
    }
    return v;
  }

  function buildField(plugin, field, cfg, container) {
    var key = field.key, type = field.type || 'text';
    var row = document.createElement('div');
    row.className = 'field';
    var label = document.createElement('label');
    label.textContent = field.label || key;
    row.appendChild(label);
    if (type === 'switch') {
      row.classList.add('switch-row');
      row.innerHTML = '<div></div>';
      row.firstChild.appendChild(label);
      var sw = document.createElement('label'); sw.className = 'switch';
      sw.innerHTML = '<input type="checkbox"><span class="slider"></span>';
      sw.querySelector('input').checked = !!fieldValue(cfg, key, type);
      row.appendChild(sw);
    } else if (type === 'select') {
      var sel = document.createElement('select');
      (field.options || []).forEach(function (op) {
        var o = document.createElement('option'); o.value = op; o.textContent = op; sel.appendChild(o);
      });
      sel.value = fieldValue(cfg, key, type) || '';
      row.appendChild(sel);
    } else if (type === 'number') {
      var num = document.createElement('input');
      num.type = 'number'; num.step = 'any'; num.value = fieldValue(cfg, key, type);
      row.appendChild(num);
    } else if (type === 'wallpapers') {
      // 壁纸列表：缩略图 + 添加/移除
      var wallsWrap = document.createElement('div'); wallsWrap.className = 'walls';
      var list = Array.isArray(cfg[key]) ? cfg[key] : [];
      function redrawWalls() {
        wallsWrap.innerHTML = '';
        list.forEach(function (w, i) {
          var t = document.createElement('div'); t.className = 'wall-thumb';
          var isV = /\.(mp4|webm|mov)(\?|$)/i.test(w.src || '') || w.type === 'video';
          if (isV) { var v = document.createElement('video'); v.src = w.src; v.muted = true; v.loop = true; t.appendChild(v); }
          else { var im = document.createElement('img'); im.src = w.src; im.alt = ''; t.appendChild(im); }
          var del = document.createElement('button'); del.className = 'wall-del'; del.textContent = '×';
          del.addEventListener('click', function () { list.splice(i, 1); commit(); redrawWalls(); });
          t.appendChild(del); wallsWrap.appendChild(t);
        });
        var add = document.createElement('button'); add.className = 'btn sm'; add.textContent = '+ 添加';
        add.addEventListener('click', function () {
          callAction('dialog.pickWallpaper', {}).then(function (up) {
            if (!up || !up.url) return;
            list.push({ src: up.url, type: isV(up.url) ? 'video' : 'image', name: up.filename });
            commit(); redrawWalls();
          }).catch(function () {});
        });
        wallsWrap.appendChild(add);
      }
      function isV(url) { return /\.(mp4|webm|mov)(\?|$)/i.test(url); }
      function commit() { cfg[key] = list; save(); }
      redrawWalls();
      row.appendChild(wallsWrap);
    } else {
      var txt = document.createElement('input'); txt.type = 'text'; txt.value = fieldValue(cfg, key, type);
      row.appendChild(txt);
    }
    var root = row.querySelector('input,select');
    if (root && root.addEventListener && type !== 'wallpapers') {
      root.addEventListener('change', function () {
        var v = null;
        if (type === 'switch') v = root.checked;
        else if (type === 'number') v = root.value === '' ? null : Number(root.value);
        else v = root.value;
        cfg[key] = v; save();
      });
    }
    container.appendChild(row);
  }

  function save() {
    callAction('config.set', { plugin_id: currentPluginId, config: currentCfg }).catch(function () {});
  }
  var currentPluginId = null, currentCfg = null;

  function renderPlugin(p, cfg) {
    var box = document.createElement('div');
    box.className = 'plugin';
    var head = document.createElement('div'); head.className = 'p-head';
    var name = document.createElement('span'); name.className = 'p-name'; name.textContent = p.name || p.id;
    var right = document.createElement('span'); right.className = 'row-actions';
    var slug = document.createElement('span'); slug.className = 'p-tag'; slug.textContent = p.slot || '';
    right.appendChild(slug);
    if (!p.builtin) {
      var del = document.createElement('button'); del.className = 'btn sm danger'; del.textContent = '删除';
      del.addEventListener('click', function () {
        if (confirm('确定删除插件 “' + (p.name || p.id) + '” 吗？')) {
          callAction('plugin.delete', { plugin_id: p.id }).then(function () {
            box.remove(); callAction('settings.meta', {}).then(renderAll).catch(function () {});
          }).catch(function (e) { alert('删除失败：' + e.message); });
        }
      });
      right.appendChild(del);
    }
    head.appendChild(name); head.appendChild(right);
    box.appendChild(head);
    if (p.configSchema && p.configSchema.length) {
      var sep = document.createElement('div'); sep.className = 'p-sep'; box.appendChild(sep);
      var form = document.createElement('div');
      currentPluginId = p.id; currentCfg = cfg;
      p.configSchema.forEach(function (f) { buildField(p, f, cfg, form); });
      box.appendChild(form);
    } else {
      var none = document.createElement('div'); none.className = 'p-tag'; none.textContent = '该插件无配置项';
      box.appendChild(none);
    }
    return box;
  }

  function renderAll(data) {
    var plugins = (data && data.plugins) || [];
    listEl.innerHTML = '';
    if (!plugins.length) {
      var e = document.createElement('div'); e.className = 'empty'; e.textContent = '暂无插件';
      listEl.appendChild(e); return;
    }
    var cfgs = (data && data.config) || {};
    plugins.forEach(function (p) {
      var base = {};
      (p.configSchema || []).forEach(function (f) { if (f.default !== undefined) base[f.key] = f.default; });
      var cfg = Object.assign({}, base, cfgs[p.id] || {});
      listEl.appendChild(renderPlugin(p, cfg));
    });
  }

  document.getElementById('btnNormal').addEventListener('click', function () {
    callAction('switch_to_normal', {}).then(function (d) {
      if (d && d.restart) alert('已切换为完整模式，请重启应用生效。');
    }).catch(function () {});
  });

  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'event' && m.event === 'settings.opened') {
      callAction('settings.meta', {}).then(renderAll).catch(function () {});
    } else if (m.type === 'event' && m.event === 'config.updated') {
      var pid = m.data && m.data.plugin_id;
      if (pid) callAction('settings.meta', {}).then(renderAll).catch(function () {});
    }
  });
})();
</script>
</body>
</html>
