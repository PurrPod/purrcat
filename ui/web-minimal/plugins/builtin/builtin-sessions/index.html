<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --label: var(--wm-label, #16191d);
    --label-2nd: var(--wm-label-2nd, #4c5560);
    --dim: var(--wm-label-dim, #8b96a3);
    --bg: var(--wm-bg-input, #f2f4f7);
    --hover: var(--wm-bg-hover, #e9edf1);
    --accent: var(--wm-accent, #16191d);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: transparent; } /* 让 body 圆角外的角落露出壁纸，否则白底糊掉圆角 */
  /* html 一旦带 background-image，body 的底色就不再被传播到 iframe 画布；
     否则底色整块铺满画布并忽略 border-radius，四角会变成直角 */
  html { background-image: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0)); }
  html, body { height: 100%; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c6cdd5; border-radius: 999px; }
  body {
    font-family: var(--wm-font, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    background: var(--wm-bl-0, #fff);
    color: var(--label);
    display: flex;
    flex-direction: column;
    padding: 8px;
    border-radius: 24px;
    overflow: hidden;
  }

  /* ---------- 搜索框 ---------- */
  .search-wrap { flex: none; position: relative; margin: 0 2px 8px; }
  .search-ic {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); pointer-events: none;
  }
  .search-ic svg { display: block; width: 13px; height: 13px; }
  #searchInput {
    width: 100%; height: 30px; font: inherit; font-size: 12.5px; color: var(--label);
    background: var(--bg); border: 1px solid transparent; border-radius: 8px;
    padding: 0 10px 0 27px; outline: none;
  }
  #searchInput::placeholder { color: var(--dim); }
  #searchInput:focus { background: #fff; border-color: rgba(15, 17, 21, 0.16); }

  /* ---------- 小标题（快捷栏 / 项目 / 默认） ---------- */
  .section-head {
    flex: none; display: flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 4px 0 6px; user-select: none; cursor: pointer;
  }
  .section-head.drop { background: rgba(47, 111, 219, 0.10); box-shadow: inset 0 0 0 1px rgba(47, 111, 219, 0.45); border-radius: 6px; }
  .section-title {
    font-size: 12px; font-weight: 600; letter-spacing: .02em;
    color: var(--label);
  }
  .section-acts { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .hbtn {
    width: 24px; height: 24px; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--label-2nd); background: transparent; border: none; border-radius: 6px; cursor: pointer; padding: 0;
  }
  .hbtn:hover { background: var(--hover); color: var(--label); }
  .hbtn svg { display: block; width: 15px; height: 15px; }

  /* ---------- 快捷栏 ---------- */
  .quickbar { display: flex; flex-direction: column; gap: 2px; padding: 0 2px; }
  /* 一行一个：与会话行同构的扁平入口 */
  .qpill {
    width: 100%; height: 30px; display: flex; align-items: center; gap: 8px;
    padding: 0 10px; text-align: left;
    font: inherit; font-size: 13px; font-weight: 400; color: var(--label-2nd);
    background: transparent; border: none; border-radius: 6px; cursor: pointer;
  }
  .qpill:hover { background: var(--hover); color: var(--label); }
  .qpill .qic {
    flex: none; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
    color: var(--dim);
  }
  .qpill:hover .qic { color: var(--label-2nd); }
  .qpill .qic svg { display: block; width: 14px; height: 14px; }
  .qpill .qtx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qempty {
    font: inherit; font-size: 11.5px; color: var(--dim);
    background: none; border: none; cursor: pointer; padding: 0 6px 0 0; text-align: left;
  }
  .qempty:hover { color: var(--label-2nd); }
  .qnone { font-size: 11.5px; color: var(--dim); padding: 0 6px; }

  /* ---------- 分区（快捷栏 / 项目 / 默认） ---------- */
  .list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 0;
    display: flex; flex-direction: column;
  }
  .section { flex: none; display: flex; flex-direction: column; }
  .section + .section { margin-top: 6px; }
  .section-body {
    flex: none;
    display: flex; flex-direction: column; gap: 2px; padding: 2px 0 4px;
  }
  .section.collapsed .section-body { display: none; }
  .hbtn.chev { color: var(--dim); }
  .hbtn.chev svg { transition: transform 0.15s ease; }
  .section.collapsed .hbtn.chev svg { transform: rotate(-90deg); }
  .item {
    position: relative;
    flex: none;
    width: 100%; height: 30px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 400;
    color: var(--label-2nd);
    background: transparent;
    padding: 0 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .item:hover { background: var(--hover); color: var(--label); }
  .item.active { color: var(--label); background: var(--hover); }
  .item-text { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .item-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 行尾动作区：默认隐去，hover 或处于编辑态时显现 */
  .item-acts {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 2px; padding-left: 2px;
    background: var(--hover); border-radius: 6px;
    opacity: 0; transition: opacity 0.12s ease;
  }
  .item:hover .item-acts, .item.editing .item-acts { opacity: 1; }
  .ico {
    width: 22px; height: 22px; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); background: transparent; border: none; border-radius: 4px; cursor: pointer; padding: 0;
  }
  .ico:hover { background: rgba(0, 0, 0, 0.06); color: var(--label); }
  .ico.danger:hover { background: rgba(191, 97, 106, 0.12); color: #bf616a; }
  .ico svg { display: block; width: 14px; height: 14px; }
  /* 行内重命名输入框 */
  .item-title-input {
    width: 100%; height: 22px; font: inherit; color: inherit;
    background: #fff; border: 1px solid var(--accent); border-radius: 4px;
    padding: 0 6px; outline: none;
  }
  /* 删除前的行内确认（不弹宿主级弹窗，插件自带） */
  .confirm { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .confirm-msg { flex: 1; min-width: 0; font-size: 12px; color: #bf616a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cbtn { flex: none; font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 6px; cursor: pointer; border: 1px solid rgba(15, 17, 21, 0.12); background: #fff; color: var(--label-2nd); }
  .cbtn:hover { background: var(--hover); }
  .cbtn.danger { border-color: transparent; background: #bf616a; color: #fff; }
  .cbtn.danger:hover { background: #a94f58; }

  /* ---------- 项目分组（会话分类器） ---------- */
  .pgroup { flex: none; margin-top: 6px; }
  .phead {
    display: flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 6px; border-radius: 6px;
    cursor: pointer; user-select: none;
  }
  .phead:hover { background: var(--hover); }
  .phead.drop { background: rgba(47, 111, 219, 0.10); box-shadow: inset 0 0 0 1px rgba(47, 111, 219, 0.45); }
  .pchev {
    flex: none; width: 12px; height: 12px; display: flex; align-items: center; justify-content: center;
    color: var(--dim); transition: transform 0.15s ease;
  }
  .pchev svg { display: block; width: 12px; height: 12px; }
  .pgroup.collapsed .pchev { transform: rotate(-90deg); }
  .pname {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12.5px; font-weight: 600; color: var(--label);
  }
  /* 行内重命名：直接把项目名变成输入框 */
  .pname-input {
    flex: 1 1 auto; min-width: 0; height: 22px;
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--label);
    background: #fff; border: 1px solid var(--accent); border-radius: 4px;
    padding: 0 6px; outline: none;
  }
  .pacts { flex: none; display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity 0.12s ease; }
  .phead:hover .pacts, .phead.editing .pacts, .phead.confirming .pacts { opacity: 1; }
  .pico {
    width: 20px; height: 20px; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); background: transparent; border: none; border-radius: 4px; cursor: pointer; padding: 0;
  }
  .pico:hover { background: rgba(0, 0, 0, 0.06); color: var(--label); }
  .pico.danger:hover { background: rgba(191, 97, 106, 0.12); color: #bf616a; }
  .pico svg { display: block; width: 13px; height: 13px; }
  .pbody { display: flex; flex-direction: column; gap: 4px; padding: 2px 0 0 8px; }
  .pgroup.collapsed .pbody { display: none; }
  .pempty { padding: 2px 8px 6px; font-size: 11.5px; color: var(--dim); }
  .pdel {
    margin: 2px 0 6px; padding: 8px 8px 9px;
    display: flex; flex-direction: column; gap: 6px;
    background: rgba(255, 255, 255, 0.92); border-radius: 8px;
  }
  .pf-input {
    width: 100%; height: 26px; font: inherit; font-size: 12px; color: var(--label);
    background: #fff; border: 1px solid rgba(15, 17, 21, 0.14); border-radius: 6px;
    padding: 0 7px; outline: none; box-sizing: border-box;
  }
  .pf-input:focus { border-color: var(--accent); }
  .pf-acts { display: flex; gap: 6px; }
  .pf-acts .cbtn { flex: 1; }
  .pf-err { font-size: 11px; color: #bf616a; line-height: 1.4; }
  .pdel-msg { font-size: 12px; color: var(--label-2nd); line-height: 1.45; }
  .pdel .cbtn { width: 100%; }
  .pcreate {
    display: none; flex-direction: column; gap: 6px;
    margin: 2px 0 6px; padding: 8px;
    background: rgba(255, 255, 255, 0.92); border-radius: 8px;
  }
  .pcreate.on { display: flex; }
  .section.collapsed .pcreate { display: none; }
  .mmenu {
    display: flex; flex-direction: column; gap: 2px;
    margin: 2px 0 4px 6px; padding: 4px;
    background: rgba(255, 255, 255, 0.96); border-radius: 8px;
    box-shadow: 0 6px 18px rgba(15, 17, 21, 0.10);
  }
  .mopt {
    width: 100%; text-align: left; font: inherit; font-size: 12px; color: var(--label-2nd);
    background: transparent; border: none; border-radius: 5px; padding: 5px 8px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mopt:hover { background: var(--hover); color: var(--label); }
  .mopt.on { color: var(--label); font-weight: 600; }
  .item.dragging { opacity: 0.45; }

  /* ---------- 空状态 ---------- */
  .section-empty { padding: 4px 10px 6px; font-size: 11.5px; color: var(--dim); }

  /* ---------- Agent 忙碌提示弹层（插件自带，遮罩铺满侧栏） ---------- */
  .busy-mask {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center;
    background: rgba(15, 17, 21, .32); padding: 14px;
  }
  .busy-mask.on { display: flex; }
  .busy {
    width: 100%; max-width: 250px; background: var(--wm-bl-0, #fff); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(15, 17, 21, .22); padding: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  }
  .busy-ic {
    width: 40px; height: 40px; border-radius: 999px; background: #EBCB8B; color: #16191d;
    display: flex; align-items: center; justify-content: center;
    animation: busy-spin 1.4s linear infinite;
  }
  .busy-ic svg { width: 22px; height: 22px; }
  @keyframes busy-spin { to { transform: rotate(360deg); } }
  .busy h3 { font-size: 14px; font-weight: 600; color: var(--label); }
  .busy p { font-size: 12px; color: var(--label-2nd, #4c5560); line-height: 1.55; }
  .busy button {
    width: 100%; font: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 0;
    border-radius: 8px; cursor: pointer; border: 1px solid var(--accent, #16191d);
    background: var(--accent, #16191d); color: #fff;
  }
  .busy button:hover { background: #000; }
</style>
</head>
<body>
  <div class="search-wrap">
    <span class="search-ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
    </span>
    <input id="searchInput" type="text" placeholder="搜索会话或项目" autocomplete="off" spellcheck="false" />
  </div>

  <div id="list" class="list">
    <!-- 快捷栏 -->
    <div class="section" id="quickSection">
      <div class="section-head">
        <span class="section-title">快捷栏</span>
        <div class="section-acts">
          <button id="quickConfigBtn" class="hbtn" type="button" title="配置快捷栏" aria-label="配置快捷栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>
          </button>
          <button id="quickToggleBtn" class="hbtn chev" type="button" title="收起快捷栏" aria-label="收起快捷栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </div>
      <div class="section-body">
        <div id="quickBar" class="quickbar"></div>
      </div>
    </div>

    <!-- 项目：归类过的会话 -->
    <div class="section" id="projectSection">
      <div class="section-head">
        <span class="section-title">项目</span>
        <div class="section-acts">
          <button id="newProjectBtn" class="hbtn" type="button" title="新建项目" aria-label="新建项目">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2Z"/><path d="M12 11v6"/><path d="M9 14h6"/></svg>
          </button>
          <button id="projectToggleBtn" class="hbtn chev" type="button" title="收起项目" aria-label="收起项目">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </div>
      <!-- 新建项目：只需命名，MEMORY.md 由 Agent 维护 -->
      <div class="pcreate" id="pCreate">
        <input id="pCreateName" class="pf-input" placeholder="项目名称" />
        <div class="pf-err" id="pCreateErr"></div>
        <div class="pf-acts">
          <button id="pCreateOk" class="cbtn" type="button">创建</button>
          <button id="pCreateCancel" class="cbtn" type="button">取消</button>
        </div>
      </div>
      <div class="section-body" id="projectBody"></div>
    </div>

    <!-- 默认：未分类会话，直接平铺 -->
    <div class="section" id="defaultSection">
      <div class="section-head" id="defaultHead">
        <span class="section-title">默认</span>
        <div class="section-acts">
          <button id="newBtn" class="hbtn" type="button" title="新建会话" aria-label="新建会话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 8v6"/><path d="M9 11h6"/></svg>
          </button>
          <button id="defaultToggleBtn" class="hbtn chev" type="button" title="收起默认" aria-label="收起默认">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </div>
      <div class="section-body" id="defaultBody"></div>
    </div>
  </div>

  <!-- Agent 忙碌提示：切到其它会话 / 新建 / 拉分支被宿主拦截时弹出 -->
  <div class="busy-mask" id="busyMask">
    <div class="busy">
      <div class="busy-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>
      </div>
      <h3>Agent 正忙</h3>
      <p>喵~ Agent 正在埋头苦干中！为了保护数据安全，请等待当前任务完成后，再切换会话或拉取新分支哦！</p>
      <button id="busyOk" type="button">知道了</button>
    </div>
  </div>

<script>
(function () {
  var seq = 0;
  function callAction(actionId, payload) {
    return new Promise(function (resolve, reject) {
      var id = ++seq;
      function onMsg(e) {
        var m = e.data;
        if (m && m.type === 'callActionResult' && m.id === id) {
          window.removeEventListener('message', onMsg);
          if (m.ok) resolve(m.data); else reject(new Error(m.error));
        }
      }
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type: 'callAction', id: id, actionId: actionId, payload: payload || {} }, '*');
    });
  }

  var listEl = document.getElementById('list');
  var searchInput = document.getElementById('searchInput');
  var quickBarEl = document.getElementById('quickBar');
  var projectBodyEl = document.getElementById('projectBody');
  var defaultBodyEl = document.getElementById('defaultBody');
  var quickSectionEl = document.getElementById('quickSection');
  var projectSectionEl = document.getElementById('projectSection');
  var defaultSectionEl = document.getElementById('defaultSection');
  var busyMask = document.getElementById('busyMask');
  var sessions = [];
  var projects = [];
  var activeId = '';                                  // 当前活动会话（由宿主 state 对账）
  var editingId = '', editingVal = '', confirmingId = '';   // 行内重命名 / 行内删除确认
  var searchQuery = '';                               // 搜索关键词（小写，空串表示不过滤）
  var pluginCfg = {};                                 // 本插件配置（含 quickPlugins）
  var pluginMeta = {};                                // plugin_id -> {name, icon}，用于快捷栏

  // 区块展开状态（默认全部展开）
  var quickOpen = true;
  var projOpen = true;
  var defOpen = true;

  // 项目（会话分类器）本地态
  var UNGROUPED = '__ungrouped__';                    // 「默认」分组的伪项目 id
  var pCollapsed = {};                                // 分组 id -> 是否折叠
  var pEditing = '';                                  // 正在内联编辑的项目 id
  var pEditingName = '';
  var pDeleting = '';                                 // 正在确认删除的项目 id
  var pDeleteError = '';
  var pCreating = false;                              // 新建项目表单是否展开
  var moveMenuId = '';                                // 正在展开「移动到项目」菜单的会话 id
  var dragSessionId = '';                             // 正在拖拽的会话 id
  var dropTarget = '';                                // 拖拽悬停目标（project_id 或 UNGROUPED）

  // 动作图标：与宿主图标集同款线性 SVG（插件自带，不依赖宿主实现）
  var SVG_HEAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';
  var ICON_PENCIL = SVG_HEAD + '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  var ICON_TRASH = SVG_HEAD + '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
  var ICON_CHEV = SVG_HEAD + '<path d="m6 9 6 6 6-6"/></svg>';
  var ICON_PLUS = SVG_HEAD + '<path d="M12 5v14"/><path d="M5 12h14"/></svg>';
  var ICON_MOVE = SVG_HEAD + '<path d="M4 20a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2Z"/><path d="M9 13h6"/><path d="m13 10 3 3-3 3"/></svg>';

  // 面板底色：与会话历史面板一致的白色；透明度可调
  var DEF_OP = 1;
  function applyPanel(cfg) {
    var o = cfg && typeof cfg.opacity === 'number' ? cfg.opacity : DEF_OP;
    o = Math.max(0, Math.min(1, o));
    document.body.style.backgroundColor = 'rgba(255,255,255,' + o.toFixed(2) + ')';
  }
  function applyConfig(cfg) {
    pluginCfg = cfg || {};
    applyPanel(pluginCfg);
    renderQuickBar();
  }
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'configApply') applyConfig(m.config);
    else if (m.type === 'event' && m.event === 'config.updated') { callAction('config.get', { plugin_id: 'builtin-sessions' }).then(applyConfig).catch(function () {}); }
  });
  callAction('config.get', { plugin_id: 'builtin-sessions' }).then(applyConfig).catch(function () {});
  // 快捷栏需要插件名与图标：向宿主要一份当前插件清单
  callAction('settings.meta').then(function (meta) {
    ((meta && meta.plugins) || []).forEach(function (p) {
      pluginMeta[p.id] = { name: p.name || p.id, icon: p.icon || '' };
    });
    renderQuickBar();
  }).catch(function () {});

  /* ---------------- Agent 忙碌提示 ---------------- */
  // 宿主在 Agent 工作时会拒绝切换/新建/拉分支，返回 {status:'busy'}；此处弹出提示。
  function showBusy() { busyMask.classList.add('on'); }
  function hideBusy() { busyMask.classList.remove('on'); }
  document.getElementById('busyOk').addEventListener('click', hideBusy);
  busyMask.addEventListener('click', function (ev) { if (ev.target === busyMask) hideBusy(); });
  function handleBusy(res) { if (res && res.status === 'busy') { showBusy(); return true; } return false; }

  /* ---------------- 项目 / 会话列表 ---------------- */
  function findSession(id) {
    for (var i = 0; i < sessions.length; i++) if (sessions[i].id === id) return sessions[i];
    return null;
  }

  function findProject(pid) {
    for (var i = 0; i < projects.length; i++) if (projects[i].id === pid) return projects[i];
    return null;
  }

  function sessionGroupId(s) { return String((s && s.project_id) || ''); }
  function sessionsIn(pid) {
    return sessions.filter(function (s) { return sessionGroupId(s) === pid; });
  }

  // 重命名：交给宿主（对齐后端 PUT /api/sessions/{id}/rename）；空值或未改动视为取消
  function commitRename(id) {
    if (editingId !== id) return;   // Enter 与 blur 可能连发，只提交一次
    editingId = '';
    var val = String(editingVal || '').trim();
    var cur = findSession(id);
    if (!val || (cur && val === (cur.alias || ''))) { renderList(); return; }
    callAction('session.rename', { session_id: id, alias: val })
      .then(function () { load(); })
      .catch(function () { renderList(); });
  }

  // 删除：交给宿主（对齐后端 DELETE /api/sessions/{id}）
  function doDelete(id) {
    confirmingId = '';
    callAction('session.delete', { session_id: id })
      .then(function () { load(); })
      .catch(function () { renderList(); });
  }

  function iconButton(cls, title, svg, onClick) {
    var b = document.createElement('button');
    b.className = 'ico' + (cls ? ' ' + cls : '');
    b.title = title;
    b.innerHTML = svg;
    b.addEventListener('click', function (ev) { ev.stopPropagation(); onClick(); });
    return b;
  }

  function projectIcon(cls, title, svg, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pico' + (cls ? ' ' + cls : '');
    b.title = title;
    b.innerHTML = svg;
    b.addEventListener('click', function (ev) { ev.stopPropagation(); onClick(); });
    return b;
  }

  /* ----- 项目操作 ----- */
  function openProjectEdit(p) {
    pEditing = p.id;
    pEditingName = p.name || p.id;
    pDeleting = '';
    pDeleteError = '';
    renderList();
  }

  function saveProjectEdit(pid) {
    if (pEditing !== pid) return;   // Enter 与 blur 可能连发，只提交一次
    pEditing = '';
    var name = String(pEditingName || '').trim();
    var cur = projects.find(function (x) { return x.id === pid; });
    if (!name || (cur && name === (cur.name || ''))) { renderList(); return; }
    callAction('projects.update', { project_id: pid, name: name })
      .then(function () { return load(); })
      .catch(function () { renderList(); });
  }

  function deleteProject(pid, deleteSessions) {
    pDeleteError = '';
    callAction('projects.delete', { project_id: pid, delete_sessions: !!deleteSessions })
      .then(function () { pDeleting = ''; return load(); })
      .catch(function (err) {
        pDeleteError = String((err && err.message) || '删除项目失败');
        renderList();
      });
  }

  function moveSessionTo(sessionId, pid) {
    moveMenuId = '';
    callAction('session.moveToProject', { session_id: sessionId, project_id: pid })
      .then(function () { return load(); })
      .catch(function () { renderList(); });
  }

  // 在项目内新建会话：宿主会把该项目 MEMORY.md 的位置与维护约定注入系统提示（仅此路径注入）
  function newSessionInProject(pid) {
    callAction('sessions.new', { project_id: pid })
      .then(function (res) { if (!handleBusy(res)) load(); })
      .catch(function () {});
  }

  function toggleCollapse(gid) {
    pCollapsed[gid] = !pCollapsed[gid];
    renderList();
  }

  /* ----- 拖拽归组 ----- */
  function clearDropHint() {
    var nodes = listEl.querySelectorAll('.drop');
    for (var i = 0; i < nodes.length; i++) nodes[i].classList.remove('drop');
  }

  function attachDropTarget(head, gid) {
    head.addEventListener('dragover', function (ev) {
      if (!dragSessionId) return;
      ev.preventDefault();
      if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
      dropTarget = gid;
      head.classList.add('drop');
    });
    head.addEventListener('dragleave', function (ev) {
      if (ev.relatedTarget && head.contains(ev.relatedTarget)) return;
      if (dropTarget === gid) { dropTarget = ''; head.classList.remove('drop'); }
    });
    head.addEventListener('drop', function (ev) {
      if (!dragSessionId) return;
      ev.preventDefault();
      var sid = dragSessionId;
      dragSessionId = '';
      dropTarget = '';
      clearDropHint();
      moveSessionTo(sid, gid === UNGROUPED ? '' : gid);
    });
  }

  /* ----- 渲染：分组头 ----- */
  function renderGroupHead(gid, name, opts) {
    var editing = !!(opts && opts.editing);
    var head = document.createElement('div');
    head.className = 'phead' + (editing ? ' editing' : '') + (opts && opts.confirming ? ' confirming' : '');
    head.addEventListener('click', function (ev) {
      if (editing || ev.target.closest('button, input')) return;
      toggleCollapse(gid);
    });
    var chev = document.createElement('span');
    chev.className = 'pchev';
    chev.innerHTML = ICON_CHEV;
    head.appendChild(chev);

    if (editing) {
      // 与会话重命名一致：名字就地变成输入框，回车/失焦保存，Esc 取消
      var inp = document.createElement('input');
      inp.className = 'pname-input';
      inp.value = pEditingName;
      inp.addEventListener('click', function (ev) { ev.stopPropagation(); });
      inp.addEventListener('input', function () { pEditingName = inp.value; });
      inp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); saveProjectEdit(gid); }
        else if (ev.key === 'Escape') { ev.preventDefault(); pEditing = ''; renderList(); }
      });
      inp.addEventListener('blur', function () { saveProjectEdit(gid); });
      head.appendChild(inp);
      setTimeout(function () { inp.focus(); inp.select(); }, 0);
    } else {
      var label = document.createElement('span');
      label.className = 'pname';
      label.textContent = name;
      label.title = name;
      head.appendChild(label);
    }

    var acts = document.createElement('div');
    acts.className = 'pacts';
    head.appendChild(acts);
    head._acts = acts;
    return head;
  }

  /* ----- 渲染：项目删除确认 ----- */
  function renderProjectDeletePanel(p, count) {
    var box = document.createElement('div');
    box.className = 'pdel';
    box.addEventListener('click', function (ev) { ev.stopPropagation(); });

    var msg = document.createElement('div');
    msg.className = 'pdel-msg';
    msg.textContent = '删除项目「' + (p.name || p.id) + '」？';
    box.appendChild(msg);

    var only = document.createElement('button');
    only.type = 'button';
    only.className = 'cbtn';
    only.textContent = '仅删除项目（会话回到默认）';
    only.addEventListener('click', function () { deleteProject(p.id, false); });
    box.appendChild(only);

    if (count > 0) {
      var all = document.createElement('button');
      all.type = 'button';
      all.className = 'cbtn danger';
      all.textContent = '连同 ' + count + ' 个会话一起删除';
      all.addEventListener('click', function () { deleteProject(p.id, true); });
      box.appendChild(all);
    }

    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'cbtn';
    cancel.textContent = '取消';
    cancel.addEventListener('click', function () { pDeleting = ''; pDeleteError = ''; renderList(); });
    box.appendChild(cancel);

    if (pDeleteError) {
      var err = document.createElement('div');
      err.className = 'pf-err';
      err.textContent = pDeleteError;
      box.appendChild(err);
    }
    return box;
  }

  /* ----- 渲染：会话行（含移动到项目菜单、拖拽） ----- */
  function renderSessionItem(s) {
    var wrap = document.createElement('div');
    wrap.className = 'sitem';

    var card = document.createElement('div');
    card.className = 'item' + (s.id === activeId ? ' active' : '') + (editingId === s.id ? ' editing' : '') + (dragSessionId === s.id ? ' dragging' : '');
    card.draggable = editingId !== s.id;
    card.addEventListener('click', function () {
      // 点行内按钮/确认条时不切换会话（由子元素自行 stopPropagation）
      callAction('session.switch', { session_id: s.id }).then(handleBusy).catch(function () {});
    });
    card.addEventListener('dragstart', function (ev) {
      dragSessionId = s.id;
      try { ev.dataTransfer.setData('text/plain', s.id); ev.dataTransfer.effectAllowed = 'move'; } catch (_) {}
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function () {
      dragSessionId = '';
      dropTarget = '';
      clearDropHint();
      card.classList.remove('dragging');
    });

    // 删除确认态：整张卡片换成「删除「名称」？[删除][取消]」
    if (confirmingId === s.id) {
      var bar = document.createElement('div');
      bar.className = 'confirm';
      var msg = document.createElement('span');
      msg.className = 'confirm-msg';
      msg.textContent = '删除「' + (s.alias || s.id) + '」？';
      bar.appendChild(msg);
      var yes = document.createElement('button');
      yes.className = 'cbtn danger';
      yes.textContent = '删除';
      yes.addEventListener('click', function (ev) { ev.stopPropagation(); doDelete(s.id); });
      var no = document.createElement('button');
      no.className = 'cbtn';
      no.textContent = '取消';
      no.addEventListener('click', function (ev) { ev.stopPropagation(); confirmingId = ''; renderList(); });
      bar.appendChild(yes);
      bar.appendChild(no);
      card.appendChild(bar);
      wrap.appendChild(card);
      return wrap;
    }

    var text = document.createElement('div');
    text.className = 'item-text';
    if (editingId === s.id) {
      var inp = document.createElement('input');
      inp.className = 'item-title-input';
      inp.value = editingVal;
      inp.addEventListener('click', function (ev) { ev.stopPropagation(); });
      inp.addEventListener('input', function () { editingVal = inp.value; });
      inp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); commitRename(s.id); }
        else if (ev.key === 'Escape') { ev.preventDefault(); editingId = ''; renderList(); }
      });
      inp.addEventListener('blur', function () { commitRename(s.id); });
      text.appendChild(inp);
      setTimeout(function () { inp.focus(); inp.select(); }, 0);
    } else {
      var dt = document.createElement('div');
      dt.className = 'item-title';
      dt.textContent = s.alias || s.id;
      text.appendChild(dt);
    }

    var acts = document.createElement('div');
    acts.className = 'item-acts';
    acts.appendChild(iconButton('', '重命名', ICON_PENCIL, function () {
      editingId = s.id; editingVal = s.alias || ''; confirmingId = ''; moveMenuId = ''; renderList();
    }));
    acts.appendChild(iconButton('', '移动到项目', ICON_MOVE, function () {
      moveMenuId = moveMenuId === s.id ? '' : s.id;
      editingId = ''; confirmingId = ''; renderList();
    }));
    acts.appendChild(iconButton('danger', '删除', ICON_TRASH, function () {
      confirmingId = s.id; editingId = ''; moveMenuId = ''; renderList();
    }));

    card.appendChild(text);
    card.appendChild(acts);
    wrap.appendChild(card);

    // 移动到项目：行内展开菜单（不弹出浮层，避免窄侧栏里被裁切）
    if (moveMenuId === s.id) {
      var menu = document.createElement('div');
      menu.className = 'mmenu';
      menu.addEventListener('click', function (ev) { ev.stopPropagation(); });
      var cur = sessionGroupId(s);
      var options = [{ id: '', name: '默认' }].concat(projects.map(function (p) {
        return { id: p.id, name: p.name || p.id };
      }));
      options.forEach(function (o) {
        var opt = document.createElement('button');
        opt.type = 'button';
        opt.className = 'mopt' + (cur === o.id ? ' on' : '');
        opt.textContent = (cur === o.id ? '✓ ' : '') + o.name;
        opt.title = o.name;
        opt.addEventListener('click', function (ev) { ev.stopPropagation(); moveSessionTo(s.id, o.id); });
        menu.appendChild(opt);
      });
      wrap.appendChild(menu);
    }
    return wrap;
  }

  /* ----- 渲染：项目分组 / 未分类分组 ----- */
  function matchesQuery(text) {
    return !searchQuery || String(text || '').toLowerCase().indexOf(searchQuery) >= 0;
  }

  function matchesSession(s) {
    return matchesQuery(s.alias || s.id);
  }

  function renderProjectGroup(p, items) {
    var pid = p.id;
    var wrap = document.createElement('div');
    wrap.className = 'pgroup' + (!searchQuery && pCollapsed[pid] ? ' collapsed' : '');

    var head = renderGroupHead(pid, p.name || pid, {
      editing: pEditing === pid,
      confirming: pDeleting === pid,
    });
    attachDropTarget(head, pid);
    head._acts.appendChild(projectIcon('', '在此项目中新建会话', ICON_PLUS, function () { newSessionInProject(pid); }));
    head._acts.appendChild(projectIcon('', '重命名项目', ICON_PENCIL, function () { openProjectEdit(p); }));
    head._acts.appendChild(projectIcon('danger', '删除项目', ICON_TRASH, function () {
      pDeleting = pid; pEditing = ''; pDeleteError = ''; pCollapsed[pid] = false; renderList();
    }));
    wrap.appendChild(head);

    var body = document.createElement('div');
    body.className = 'pbody';
    if (pDeleting === pid) body.appendChild(renderProjectDeletePanel(p, items.length));
    if (items.length) {
      items.forEach(function (s) { body.appendChild(renderSessionItem(s)); });
    } else if (pDeleting !== pid) {
      var empty = document.createElement('div');
      empty.className = 'pempty';
      empty.textContent = '暂无会话';
      body.appendChild(empty);
    }
    wrap.appendChild(body);
    return wrap;
  }

  /* ----- 新建项目（内联表单） ----- */
  function syncCreateForm() {
    var form = document.getElementById('pCreate');
    if (form) form.classList.toggle('on', pCreating);
  }

  function startCreateProject() {
    pCreating = true;
    document.getElementById('pCreateErr').textContent = '';
    syncCreateForm();
    setTimeout(function () {
      var el = document.getElementById('pCreateName');
      if (el) el.focus();
    }, 0);
  }

  function createProjectFromInput() {
    var input = document.getElementById('pCreateName');
    var errEl = document.getElementById('pCreateErr');
    var name = String(input.value || '').trim();
    if (!name) {
      errEl.textContent = '项目名称不能为空';
      input.focus();
      return;
    }
    callAction('projects.create', { name: name })
      .then(function () {
        pCreating = false;
        input.value = '';
        errEl.textContent = '';
        syncCreateForm();
        return load();
      })
      .catch(function (err) {
        errEl.textContent = String((err && err.message) || '创建项目失败');
      });
  }

  /* ----- 区块折叠 ----- */
  function applySections() {
    quickSectionEl.classList.toggle('collapsed', !quickOpen);
    projectSectionEl.classList.toggle('collapsed', !projOpen);
    defaultSectionEl.classList.toggle('collapsed', !defOpen);
  }

  /* ----- 渲染：项目 / 默认 ----- */
  function renderList() {
    projectBodyEl.innerHTML = '';
    defaultBodyEl.innerHTML = '';
    var search = !!searchQuery;

    var projectShown = 0;
    projects.forEach(function (p) {
      var all = sessionsIn(p.id);
      var nameHit = search && matchesQuery(p.name || p.id);
      // 搜索时：项目名命中就展示其全部会话，否则只展示命中的会话
      var items = !search ? all : (nameHit ? all : all.filter(matchesSession));
      if (search && !nameHit && !items.length) return;
      projectBodyEl.appendChild(renderProjectGroup(p, items));
      projectShown++;
    });
    if (!projectShown) {
      var pEmpty = document.createElement('div');
      pEmpty.className = 'section-empty';
      pEmpty.textContent = search ? '没有匹配的项目' : '暂无项目';
      projectBodyEl.appendChild(pEmpty);
    }

    var ungrouped = sessionsIn('');
    var items = search ? ungrouped.filter(matchesSession) : ungrouped;
    if (items.length) {
      items.forEach(function (s) { defaultBodyEl.appendChild(renderSessionItem(s)); });
    } else {
      var dEmpty = document.createElement('div');
      dEmpty.className = 'section-empty';
      dEmpty.textContent = search ? '没有匹配的会话' : '暂无会话';
      defaultBodyEl.appendChild(dEmpty);
    }
  }

  /* ----- 快捷栏：配置中心勾选的插件入口 ----- */
  var PLUGIN_ICONS = {
    list: '<path d="M3 6h.01M3 12h.01M3 18h.01"/><path d="M8 6h13M8 12h13M8 18h13"/>',
    history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
    image: '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  };

  function paintPluginIcon(el, meta) {
    var raw = String(meta.icon || '').trim();
    if (raw && raw.charAt(0) === '<') {
      // 插件自带内联 SVG 时直接用（去掉脚本标签）
      el.innerHTML = raw.replace(/<script[\s\S]*?<\/script>/gi, '');
      return;
    }
    if (PLUGIN_ICONS[raw]) {
      el.innerHTML = SVG_HEAD + PLUGIN_ICONS[raw] + '</svg>';
      return;
    }
    el.textContent = raw || ((meta.name || '?').charAt(0) || '?');
  }

  function renderQuickBar() {
    quickBarEl.innerHTML = '';
    var ids = Array.isArray(pluginCfg.quickPlugins) ? pluginCfg.quickPlugins : [];
    if (!ids.length) {
      var hint = document.createElement('button');
      hint.type = 'button';
      hint.className = 'qempty';
      hint.textContent = '在配置中心添加快捷入口';
      hint.addEventListener('click', function () { callAction('settings.open').catch(function () {}); });
      quickBarEl.appendChild(hint);
      return;
    }
    if (searchQuery) {
      // 搜索时快捷入口同样参与过滤，按插件名称或 id 命中
      ids = ids.filter(function (id) {
        var meta = pluginMeta[id];
        return matchesQuery(id) || matchesQuery(meta && meta.name);
      });
      if (!ids.length) {
        var none = document.createElement('div');
        none.className = 'qnone';
        none.textContent = '没有匹配的快捷入口';
        quickBarEl.appendChild(none);
        return;
      }
    }
    ids.forEach(function (id) {
      var meta = pluginMeta[id] || { name: id, icon: '' };
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'qpill';
      b.title = meta.name;
      var ic = document.createElement('span');
      ic.className = 'qic';
      paintPluginIcon(ic, meta);
      var tx = document.createElement('span');
      tx.className = 'qtx';
      tx.textContent = meta.name;
      b.appendChild(ic);
      b.appendChild(tx);
      b.addEventListener('click', function () {
        callAction('plugin.activate', { plugin_id: id }).catch(function () {});
      });
      quickBarEl.appendChild(b);
    });
  }

  function load() {
    return callAction('projects.list')
      .then(function (list) { projects = Array.isArray(list) ? list : []; })
      .catch(function () { projects = []; })
      .then(function () {
        return callAction('sessions.list').then(function (list) {
          return callAction('state.get').then(function (st) {
            activeId = (st && st.activeSessionId) || '';
            sessions = (list || []).map(function (s) { s.active = s.id === activeId; return s; });
            // 刷新后清掉指向已消失会话/项目的编辑、确认、菜单态
            if (editingId && !findSession(editingId)) editingId = '';
            if (confirmingId && !findSession(confirmingId)) confirmingId = '';
            if (moveMenuId && !findSession(moveMenuId)) moveMenuId = '';
            if (pEditing && !findProject(pEditing)) pEditing = '';
            if (pDeleting && !findProject(pDeleting)) pDeleting = '';
            renderList();
          });
        });
      })
      .catch(function () {});
  }

  /* ---------------- 搜索 ---------------- */
  function expandSectionsForSearch() {
    if (!quickOpen || !projOpen || !defOpen) {
      quickOpen = true;
      projOpen = true;
      defOpen = true;
      applySections();
    }
  }
  searchInput.addEventListener('input', function () {
    searchQuery = String(searchInput.value || '').trim().toLowerCase();
    if (searchQuery) expandSectionsForSearch();
    renderQuickBar();
    renderList();
  });
  searchInput.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && searchInput.value) {
      ev.preventDefault();
      searchInput.value = '';
      searchQuery = '';
      renderQuickBar();
      renderList();
    }
  });

  /* ---------------- 标题栏与区块折叠 ---------------- */
  document.getElementById('newBtn').addEventListener('click', function (ev) {
    ev.stopPropagation();
    // 全局「新建会话」= 默认（项目内新建走分组头上的 +）
    callAction('sessions.new').then(function (res) { if (!handleBusy(res)) load(); }).catch(function () {});
  });

  document.getElementById('newProjectBtn').addEventListener('click', function (ev) {
    ev.stopPropagation();
    startCreateProject();
  });
  document.getElementById('pCreateOk').addEventListener('click', function (ev) {
    ev.stopPropagation();
    createProjectFromInput();
  });
  document.getElementById('pCreateCancel').addEventListener('click', function (ev) {
    ev.stopPropagation();
    pCreating = false;
    document.getElementById('pCreateName').value = '';
    document.getElementById('pCreateErr').textContent = '';
    syncCreateForm();
  });
  document.getElementById('pCreateName').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); createProjectFromInput(); }
    else if (ev.key === 'Escape') {
      ev.preventDefault();
      pCreating = false;
      syncCreateForm();
    }
  });

  // 快捷栏右下角画笔：跳到配置中心配置入口
  document.getElementById('quickConfigBtn').addEventListener('click', function (ev) {
    ev.stopPropagation();
    callAction('settings.open').catch(function () {});
  });

  document.getElementById('quickToggleBtn').addEventListener('click', function (ev) {
    ev.stopPropagation();
    quickOpen = !quickOpen;
    applySections();
  });

  document.getElementById('projectToggleBtn').addEventListener('click', function (ev) {
    ev.stopPropagation();
    projOpen = !projOpen;
    applySections();
  });

  document.getElementById('defaultToggleBtn').addEventListener('click', function (ev) {
    ev.stopPropagation();
    defOpen = !defOpen;
    applySections();
  });

  // 点小标题与点右侧箭头行为一致：都可收起/展开
  document.querySelector('#quickSection .section-head').addEventListener('click', function (ev) {
    if (ev.target.closest('button')) return;
    quickOpen = !quickOpen;
    applySections();
  });
  document.querySelector('#projectSection .section-head').addEventListener('click', function (ev) {
    if (ev.target.closest('button')) return;
    projOpen = !projOpen;
    applySections();
  });
  document.getElementById('defaultHead').addEventListener('click', function (ev) {
    if (ev.target.closest('button')) return;
    defOpen = !defOpen;
    applySections();
  });

  // 会话可拖回默认
  attachDropTarget(document.getElementById('defaultHead'), UNGROUPED);

  applySections();

  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object' || m.type !== 'event') return;
    if (m.event === 'session.switched' || m.event === 'conversation.updated' || m.event === 'projects.updated') load();
  });

  load();
})();
</script>
</body>
</html>
