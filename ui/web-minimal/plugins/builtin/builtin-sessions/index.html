<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --label: var(--wm-label, #16191d);
    --label-2nd: var(--wm-label-2nd, #4c5560);
    --dim: var(--wm-label-dim, #8b96a3);
    --bg: var(--wm-bg-input, #f2f4f7);
    --hover: var(--wm-bg-hover, #e9edf1);
    --accent: var(--wm-accent, #567efe);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--wm-font, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    background: transparent;
    color: var(--label);
    display: flex;
    flex-direction: column;
    padding: 10px;
  }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 10px; }
  .head .title { font-size: 13px; font-weight: 600; }
  .head .new { font-size: 12px; color: var(--dim); }

  .primary {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--label);
    background: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
    box-shadow: var(--wm-shadow-sm, 0 1px 2px rgba(15,17,21,.04));
    transition: background 0.12s ease;
  }
  .primary:hover { background: var(--hover); }

  .list { flex: 1; overflow-y: auto; margin-top: 8px; display: flex; flex-direction: column; }
  .item {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    color: var(--label-2nd);
    background: transparent;
    border: none;
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
  }
  .item:hover { background: var(--hover); }
  .item.active { color: var(--accent); font-weight: 600; background: var(--bg); }
  .item-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
</style>
</head>
<body>
  <div class="head">
    <span class="title">会话列表</span>
  </div>
  <button id="newBtn" class="primary">＋ 新建会话</button>
  <div id="list" class="list"></div>

<script>
(function () {
  var seq = 0;
  function callAction(actionId, payload) {
    return new Promise(function (resolve, reject) {
      var id = ++seq;
      function onMsg(e) {
        var m = e.data;
        if (m && m.type === 'callActionResult' && m.id === id) {
          window.removeEventListener('message', onMsg);
          if (m.ok) resolve(m.data); else reject(new Error(m.error));
        }
      }
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type: 'callAction', id: id, actionId: actionId, payload: payload || {} }, '*');
    });
  }

  var listEl = document.getElementById('list');
  var sessions = [];

  function renderList(activeId) {
    listEl.innerHTML = '';
    sessions.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'item' + (s.id === activeId ? ' active' : '');
      var dt = document.createElement('div');
      dt.textContent = s.alias || s.id;
      var meta = document.createElement('div');
      meta.className = 'item-meta';
      meta.textContent = (s.updated_at || '').slice(0, 16);
      b.appendChild(dt);
      b.appendChild(meta);
      b.addEventListener('click', function () { callAction('session.switch', { session_id: s.id }).catch(function () {}); });
      listEl.appendChild(b);
    });
  }

  function load() {
    return callAction('sessions.list')
      .then(function (list) {
        return callAction('state.get').then(function (st) {
          var active = (st && st.activeSessionId) || '';
          sessions = (list || []).map(function (s) { s.active = s.id === active; return s; });
          renderList(active);
        });
      })
      .catch(function () {});
  }

  document.getElementById('newBtn').addEventListener('click', function () {
    callAction('sessions.new').then(function () { load(); }).catch(function () {});
  });

  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object' || m.type !== 'event') return;
    if (m.event === 'session.switched' || m.event === 'conversation.updated') load();
  });

  load();
})();
</script>
</body>
</html>
