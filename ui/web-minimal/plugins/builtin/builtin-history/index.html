<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./history.css">
<link rel="stylesheet" href="/minimal/shared/katex/0.16.11/katex.min.css">
<link rel="stylesheet" href="/minimal/shared/highlight/11.11.1/github.min.css">
<link rel="stylesheet" href="/minimal/plugins/builtin/builtin-history/genui/genui.css">
</head>
<body>
  <div class="sess-head">
    <div class="sess-meta">
      <div class="sess-title" id="sessTitle">新会话</div>
      <div class="sess-id" id="sessId"></div>
    </div>
    <div class="sess-acts">
      <div class="hdr-menu" id="sessRecent">
        <button type="button" class="sess-act" id="sessRecentBtn" title="最近会话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        </button>
        <div class="hdr-menu-panel" id="sessRecentMenu"></div>
      </div>
      <div class="hdr-menu" id="sessBranch">
        <button type="button" class="sess-act" id="sessBranchBtn" title="暂无子代理分支" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4"/><circle cx="12" cy="3" r="1"/><path d="M9 13h.01M15 13h.01"/><path d="M2 13h1M21 13h1"/></svg>
        </button>
        <div class="hdr-menu-panel" id="sessBranchMenu"></div>
      </div>
      <button type="button" class="sess-act" id="sessNewBtn" title="新建会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>
  <div class="list" id="list">
    <div class="empty">暂无消息</div>
  </div>

  <!-- 输入区：空态居中欢迎，非空态贴底（原「输入框」插件并入） -->
  <div class="composer">
    <div class="welcome">
      <div class="wt">有什么可以帮你的？</div>
    </div>
    <div class="bar-wrap">
      <div class="refPanel" id="refPanel">
        <div class="ref-pick">
          <div class="cats" id="cats"></div>
          <div class="right">
            <div class="right-head" id="rName"></div>
            <input class="right-search hide" id="rSearch" type="text" placeholder="搜索" spellcheck="false" autocomplete="off" />
            <div class="items" id="rItems"></div>
          </div>
        </div>
      </div>
      <div class="quotes" id="quotes"></div>
      <!-- 待办 peek：输入框上方一行摘要，点击向上展开查看一条 request -->
      <div class="reqPeek" id="reqPeek" hidden>
        <div class="rp-body" id="rpBody"></div>
        <button class="rp-head" id="rpHead" type="button" aria-expanded="false" aria-controls="rpBody">
          <span class="rp-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          </span>
          <span class="rp-name">待办</span>
          <span class="rp-badge" id="rpBadge">0</span>
          <svg class="rp-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg>
        </button>
      </div>
      <div class="bar">
        <textarea id="input" rows="1" placeholder="输入消息，Shift+Enter 换行"></textarea>
        <div class="bar-foot">
          <div class="foot-left">
            <button class="plusBtn" id="plus" title="添加引用">＋</button>
            <span class="modeWrap" id="modeWrap">
              <button class="modeBtn" id="mode" title="切换 Agent Loop">
                <span id="modeLabel">默认</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <div class="modeMenu" id="modeMenu"></div>
            </span>
          </div>
          <div class="foot-right">
            <span class="ctx-wrap" id="ctxWrap">
              <span class="ctx-btn" aria-label="上下文占用">
                <svg viewBox="0 0 24 24">
                  <circle class="track" cx="12" cy="12" r="9" fill="none" stroke-width="3"></circle>
                  <circle class="arc" id="ctxArc" cx="12" cy="12" r="9" fill="none" stroke-width="3" transform="rotate(-90 12 12)" stroke-dasharray="0 56.55"></circle>
                </svg>
              </span>
              <div class="ctx-tip" id="ctxTip"></div>
            </span>
            <button class="sendBtn" id="send" title="发送" aria-label="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- trace2skill 表单（插件自带弹层，不依赖宿主弹窗能力） -->
  <div class="t2s-mask" id="t2sMask">
    <div class="t2s">
      <h3>trace2skill</h3>
      <div class="seg">
        <button type="button" id="t2sUpgrade" class="on">升级技能</button>
        <button type="button" id="t2sCreate">创建技能</button>
      </div>
      <input id="t2sName" type="text" placeholder="技能名称" spellcheck="false" autocomplete="off" />
      <textarea id="t2sGoal" placeholder="期望：本次会话要沉淀/升级成什么样的技能"></textarea>
      <div class="foot">
        <button type="button" id="t2sCancel">取消</button>
        <button type="button" id="t2sOk" class="primary">确定</button>
      </div>
    </div>
  </div>
  <!-- 文件预览弹窗：点击消息里的本地文件链接唤起（图片 / 视频 / PDF / 文本） -->
  <div class="pv-mask" id="pvMask">
    <div class="pv">
      <div class="pv-head">
        <span class="pv-name" id="pvName"></span>
        <button class="pv-btn" id="pvExt" type="button" title="用系统浏览器打开">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </button>
        <button class="pv-btn" id="pvClose" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </div>
      <div class="pv-body" id="pvBody"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <!-- GFM markdown 引擎（宿主共享运行时，离线可用），暴露 window.marked -->
  <script src="/minimal/shared/marked/12.0.2/marked.min.js"></script>
  <script src="/minimal/shared/katex/0.16.11/katex.min.js"></script>
  <script src="/minimal/shared/highlight/11.11.1/highlight.min.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/core.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/functions.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/render.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/media.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/components-common.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/components-text.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/components-input.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/components-data.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/components-chart.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/components-draw.js"></script>
  <script src="/minimal/plugins/builtin/builtin-history/genui/index.js"></script>

  <script src="./history.js"></script>
</body>
</html>
