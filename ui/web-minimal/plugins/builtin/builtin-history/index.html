<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* html 一旦带 background-image，body 的底色就不再被传播到 iframe 画布；
     否则底色整块铺满画布并忽略 border-radius，四角会变成直角 */
  html { background-image: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0)); }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c6cdd5; border-radius: 999px; }
  /* 会话面板：纵向结构 —— 历史列表(.list 撑满) + 输入区(.composer 贴底)
     面板自带圆角容器（宿主不再裁剪 iframe）；overflow:hidden 保证内部内容被裁进圆角 */
  body {
    font-family: var(--wm-font, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    background: transparent;
    color: var(--wm-label, #16191d);
    display: flex; flex-direction: column;
    border-radius: 18px;
    overflow: hidden;
  }
  .list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }

  /* 子代理分支视图切换栏：对齐完整模式的 MAIN / b1 / b2 分支标签（存在子分支时才出现） */
  .branch-bar { display: none; flex: none; align-items: center; gap: 8px; padding: 12px 20px 0; overflow-x: auto; }
  .branch-bar.on { display: flex; }
  .branch-item { position: relative; flex: none; display: flex; align-items: center; }
  .branch-tab {
    flex: none; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .04em;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--wm-border, rgba(15,17,21,.12));
    background: var(--wm-bl-0, #fff); color: var(--wm-label-2nd, #4c5560);
    transition: background .12s ease, color .12s ease;
  }
  .branch-tab:hover { background: var(--wm-bg-hover, #e9edf1); color: var(--wm-label, #16191d); }
  .branch-tab.active { background: var(--wm-accent, #16191d); color: #fff; border-color: transparent; }
  .branch-tab.has-del { padding-right: 26px; }
  /* 删除分支（含强制终止后台子代理）：hover 时浮现，对齐完整模式分支标签上的 × */
  .branch-del {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; padding: 0; border: none; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: #bf616a; color: #fff; font-size: 11px; line-height: 1;
    opacity: 0; transition: opacity .12s ease;
  }
  .branch-item:hover .branch-del { opacity: 1; }
  .branch-del:hover { background: #a54e56; }

  .row { width: 100%; display: flex; }
  .attachments { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .att {
    font-size: 12px; color: var(--wm-label-2nd, #4c5560);
    background: var(--wm-bg-input, #f2f4f7); border: 1px solid var(--wm-border, rgba(15,17,21,.08));
    border-radius: 999px; padding: 4px 10px; max-width: 320px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; word-break: break-word; }
  .msg.user { margin-left: auto; background: var(--wm-user-bubble, rgba(15,17,21,.10)); border: 1px solid rgba(15,17,21,0.18); white-space: pre-wrap; }
  .msg.assistant { margin-right: auto; background: var(--wm-bg-input, #f2f4f7); border: 1px solid var(--wm-border-soft, rgba(15,17,21,.05)); }

  /* 折叠块 */
  /* 折叠块：标题在上、内容展开在下方（纵向，不再挤到右边） */
  .row.fold { flex-direction: column; align-items: stretch; }
  /* 折叠块整体一个小框：把「标题 + 展开的工具/思考内容」框在一组，比父气泡略浅、同属一体 */
  .row.fold {
    border: 1px solid rgba(15,17,21,0.14);
    background: rgba(15,17,21,0.04);
    border-radius: 10px;
    padding: 4px 6px;
  }
  .cap {
    width: 100%; text-align: left; font-family: inherit; font-size: 12px; font-weight: 600;
    color: var(--wm-label-2nd, #4c5560); background: transparent;
    border: none; border-radius: 6px; padding: 6px 8px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .cap:hover { background: var(--wm-bg-hover, #e9edf1); }
  .cap .arrow { transition: transform 0.15s ease; font-size: 10px; }
  .cap.open .arrow { transform: rotate(90deg); }
  .cap .tag { font-weight: 400; color: var(--wm-label-dim, #8b96a3); }
  .fold-body { display: none; margin-top: 4px; overflow: hidden; }
  .fold-body.open { display: block; }

  /* 思考/工具内容：对齐原 UI（ChatShared 的 ReasoningBubble / 工具气泡）——
     等宽字体、小字号、break-all 保证长串（路径/JSON/URL）也能换行、限高内滚 */
  .reason-body { font-family: var(--wm-mono, ui-monospace, Consolas, monospace); white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.55; color: var(--wm-label-2nd, #4c5560); background: var(--wm-bl-100, #f2f4f7); border-radius: 8px; padding: 8px 10px; max-height: 18rem; overflow-y: auto; }
  .tool-body { font-family: var(--wm-mono, ui-monospace, Consolas, monospace); white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.55; color: var(--wm-label-2nd, #4c5560); background: var(--wm-bl-100, #f2f4f7); border: 1px solid var(--wm-border-soft, rgba(15,17,21,.05)); border-radius: 8px; padding: 8px 10px; max-height: 18rem; overflow-y: auto; }
  .tool-body .tname { font-weight: 700; color: var(--wm-accent, #16191d); margin-bottom: 6px; }
  /* workflow hint：系统注入的工作流提示，比工具块更轻，走虚线边框区分 */
  .hint-body { font-family: var(--wm-mono, ui-monospace, Consolas, monospace); white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.55; color: var(--wm-label-2nd, #4c5560); background: var(--wm-bl-100, #f2f4f7); border: 1px dashed var(--wm-border, rgba(15,17,21,.14)); border-radius: 8px; padding: 8px 10px; max-height: 18rem; overflow-y: auto; }

  /* 流式思考块：Agent 思考期间用 /status 的 live_reasoning 实时透出（对齐原 UI ReasoningBubble 的 live 态） */
  .row.live {
    /* 与 .row.fold 一致：纵向排列，标题在上、思考内容换行在下方 */
    flex-direction: column;
    align-items: stretch;
    border: 1px solid rgba(15,17,21,0.14);
    background: rgba(15,17,21,0.04);
    border-radius: 10px;
    padding: 4px 6px;
  }
  .live-head { display: flex; align-items: center; gap: 6px; padding: 4px 6px; }
  .live-ico { display: flex; align-items: center; color: var(--wm-label-2nd, #4c5560); }
  .live-ico svg { width: 14px; height: 14px; }
  .live-ico.spin svg { animation: wm-spin .9s linear infinite; }
  .live-title { font-size: 12px; font-weight: 600; color: var(--wm-label-2nd, #4c5560); }
  .live-btn {
    margin-left: auto; display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; padding: 0; border: none; border-radius: 6px;
    background: transparent; color: var(--wm-label-dim, #8b96a3); cursor: pointer;
  }
  .live-btn + .live-btn { margin-left: 2px; }
  .live-btn:hover { background: var(--wm-bg-hover, #e9edf1); color: var(--wm-label, #16191d); }
  .live-btn:disabled { opacity: .45; cursor: default; }
  .live-btn svg { width: 14px; height: 14px; }
  .live-btn.collapsed svg { transform: rotate(-90deg); }
  .live-hint { padding: 0 6px 6px; font-size: 12px; color: var(--wm-label-dim, #8b96a3); }
  .live-body { margin-top: 4px; }

  /* 复制按钮：hover 消息时在右上角浮现（对齐完整模式的 ClipboardCopy 交互） */
  .has-copy { position: relative; }
  .copy-btn {
    position: absolute; top: 6px; right: 6px;
    width: 24px; height: 24px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px; cursor: pointer;
    background: rgba(255,255,255,.9); color: var(--wm-label-dim, #8b96a3);
    box-shadow: 0 1px 3px rgba(15,17,21,.12);
    opacity: 0; transition: opacity .12s ease, color .12s ease;
  }
  .has-copy:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { color: var(--wm-label, #16191d); }
  .copy-btn.ok { color: #3f9d63; }
  .copy-btn svg { width: 14px; height: 14px; }

  /* 底部动作行：记忆压缩 / 会话分支 / trace2skill（对齐完整模式的消息区动作按钮） */
  .acts { display: flex; gap: 8px; padding: 2px 0 2px 2px; }
  .act-btn {
    width: 30px; height: 30px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--wm-border, rgba(15,17,21,.12)); border-radius: 8px;
    background: var(--wm-bl-0, #fff); color: var(--wm-label-2nd, #4c5560); cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .act-btn:hover { background: var(--wm-bg-hover, #e9edf1); color: var(--wm-label, #16191d); }
  .act-btn:disabled { opacity: .45; cursor: default; }
  .act-btn svg { width: 16px; height: 16px; }
  .act-btn.busy svg { animation: wm-spin .9s linear infinite; }
  @keyframes wm-spin { to { transform: rotate(360deg); } }

  /* trace2skill 表单弹层（插件自带，覆盖聊天区） */
  .t2s-mask { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(15,17,21,.32); padding: 16px; }
  .t2s-mask.on { display: flex; }
  .t2s {
    width: 100%; max-width: 420px; background: var(--wm-bl-0, #fff); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(15,17,21,.22); padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .t2s h3 { font-size: 14px; font-weight: 600; }
  .t2s .seg { display: flex; gap: 6px; }
  .t2s .seg button { flex: 1; font: inherit; font-size: 12px; padding: 6px 0; border-radius: 8px; cursor: pointer; border: 1px solid var(--wm-border, rgba(15,17,21,.12)); background: var(--wm-bg-input, #f2f4f7); color: var(--wm-label-2nd, #4c5560); }
  .t2s .seg button.on { background: var(--wm-accent, #16191d); color: #fff; border-color: transparent; }
  .t2s input, .t2s textarea { width: 100%; font: inherit; font-size: 13px; color: var(--wm-label, #16191d); background: var(--wm-bg-input, #f2f4f7); border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; outline: none; resize: none; }
  .t2s input:focus, .t2s textarea:focus { border-color: var(--wm-accent, #16191d); background: #fff; }
  .t2s textarea { min-height: 88px; }
  .t2s .foot { display: flex; justify-content: flex-end; gap: 8px; }
  .t2s .foot button { font: inherit; font-size: 12.5px; padding: 7px 14px; border-radius: 8px; cursor: pointer; border: 1px solid var(--wm-border, rgba(15,17,21,.12)); background: #fff; color: var(--wm-label-2nd, #4c5560); }
  .t2s .foot button.primary { background: var(--wm-accent, #16191d); color: #fff; border-color: transparent; }
  .t2s .foot button:disabled { opacity: .5; cursor: default; }

  /* 文件预览弹窗（图片 / 视频 / 文本），对齐完整模式的链接预览弹层 */
  .pv-mask { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(15,17,21,.42); padding: 14px; }
  .pv-mask.on { display: flex; }
  /* 弹窗尺寸按容器比例收缩（不再铺满全屏），高度由内容决定并封顶，避免窄栏里拉成白色长条 */
  .pv { width: min(720px, 92%); height: auto; max-height: 70%; background: var(--wm-bl-0, #fff); border-radius: 14px; box-shadow: 0 12px 40px rgba(15,17,21,.28); display: flex; flex-direction: column; overflow: hidden; }
  .pv-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--wm-border-soft, rgba(15,17,21,.06)); }
  .pv-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--wm-label, #16191d); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-btn { flex: none; width: 26px; height: 26px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 7px; background: transparent; color: var(--wm-label-dim, #8b96a3); cursor: pointer; }
  .pv-btn:hover { background: var(--wm-bg-hover, #e9edf1); color: var(--wm-label, #16191d); }
  .pv-btn svg { width: 15px; height: 15px; }
  .pv-body { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: auto; background: var(--wm-bl-100, #f2f4f7); }
  /* 图片/视频按自身比例缩放，只受容器宽度与视口高度约束，不拉伸也不留大片空白 */
  .pv-img { max-width: 100%; max-height: 46vh; object-fit: contain; }
  .pv-video { max-width: 100%; max-height: 46vh; background: #000; }
  .pv-text { align-self: stretch; width: 100%; margin: 0; padding: 12px 14px; font-family: var(--wm-mono, ui-monospace, Consolas, monospace); font-size: 12.5px; line-height: 1.6; color: var(--wm-label, #16191d); white-space: pre-wrap; word-break: break-all; }
  /* 消息里的本地文件链接（点击唤起预览） */
  .filelink { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; }

  /* 轻量提示（复制成功 / 操作结果） */
  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(6px);
    background: rgba(22,25,29,.92); color: #fff; font-size: 12.5px;
    padding: 7px 14px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; z-index: 40;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty { align-self: center; color: var(--wm-label-dim, #8b96a3); font-size: 13px; margin-top: 48px; }

  /* markdown：作为 flex 子项必须限制宽度（否则长代码/宽表格按 max-content 无限撑开），
     长串（URL/命令）允许任意位置断行，避免字体横向溢出 */
  .md { font-size: 14px; line-height: 1.65; color: var(--wm-label, #16191d); min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3, .md h4 { font-weight: 700; margin: 0.7em 0 0.35em; line-height: 1.3; }
  .md h1 { font-size: 1.25em; } .md h2 { font-size: 1.12em; } .md h3, .md h4 { font-size: 1em; }
  .md p { margin: 0.4em 0; }
  .md ul, .md ol { margin: 0.4em 0; padding-left: 1.4em; }
  .md li { margin: 0.2em 0; }
  .md code { font-family: var(--wm-mono, Consolas, monospace); font-size: 0.88em; background: rgba(15,17,21,.06); border-radius: 4px; padding: 1px 4px; }
  /* 代码块：按容器宽度自动换行（行高随内容增长），不再横向无限延伸 */
  .md pre { background: var(--wm-bg-input, #f2f4f7); border-radius: 8px; padding: 10px 12px; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0.5em 0; }
  .md pre code { background: transparent; padding: 0; display: block; }
  .md blockquote { border-left: 3px solid var(--wm-bl-300, #c7cfd9); margin: 0.4em 0; padding: 2px 12px; color: var(--wm-label-2nd, #4c5560); }
  .md a { color: var(--wm-label, #16191d); text-decoration: none; }
  /* 可点击的链接统一用蓝色区分：外链（带 href）与可预览的本地文件链接 */
  .md a[href], .md a.filelink, .filelink { color: #2f6fdb; }
  .md a:hover { text-decoration: underline; }
  /* 表格：块级化后在自身内部横向滚动，宽表格不会再顶破气泡 */
  .md table { display: block; width: max-content; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0.5em 0; }
  .md th, .md td { border: 1px solid var(--wm-border, rgba(15,17,21,.08)); padding: 4px 8px; }
  .md hr { border: none; border-top: 1px solid var(--wm-border, rgba(15,17,21,.08)); margin: 0.8em 0; }

  /* ================= 输入区（原「输入框」插件，已并入会话面板） ================= */
  /* 输入区贴底（非空态）；空态时撑满并居中（欢迎态） */
  .composer {
    flex: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 12px 20px 16px;
    background: transparent;
  }
  /* 输入条整体（引用面板 + 已选引用 + 输入框）：作为引用浮层的定位基准 */
  .bar-wrap { position: relative; width: 100%; }
  /* 空态：无活动会话/无消息 → 隐藏历史列表与分支栏，输入区居中欢迎 */
  body.centered .list { display: none; }
  body.centered .branch-bar { display: none; }
  body.centered .composer {
    flex: 1 1 auto; justify-content: center; align-items: center;
    width: 100%; max-width: 760px; margin: 0 auto;
  }
  .welcome { display: none; margin-bottom: 16px; text-align: center; }
  body.centered .welcome { display: block; }
  .welcome .wt { font-size: 18px; font-weight: 600; }
  body.centered .bar, body.centered .refPanel { width: 100%; }
  /* 欢迎态：引用面板浮在输入条上方、不参与布局，避免展开时把输入框顶回最底部 */
  body.centered .refPanel.open {
    position: absolute; left: 0; right: 0; bottom: 100%;
    margin-bottom: 8px; z-index: 5;
  }

  /* 引用面板（＋ 展开）：左竖分类 + 右侧条目，鼠标悬浮分类即出列表 */
  .refPanel {
    display: none;
    margin-bottom: 8px;
    background: var(--wm-bl-0, #ffffff);
    border-radius: 12px;
    box-shadow: var(--wm-shadow, 0 4px 16px rgba(15,17,21,.08));
    padding: 10px;
    overflow: hidden;
  }
  .refPanel.open { display: block; }
  /* 固定高度，避免切换分类时面板高低变化造成跳动 */
  .ref-pick { display: flex; gap: 8px; height: min(46vh, 380px); }
  .cats {
    flex: none; width: 128px;
    display: flex; flex-direction: column; gap: 2px;
    border-right: 1px solid var(--wm-border-soft, rgba(15,17,21,.05));
    padding-right: 6px;
    overflow: hidden;
  }
  .cat {
    display: block; width: 100%; text-align: left;
    font-family: inherit; font-size: 13px; color: var(--wm-label, #16191d);
    background: transparent; border: none; border-radius: 8px; padding: 8px 10px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cat:hover { background: var(--wm-bg-hover, #e9edf1); }
  .cat.active { background: var(--wm-bg-hover, #e9edf1); color: var(--wm-accent, #16191d); font-weight: 600; }
  .right {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .right-head { flex: none; padding: 4px 6px 6px; font-size: 12px; color: var(--wm-label-2nd, #4c5560); font-weight: 600; }
  /* 右侧搜索框：仅 Skill / MCP / Graph 分类显示，用于过滤下面的条目 */
  .right-search {
    flex: none; width: 100%; margin-bottom: 6px;
    font-family: inherit; font-size: 12.5px; color: var(--wm-label, #16191d);
    background: var(--wm-bg-input, #f2f4f7); border: 1px solid transparent;
    border-radius: 8px; padding: 6px 9px; outline: none;
  }
  .right-search:focus { border-color: var(--wm-accent, #16191d); background: #fff; }
  .right-search.hide { display: none; }
  .right-search::placeholder { color: var(--wm-label-dim, #8b96a3); }
  .items { flex: 1; min-height: 0; overflow-y: auto; }
  .item {
    display: block; width: 100%; text-align: left; font-size: 12.5px; color: var(--wm-label, #16191d);
    background: transparent; border: none; padding: 7px 8px; border-radius: 8px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item:hover { background: var(--wm-bg-hover, #e9edf1); }
  .item.sel { color: var(--wm-accent, #16191d); font-weight: 600; }
  .lb-empty { font-size: 12px; color: var(--wm-label-dim, #8b96a3); padding: 8px; }

  /* 自托管（心跳）：开关 + 间隔 + GOAL.md 编辑 */
  .sh { display: flex; flex-direction: column; gap: 10px; width: 100%; padding: 2px 6px; }
  .sh-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sh-title { font-size: 13px; font-weight: 600; color: var(--wm-label, #16191d); }
  .sh-switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
  .sh-switch input { opacity: 0; width: 0; height: 0; }
  .sh-slider {
    position: absolute; inset: 0; cursor: pointer; border-radius: 999px;
    background: var(--wm-bl-200, #dfe4ea); transition: background .15s;
  }
  .sh-slider::before {
    content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px;
    background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s;
  }
  .sh-switch input:checked + .sh-slider { background: #2fa36b; }
  .sh-switch input:checked + .sh-slider::before { transform: translateX(18px); }
  .sh-state { font-size: 12px; color: var(--wm-label-2nd, #4c5560); }
  .sh-state.on { color: #2fa36b; font-weight: 600; }
  .sh-field { display: flex; flex-direction: column; gap: 4px; }
  .sh-label { font-size: 12px; font-weight: 600; color: var(--wm-label-2nd, #4c5560); }
  .sh-interval, .sh-goal {
    width: 100%; font: inherit; color: var(--wm-label, #16191d);
    background: var(--wm-bg-input, #f2f4f7); border: 1px solid transparent;
    border-radius: 8px; padding: 7px 9px; outline: none;
  }
  .sh-interval { font-size: 13px; }
  .sh-interval:focus, .sh-goal:focus { border-color: var(--wm-accent, #16191d); }
  .sh-goal { flex: 1; min-height: 96px; resize: none; font-size: 13px; line-height: 1.5; overflow-y: auto; }
  .sh-hint { font-size: 11.5px; color: var(--wm-label-dim, #8b96a3); }
  .sh-msg { font-size: 12px; min-height: 16px; color: var(--wm-accent, #16191d); }
  .sh-msg.err { color: #d64545; }

  /* 已选引用 */
  .quotes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; max-height: 56px; overflow-y: auto; }
  .quote {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--wm-label, #16191d);
    background: var(--wm-bg-input, #f2f4f7); border-radius: 999px; padding: 5px 10px; max-width: 260px;
  }
  .quote span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quote .x { border: none; background: transparent; color: var(--wm-label-dim, #8b96a3); cursor: pointer; font-size: 12px; line-height: 1; }

  /* 输入条：上下两半——上半写字，下半放＋与纸飞机。白底、无边框、仅轻阴影 */
  .bar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--wm-bl-0, #ffffff);
    border: none;
    border-radius: 16px;
    box-shadow: var(--wm-shadow, 0 4px 16px rgba(15,17,21,.08));
    padding: 10px 10px 8px;
  }
  .bar textarea {
    flex: none;
    min-height: 25px;
    max-height: 240px;
    resize: none;
    font-family: inherit; font-size: 14px; line-height: 1.5;
    color: var(--wm-label, #16191d);
    background: transparent;
    border: none; padding: 2px 4px; outline: none;
    overflow-y: auto;
    text-align: left;
  }
  textarea::placeholder { color: var(--wm-label-dim, #8b96a3); }
  .bar-foot {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .foot-left { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .plusBtn {
    flex: none; width: 36px; height: 36px;
    font-size: 19px; line-height: 1; color: var(--wm-label-2nd, #4c5560);
    background: transparent; border: none; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .plusBtn:hover { background: var(--wm-bg-hover, #e9edf1); }
  .plusBtn.active { color: var(--wm-accent, #16191d); }
  /* Mode（Agent Loop）选择：贴＋右侧的小按钮，展开为向上弹出的列表 */
  .modeWrap { position: relative; min-width: 0; }
  .modeBtn {
    display: flex; align-items: center; gap: 3px;
    height: 30px; max-width: 200px; padding: 0 8px;
    font: inherit; font-size: 12px; color: var(--wm-label-2nd, #4c5560);
    background: transparent; border: none; border-radius: 8px; cursor: pointer;
  }
  .modeBtn:hover { background: var(--wm-bg-hover, #e9edf1); }
  .modeBtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modeBtn svg { flex: none; width: 12px; height: 12px; }
  /* Mode 菜单向上弹出：浮层属于同一会话面板（不再被独立输入槽 overflow:hidden 裁掉），
     直接盖在历史列表上方即可 */
  .modeMenu {
    display: none; position: absolute; left: 0; bottom: calc(100% + 6px);
    min-width: 176px; max-height: 240px; overflow-y: auto;
    background: var(--wm-bl-0, #fff); border-radius: 10px;
    box-shadow: var(--wm-shadow, 0 8px 28px rgba(15,17,21,.18)); padding: 6px; z-index: 12;
  }
  .modeMenu.open { display: block; }
  .modeMenu button {
    display: block; width: 100%; text-align: left;
    font: inherit; font-size: 12.5px; color: var(--wm-label, #16191d);
    background: transparent; border: none; border-radius: 8px; padding: 7px 9px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .modeMenu button:hover { background: var(--wm-bg-hover, #e9edf1); }
  .modeMenu button.sel { font-weight: 600; color: var(--wm-accent, #16191d); }
  .foot-right { display: flex; align-items: center; gap: 6px; }
  /* 上下文占用圆环：黑色=已占用，浅色=未占用；hover 弹出数据气泡（对齐完整模式 /api/agent/token） */
  .ctx-wrap { position: relative; display: flex; align-items: center; }
  .ctx-btn { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; color: var(--wm-label, #16191d); }
  .ctx-btn svg { width: 20px; height: 20px; }
  .ctx-btn .track { stroke: rgba(15,17,21,.18); }
  .ctx-btn .arc { stroke: var(--wm-accent, #16191d); transition: stroke-dasharray .3s ease; }
  /* 气泡放在圆环左侧、与圆环同一行：向左展开完全落在面板内；
     宽度按视口自适应并允许换行，避免数值变长时把气泡顶出面板容器 */
  .ctx-tip {
    display: none; position: absolute; right: calc(100% + 10px); bottom: 0;
    width: max-content; max-width: min(320px, calc(100vw - 120px));
    padding: 5px 9px; border-radius: 8px;
    background: var(--wm-bl-0, #fff); box-shadow: var(--wm-shadow, 0 8px 28px rgba(15,17,21,.18));
    font-size: 12px; line-height: 1.4; color: var(--wm-label-2nd, #4c5560);
    white-space: normal; overflow-wrap: anywhere; z-index: 12;
  }
  .ctx-tip b { color: var(--wm-label, #16191d); font-weight: 600; }
  .ctx-wrap:hover .ctx-tip { display: block; }
  .sendBtn {
    flex: none; width: 36px; height: 36px; border: none; border-radius: 12px; cursor: pointer;
    background: var(--wm-accent, #16191d); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .sendBtn:hover { background: var(--wm-accent-hi, #679efe); }
  .sendBtn:disabled { background: var(--wm-bl-200, #dfe4ea); color: #fff; cursor: default; }
  .sendBtn svg { width: 17px; height: 17px; }
</style>
</head>
<body>
  <div class="branch-bar" id="branchBar"></div>
  <div class="list" id="list">
    <div class="empty">暂无消息</div>
  </div>

  <!-- 输入区：空态居中欢迎，非空态贴底（原「输入框」插件并入） -->
  <div class="composer">
    <div class="welcome">
      <div class="wt">有什么可以帮你的？</div>
    </div>
    <div class="bar-wrap">
      <div class="refPanel" id="refPanel">
        <div class="ref-pick">
          <div class="cats" id="cats"></div>
          <div class="right">
            <div class="right-head" id="rName"></div>

            <div class="items" id="rItems"></div>
          </div>
        </div>
      </div>
      <div class="quotes" id="quotes"></div>
      <div class="bar">
        <textarea id="input" rows="1" placeholder="输入消息，Shift+Enter 换行"></textarea>
        <div class="bar-foot">

            <button class="plusBtn" id="plus" title="添加引用">＋</button>
            <span class="modeWrap" id="modeWrap">
              <button class="modeBtn" id="mode" title="切换 Agent Loop">
                <span id="modeLabel">默认</span>

              </button>
              <div class="modeMenu" id="modeMenu"></div>
            </span>
          </div>
          <div class="foot-right">
            <span class="ctx-wrap" id="ctxWrap">
              <span class="ctx-btn" aria-label="上下文占用">
                <svg viewBox="0 0 24 24">
                  <circle class="track" cx="12" cy="12" r="9" fill="none" stroke-width="3"></circle>
                  <circle class="arc" id="ctxArc" cx="12" cy="12" r="9" fill="none" stroke-width="3" transform="rotate(-90 12 12)" stroke-dasharray="0 56.55"></circle>
                </svg>
              </span>
              <div class="ctx-tip" id="ctxTip"></div>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- trace2skill 表单（插件自带弹层，不依赖宿主弹窗能力） -->
  <div class="t2s-mask" id="t2sMask">
    <div class="t2s">
      <h3>trace2skill</h3>
      <div class="seg">
        <button type="button" id="t2sUpgrade" class="on">升级技能</button>
        <button type="button" id="t2sCreate">创建技能</button>
      </div>
      <input id="t2sName" type="text" placeholder="技能名称" spellcheck="false" autocomplete="off" />
      <textarea id="t2sGoal" placeholder="期望：本次会话要沉淀/升级成什么样的技能"></textarea>
      <div class="foot">
        <button type="button" id="t2sCancel">取消</button>
        <button type="button" id="t2sOk" class="primary">确定</button>
      </div>
    </div>
  </div>
  <!-- 文件预览弹窗：点击消息里的本地文件链接唤起（图片 / 视频 / 文本） -->
  <div class="pv-mask" id="pvMask">
    <div class="pv">
      <div class="pv-head">
        <span class="pv-name" id="pvName"></span>
        <button class="pv-btn" id="pvExt" type="button" title="用系统浏览器打开">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </button>
        <button class="pv-btn" id="pvClose" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>

      <div class="pv-body" id="pvBody"></div>
