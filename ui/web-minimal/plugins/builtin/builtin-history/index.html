<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c6cdd5; border-radius: 999px; }
  body {
    font-family: var(--wm-font, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    background: transparent;
    color: var(--wm-label, #16191d);
  }
  .list { height: 100%; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }

  .row { width: 100%; display: flex; }
  .attachments { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .att {
    font-size: 12px; color: var(--wm-label-2nd, #4c5560);
    background: var(--wm-bg-input, #f2f4f7); border: 1px solid var(--wm-border, rgba(15,17,21,.08));
    border-radius: 999px; padding: 4px 10px; max-width: 320px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; word-break: break-word; }
  .msg.user { margin-left: auto; background: var(--wm-user-bubble, rgba(15,17,21,.10)); border: 1px solid rgba(15,17,21,0.18); white-space: pre-wrap; }
  .msg.assistant { margin-right: auto; background: var(--wm-bg-input, #f2f4f7); border: 1px solid var(--wm-border-soft, rgba(15,17,21,.05)); }

  /* 折叠块 */
  /* 折叠块：标题在上、内容展开在下方（纵向，不再挤到右边） */
  .row.fold { flex-direction: column; align-items: stretch; }
  /* 折叠块整体一个小框：把「标题 + 展开的工具/思考内容」框在一组，比父气泡略浅、同属一体 */
  .row.fold {
    border: 1px solid rgba(15,17,21,0.14);
    background: rgba(15,17,21,0.04);
    border-radius: 10px;
    padding: 4px 6px;
  }
  .cap {
    width: 100%; text-align: left; font-family: inherit; font-size: 12px; font-weight: 600;
    color: var(--wm-label-2nd, #4c5560); background: transparent;
    border: none; border-radius: 6px; padding: 6px 8px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .cap:hover { background: var(--wm-bg-hover, #e9edf1); }
  .cap .arrow { transition: transform 0.15s ease; font-size: 10px; }
  .cap.open .arrow { transform: rotate(90deg); }
  .cap .tag { font-weight: 400; color: var(--wm-label-dim, #8b96a3); }
  .fold-body { display: none; margin-top: 4px; overflow: hidden; }
  .fold-body.open { display: block; }

  .reason-body { white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: var(--wm-label-2nd, #4c5560); background: var(--wm-bl-100, #f2f4f7); border-radius: 8px; padding: 8px 10px; }
  .tool-body { font-family: var(--wm-mono, ui-monospace, Consolas, monospace); font-size: 12px; line-height: 1.55; color: var(--wm-label-2nd, #4c5560); background: var(--wm-bl-100, #f2f4f7); border: 1px solid var(--wm-border-soft, rgba(15,17,21,.05)); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  .tool-body .tname { font-weight: 700; color: var(--wm-accent, #16191d); margin-bottom: 6px; }

  .empty { align-self: center; color: var(--wm-label-dim, #8b96a3); font-size: 13px; margin-top: 48px; }

  /* markdown */
  .md { font-size: 14px; line-height: 1.65; color: var(--wm-label, #16191d); }
  .md h1, .md h2, .md h3, .md h4 { font-weight: 700; margin: 0.7em 0 0.35em; line-height: 1.3; }
  .md h1 { font-size: 1.25em; } .md h2 { font-size: 1.12em; } .md h3, .md h4 { font-size: 1em; }
  .md p { margin: 0.4em 0; }
  .md ul, .md ol { margin: 0.4em 0; padding-left: 1.4em; }
  .md li { margin: 0.2em 0; }
  .md code { font-family: var(--wm-mono, Consolas, monospace); font-size: 0.88em; background: rgba(15,17,21,.06); border-radius: 4px; padding: 1px 4px; }
  .md pre { background: var(--wm-bg-input, #f2f4f7); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0.5em 0; }
  .md pre code { background: transparent; padding: 0; display: block; }
  .md blockquote { border-left: 3px solid var(--wm-bl-300, #c7cfd9); margin: 0.4em 0; padding: 2px 12px; color: var(--wm-label-2nd, #4c5560); }
  .md a { color: var(--wm-accent, #16191d); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md table { border-collapse: collapse; margin: 0.5em 0; }
  .md th, .md td { border: 1px solid var(--wm-border, rgba(15,17,21,.08)); padding: 4px 8px; }
  .md hr { border: none; border-top: 1px solid var(--wm-border, rgba(15,17,21,.08)); margin: 0.8em 0; }
</style>
</head>
<body>
  <div class="list" id="list">
    <div class="empty">暂无消息</div>
  </div>

  <!-- GFM markdown 引擎（本地 vendor，离线可用），暴露 window.marked -->
  <script src="/minimal/assets/vendor/marked.min.js"></script>

<script>
(function () {
  var listEl = document.getElementById('list');

  // 会话历史面板底色：白色，可调透明度（输入框悬浮其上，二者不互相遮盖）
  var DEF_OP = 0.82;
  function applyPanel(cfg) {
    var o = cfg && typeof cfg.opacity === 'number' ? cfg.opacity : DEF_OP;
    o = Math.max(0, Math.min(1, o));
    document.body.style.backgroundColor = 'rgba(255,255,255,' + o.toFixed(2) + ')';
  }
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'configApply') applyPanel(m.config);
    else if (m.type === 'event' && m.event === 'config.updated') { callAction('config.get', { plugin_id: 'builtin-history' }).then(applyPanel).catch(function () {}); }
  });
  callAction('config.get', { plugin_id: 'builtin-history' }).then(applyPanel).catch(function () {});

  // ---------- 工具函数 ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; });
  }
  // 提取工具消息的可读文本
  function toolText(content) {
    if (content == null) return '';
    if (typeof content === 'string') {
      try { var o = JSON.parse(content); if (o && typeof o === 'object') return extractFrom(o); } catch (e) {}
      return content;
    }
    if (typeof content === 'object') return extractFrom(content);
    return String(content);
  }
  function extractFrom(o) {
    if (typeof o.content === 'string') return o.content;
    if (typeof o.error === 'string') return o.error;
    if (typeof o.output === 'string' || typeof o.output === 'number') return String(o.output);
    for (var k in o) { var v = o[k]; if (typeof v === 'string' && v.length < 400) return v; }
    try { return JSON.stringify(o); } catch (e) { return ''; }
  }
  // ---- 用户消息解析：只保留 type=user 的正文，*-quote 作附件 ----
  function parseUser(content) {
    var att = [], msgs = [];
    try {
      var d = JSON.parse(content);
      if (d && Array.isArray(d.events)) {
        d.events.forEach(function (ev) {
          var t = ev.type || '', c = ev.content || '';
          if (t === 'user') msgs.push(c);
          else if (['file-quote','skill-quote','tool-quote','mcp-quote','graph-quote'].indexOf(t) >= 0) att.push(c);
        });
      } else { throw 0; }
    } catch (e) {
      // 非事件结构：仅当是普通文本时当作 user 正文；若为 JSON 则忽略，避免把 type=其他 的内容渲染出来
      var s = String(content || '');
      if (!/^[\{\[]/.test(s.trim())) msgs.push(content);
    }
    return { att: att, msgs: msgs };
  }

  // ---------- 折叠控件 ----------
  function makeCollapsible(label, tag, bodyEl) {
    var cap = document.createElement('button');
    cap.className = 'cap';
    cap.innerHTML = '<span class="arrow">▶</span>' + esc(label) + '<span class="tag">' + esc(tag || '') + '</span>';
    var wrap = document.createElement('div');
    bodyEl.className = 'fold-body';
    wrap.appendChild(cap); wrap.appendChild(bodyEl);
    cap.addEventListener('click', function () {
      var open = bodyEl.classList.toggle('open');
      cap.classList.toggle('open', open);
    });
    wrap.className = 'row' + ' fold';
    return wrap;
  }

  // ---------- Markdown 渲染（复用成熟引擎 marked，与主 UI 的 react-markdown + GFM 一致） ----------
  // 兜底：marked 未加载时退化为「转义 + 保留换行」的纯文本，保证内容不丢
  function mdFallback(src) {
    return src.split(/\n{2,}/).map(function (p) {
      p = p.replace(/\n/g, '<br>');
      return p ? '<p>' + esc(p) + '</p>' : '';
    }).join('');
  }
  function mdToHtml(src) {
    src = String(src == null ? '' : src).replace(/\r\n/g, '\n');
    var html = '';
    if (window.marked && window.marked.parse) {
      // gfm=true：表格/删除线/GITHUB 自动链接；breaks=true：单个换行即换行
      try { html = window.marked.parse(src, { gfm: true, breaks: true }); }
      catch (e) { /* 语法异常时兜底 */ }
    }
    if (!html) html = mdFallback(src);
    return safeLinks(html);
  }
  // 链接处理：绝对外链加 target=_blank（在新标签页打开，聊天作为返回点始终保留＝能返回）；
  // 相对/未知/危险链接去掉 href 退化为纯文本（仍可选中复制），避免把 iframe 或新标签页跳成后端 JSON 404
  function safeLinks(html) {
    return String(html).replace(/<a\b([^>]*)>/g, function (m, attrs) {
      var h = /href\s*=\s*(?:"|')([^"']*)(?:"|')/.exec(attrs);
      var hv = h ? h[1] : '';
      if (/^(https?:|mailto:|tel:|#)/i.test(hv)) {
        if (/\btarget\s*=/i.test(attrs)) return m;
        return '<a' + attrs + ' target="_blank" rel="noopener noreferrer">';
      }
      // 去掉 href → 退化为不可跳转的文本
      return '<a' + attrs.replace(/\s+href\s*=\s*(?:"|')(?:[^"']*)(?:"|')/i, '') + '>';
    });
  }

  // ---------- 渲染 ----------
  function bubble(clsName, inner) {
    var d = document.createElement('div');
    d.className = 'msg ' + clsName;
    d.innerHTML = inner;
    return d;
  }

  function renderMessage(m) {
    var role = m.role || 'assistant';
    var wrap = document.createElement('div');
    wrap.className = 'row';
    var col = document.createElement('div');
    col.style.cssText = 'width:100%;display:flex;flex-direction:column;gap:8px;';
    wrap.appendChild(col);

    if (role === 'user') {
      // 严格只渲染 type=user 的正文（*-quote 作为附件展示），其余类型一律不渲染
      var parsed = parseUser(m.content || '');
      if (parsed.att.length) {
        var attWrap = document.createElement('div');
        attWrap.className = 'attachments';
        parsed.att.forEach(function (a) {
          var c = document.createElement('span');
          c.className = 'att';
          c.textContent = a;
          c.title = a;
          attWrap.appendChild(c);
        });
        col.appendChild(attWrap);
      }
      parsed.msgs.forEach(function (txt) {
        if (txt) col.appendChild(bubble('user', esc(txt)));
      });
    } else if (role === 'assistant') {
      col.style.alignItems = 'flex-start';
      if (m.reasoning_content) {
        var rb = document.createElement('div');
        rb.className = 'reason-body';
        rb.textContent = m.reasoning_content;
        col.appendChild(makeCollapsible('思考过程', '', rb));
      }
      if (m.content) {
        var mb = document.createElement('div');
        mb.className = 'md';
        mb.innerHTML = mdToHtml(m.content);
        col.appendChild(mb);
      } else if (!m.reasoning_content && !m.tool_calls) {
        col.appendChild(bubble('assistant', '（无内容）'));
      }
      if (m.tool_calls && m.tool_calls.length) {
        m.tool_calls.forEach(function (tc) {
          var fn = (tc.function && typeof tc.function === 'object') ? tc.function : {};
          var name = fn.name || tc.name || tc.function || 'tool';
          var tb = document.createElement('div');
          tb.className = 'tool-body';
          tb.innerHTML = '<div class="tname">' + esc(name) + '</div>';
          // 渲染工具参数（arguments 为 JSON 字符串，解析后美化；换行用 pre-wrap 保留）
          var rawArgs = fn.arguments != null ? fn.arguments : (tc.arguments != null ? tc.arguments : '');
          if (rawArgs !== '') {
            var argText = '';
            try { var ao = JSON.parse(rawArgs); argText = JSON.stringify(ao, null, 2); }
            catch (e) { argText = String(rawArgs); }
            if (argText) tb.appendChild(document.createTextNode(argText));
          }
          col.appendChild(makeCollapsible('调用工具', name, tb));
        });
      }
    } else {
      // role === 'tool'
      col.style.alignItems = 'flex-start';
      var tb = document.createElement('div');
      tb.className = 'tool-body';
      tb.textContent = toolText(m.content);
      col.appendChild(makeCollapsible('工具结果', m.name, tb));
    }
    return wrap;
  }

  function renderMessages(rows) {
    // 保留已展开的折叠卡片跨轮询恢复，避免刷新自动收起。
    // 折叠块是嵌在消息 col 里的 .row.fold，故直接以每个折叠块的 data-fk(消息序号#块序号)为稳定 key，
    // 不能用消息 wrap 的 data-k（折叠块上取不到），否则收集为空、展开状态丢
    var openSet = {};
    listEl.querySelectorAll('.row.fold[data-fk]').forEach(function (f) {
      var capc = f.querySelector('.cap');
      if (capc && capc.classList.contains('open')) openSet[f.getAttribute('data-fk')] = true;
    });
    listEl.innerHTML = '';
    if (!rows || !rows.length) {
      listEl.innerHTML = '<div class="empty">暂无消息</div>';
      return;
    }
    rows.forEach(function (m, i) {
      var node = renderMessage(m);
      node.setAttribute('data-k', String(i));
      node.querySelectorAll('.row.fold').forEach(function (f, fi) {
        var fk = i + '#' + fi;
        f.setAttribute('data-fk', fk);
        if (openSet[fk]) {
          var cap = f.querySelector('.cap'); if (cap) cap.classList.add('open');
          var fb = f.querySelector('.fold-body'); if (fb) fb.classList.add('open');
        }
      });
      listEl.appendChild(node);
    });
    listEl.scrollTop = listEl.scrollHeight;
  }

  // 合并渲染：服务端历史 + 尚未被服务端确认的本地乐观消息（发送后即时显示，fetch 慢时不同步丢失）
  function renderRows(rows) {
    var server = Array.isArray(rows) ? rows : [];
    var confirmed = {};
    server.forEach(function (r) {
      if (!r || r.role !== 'user') return;
      // 服务端存的用户消息常是 events JSON；与原 UI 一样先解析出正文再判重，
      // 否则本地乐观的"你好"与历史里的"你好"匹配不上，会重复渲染成两条
      var parsed = parseUser(r.content);
      if (parsed.msgs && parsed.msgs.length) {
        parsed.msgs.forEach(function (t) { confirmed[String(t)] = true; });
      } else {
        confirmed[String(r.content)] = true;
      }
    });
    // 已被服务端确认的从本地缓冲移除，避免后续 fetch 再次合并造成重复
    localBuffer = localBuffer.filter(function (u) { return !confirmed[u.content]; });
    renderMessages(server.concat(localBuffer.map(function (u) { return { role: 'user', content: u.content }; })));
  }

  // ---------- 数据装载 ----------
  var seq = 0;
  function callAction(actionId, payload) {
    return new Promise(function (resolve, reject) {
      var id = ++seq;
      function onMsg(e) {
        var m = e.data;
        if (m && m.type === 'callActionResult' && m.id === id) {
          window.removeEventListener('message', onMsg);
          if (m.ok) resolve(m.data); else reject(new Error(m.error));
        }
      }
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type: 'callAction', id: id, actionId: actionId, payload: payload || {} }, '*');
    });
  }

  var activeSessionId = '';
  var localBuffer = [];   // 本会话本地乐观插入的用户消息，等待服务端确认后合并去重

  function load(sessionId) {
    if (!sessionId) { localBuffer = []; renderMessages([]); return; }
    fetch('/api/sessions/' + encodeURIComponent(sessionId))
      .then(function (r) { return r.json(); })
      .then(function (history) {
        var rows = Array.isArray(history) ? history
          : (history && Array.isArray(history.history)) ? history.history
          : (history && Array.isArray(history.messages)) ? history.messages : [];
        renderRows(rows);
      })
      .catch(function () { renderMessages([]); });
  }

  function refresh() {
    callAction('state.get').then(function (st) {
      activeSessionId = (st && st.activeSessionId) || activeSessionId || '';
      load(activeSessionId);
      ensurePoll();
    }).catch(function () { load(activeSessionId); ensurePoll(); });
  }

  // ---------- 轻量轮询刷新（与原 UI 一致的机制）----------
  // 原 UI(ChatPage)：思考期间每 0.5s、非思考每 1.5s 轮询当前会话历史，使 agent 回复自动出现。
  // 复刻同样节奏：activeSessionId 存在即轮询，is_thinking 决定快/慢两档，每次拉全量历史并合并本地乐观消息去重。
  var POLL_FAST = 500, POLL_SLOW = 1500;
  var pollTimer = null;
  function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function setPoll(intv) {
    if (pollTimer && pollTimer._i === intv) return;
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(pollTick, intv);
    pollTimer._i = intv;
  }
  function ensurePoll() {
    if (!activeSessionId) { stopPoll(); return; }
    setPoll(POLL_SLOW);
  }
  function pollTick() {
    if (!activeSessionId) { stopPoll(); return; }
    fetch('/api/sessions/' + encodeURIComponent(activeSessionId) + '/status')
      .then(function (r) { return r.json(); })
      .then(function (st) {
        setPoll(st && st.is_thinking ? POLL_FAST : POLL_SLOW);
        load(activeSessionId);
      })
      .catch(function () { setPoll(POLL_SLOW); });   // 会话暂不可用等：保持慢档，不轰炸
  }

  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object' || m.type !== 'event') return;
    if (m.event === 'session.switched') {
      localBuffer = [];   // 切换会话：本地乐观消息属于旧会话，丢弃
      activeSessionId = m.data && m.data.session_id;
      ensurePoll();
      refresh();
    } else if (m.event === 'conversation.updated') {
      ensurePoll();
      load(activeSessionId);
    } else if (m.event === 'conversation.local') {
      ensurePoll();   // 刚发送，后端即将 busy，立即进入快速轮询
      var evs = (m.data && Array.isArray(m.data.events)) ? m.data.events : [];
      evs.forEach(function (ev) {
        var txt = String(ev && ev.content || ''); if (!txt) return;
        localBuffer.push({ content: txt });
        var empty = listEl.querySelector('.empty'); if (empty) empty.remove();
        listEl.appendChild(renderMessage({ role: 'user', content: txt }));
      });
      if (evs.length) listEl.scrollTop = listEl.scrollHeight;
    }
  });
  refresh();
})();
</script>
</body>
</html>
