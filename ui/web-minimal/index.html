<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PurrCat · 极简模式</title>
  <link rel="stylesheet" href="/minimal/assets/theme.css" />
</head>
<body>
  <!-- 背景 slot：默认白底或自定义壁纸（由背景插件决定） -->
  <div class="wm-slot" data-slot="background" data-layer="background"></div>

  <!-- 顶部细条：可拖拽窗口区域 + 窗口控制按钮（仅 Electron 下显示） -->
  <div class="wm-slot" data-layer="topbar">
    <div class="win-controls">
      <button class="win-btn" id="winMinimize" title="最小化" aria-label="最小化">─</button>
      <button class="win-btn" id="winMaximize" title="最大化" aria-label="最大化">□</button>
      <button class="win-btn close" id="winClose" title="关闭" aria-label="关闭">✕</button>
    </div>
  </div>

  <!-- 左侧栏 slot -->
  <aside class="wm-slot" data-slot="sidebar" data-layer="sidebar"></aside>

  <!-- 主区：历史会话窗口 slot（conversation） + 输入框 slot（input） -->
  <main class="wm-main">
    <section class="wm-slot" data-slot="conversation" data-layer="conversation"></section>
    <section class="wm-slot" data-slot="input" data-layer="input"></section>
  </main>

  <!-- 浮动槽位：桌宠等可自置顶层的放这里（如无插件则隐藏） -->
  <div class="wm-slot wm-pet" data-slot="pet" data-layer="pet"></div>

  <!-- 设置面板 overlay（由 sidebar 的"设置"触发，宿主切 body.settings-open） -->
  <div class="wm-slot" data-slot="settings" data-layer="settings">
    <div class="settings-panel"></div>
  </div>

  <script src="/minimal/assets/host.js"></script>
</body>
</html>
