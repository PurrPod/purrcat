name: PurrCat Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g., 1.0.0, 1.0.0-beta.1)
        required: true
        type: string
      release_type:
        description: Release type
        required: true
        default: beta
        type: choice
        options:
          - alpha
          - beta
          - stable

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Version Format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            echo "Expected format: X.Y.Z or X.Y.Z-alpha.N or X.Y.Z-beta.N"
            exit 1
          fi
          
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check Changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found"
            exit 0
          fi
          
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain entry for version $VERSION"
            exit 1
          fi

      - name: Create Tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          
          TAG="v$VERSION"
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Release
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          
          RELEASE_NOTES=$(awk -v version="$VERSION" '
            $0 == "## [" version "]" { in_section = 1; next }
            /^## / && in_section { exit }
            in_section { print }
          ' CHANGELOG.md)
          
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Release $VERSION"
          fi
          
          gh release create "$TAG" \
            --title "PurrCat $VERSION" \
            --notes "$RELEASE_NOTES" \
            ${{ inputs.release_type != 'stable' && '--prerelease' || '' }}

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Upload UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 7

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cd ui/dist
          zip -r purrcat-ui-${{ inputs.version }}.zip .
          gh release upload "$TAG" purrcat-ui-${{ inputs.version }}.zip

  build-windows:
    name: Build Windows Desktop
    needs: [publish]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync

      - name: Install Node Dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - name: Set Version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version $env:VERSION --no-git-tag-version

      - name: Build UI
        run: npm run build:ui

      - name: Build Backend (PyInstaller)
        run: uv run pyinstaller main.spec --noconfirm

      - name: Build Desktop (electron-builder)
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --publish never

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cd release
          gh release upload "$env:TAG" "PurrCat-Setup-${{ inputs.version }}.exe" "PurrCat-Setup-${{ inputs.version }}.exe.blockmap" "latest.yml" --clobber

  build-macos:
    name: Build macOS Desktop (arm64)
    needs: [publish]
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync

      - name: Install Node Dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - name: Set Version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version $VERSION --no-git-tag-version

      - name: Build UI
        run: npm run build:ui

      - name: Build Backend (PyInstaller)
        run: uv run pyinstaller main.spec --noconfirm

      - name: Build Desktop (electron-builder)
        env:
          GH_TOKEN: ${{ github.token }}
          # 未购买 Apple Developer 证书，禁用签名流程
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cd release
          gh release upload "$TAG" "PurrCat-${{ inputs.version }}-arm64.dmg" --clobber

  build-linux:
    name: Build Linux Desktop (x64)
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install System Dependencies (pyaudio needs portaudio)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync

      - name: Install Node Dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - name: Set Version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version $VERSION --no-git-tag-version

      - name: Build UI
        run: npm run build:ui

      - name: Build Backend (PyInstaller)
        run: uv run pyinstaller main.spec --noconfirm

      - name: Build Desktop (electron-builder)
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --linux --publish never

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cd release
          gh release upload "$TAG" "PurrCat-${{ inputs.version }}-x86_64.AppImage" --clobber
