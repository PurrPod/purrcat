name: PurrCat Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g., 1.0.0, 1.0.0-beta.1)
        required: true
        type: string
      release_type:
        description: Release type
        required: true
        default: beta
        type: choice
        options:
          - alpha
          - beta
          - stable

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Version Format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            echo "Expected format: X.Y.Z or X.Y.Z-alpha.N or X.Y.Z-beta.N"
            exit 1
          fi
          
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check Changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found"
            exit 0
          fi
          
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain entry for version $VERSION"
            exit 1
          fi

      - name: Create Tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          
          TAG="v$VERSION"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 🌟 tag 自动跟随 main：重跑同一版本号时，若 tag 落后于当前 main（修 bug 后
          # 重新发版），强制前移。否则 build job checkout 旧 tag，构建的还是旧代码——
          # 这正是"重跑了 workflow 但白屏修复没生效"的根因
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            # 注意：annotated tag 的 rev-parse 返回标签对象 SHA，必须 ^{commit} 解引用成 commit SHA 再比较
            if [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already at HEAD, reusing"
            else
              echo "Tag $TAG exists but behind HEAD, force-moving"
              git tag -f -a "$TAG" -m "Release $TAG"
              git push -f origin "$TAG"
            fi
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  publish:
    name: Publish Release
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          
          RELEASE_NOTES=$(awk -v version="$VERSION" '
            $0 == "## [" version "]" { in_section = 1; next }
            /^## / && in_section { exit }
            in_section { print }
          ' CHANGELOG.md)
          
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Release $VERSION"
          fi
          
          # 🌟 GitHub API 不允许 prerelease 标记 Latest（HTTP 422:
          # "Latest release cannot be draft or prerelease"）。
          # beta 版想挂 Latest 必须做成完整发布，"beta" 只留在版本号里（OpenClaw 等项目的做法）；
          # 仅 alpha 内测保留 Pre-release 标记（不参与 Latest 评选，主页侧边栏也不展示）。
          IS_ALPHA=$([ "${{ inputs.release_type }}" = "alpha" ] && echo true || echo false)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            if [ "$IS_ALPHA" = "false" ]; then
              gh release edit "$TAG" --prerelease=false --latest
            fi
          else
            if [ "$IS_ALPHA" = "true" ]; then
              gh release create "$TAG" \
                --title "PurrCat $VERSION" \
                --notes "$RELEASE_NOTES" \
                --prerelease
            else
              gh release create "$TAG" \
                --title "PurrCat $VERSION" \
                --notes "$RELEASE_NOTES" \
                --latest
            fi
          fi

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Upload UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 7

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          cd ui/dist
          zip -r purrcat-ui-${{ inputs.version }}.zip .
          gh release upload "$TAG" purrcat-ui-${{ inputs.version }}.zip --clobber

  build-windows:
    name: Build Windows Desktop
    needs: [publish]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync --python 3.12

      - name: Install Node Dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - name: Set Version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version $env:VERSION --no-git-tag-version

      - name: Build UI
        run: npm run build:ui

      - name: Build Backend (PyInstaller)
        run: uv run pyinstaller main.spec --noconfirm

      - name: Build Desktop (electron-builder)
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --publish never

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          cd release
          gh release upload "$env:TAG" "PurrCat-Setup-${{ inputs.version }}.exe" "PurrCat-Setup-${{ inputs.version }}.exe.blockmap" "latest.yml" --clobber

  build-macos:
    name: Build macOS Desktop (arm64)
    needs: [publish]
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # pyaudio 需从源码编译，链接 portaudio；Python 固定 3.12（3.14 生态 wheel 不齐）
      - name: Install System Dependencies (portaudio for pyaudio)
        run: brew install portaudio

      - name: Install Python Dependencies
        run: uv sync --python 3.12

      - name: Install Node Dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - name: Set Version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version $VERSION --no-git-tag-version

      - name: Build UI
        run: npm run build:ui

      - name: Build Backend (PyInstaller)
        run: uv run pyinstaller main.spec --noconfirm

      - name: Build Desktop (electron-builder)
        env:
          GH_TOKEN: ${{ github.token }}
          # 未购买 Apple Developer 证书，禁用签名流程
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          cd release
          gh release upload "$TAG" "PurrCat-${{ inputs.version }}-arm64.dmg" --clobber

