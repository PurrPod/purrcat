name: API Docs

on:
  push:
    branches: [main]
    paths:
      - "src/server/**"
      - "src/utils/**"
      - "main.py"
      - "docs/api/**"
      - "scripts/check_api_docs.py"
      - "scripts/gen_api_docs.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/api-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/server/**"
      - "src/utils/**"
      - "main.py"
      - "docs/api/**"
      - "scripts/check_api_docs.py"
      - "scripts/gen_api_docs.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/api-docs.yml"

jobs:
  api-docs-check:
    name: API Docs Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: uv sync --locked --group dev

      - name: Verify docs/api matches FastAPI contract
        run: uv run python scripts/gen_api_docs.py --check
